<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KPI ekkecars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter+Tight:wght@400;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra bianca con logo e mese, fascia arancio col guadagno, griglia di schede squadrate; tasto + fisso in basso a destra. */
:root{
  color-scheme:light;
  --orange:#EE7A3C; --orange-dk:#D9662A; --orange-soft:#FDF1EA;
  --bg:#F2F1EE; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#E2E2E2; --field:#CFCFCF;
  --ok:#1E7A46; --ok-soft:#E6F2EA; --ko:#C23A26; --ko-soft:#FBEAE6; --dark:#121212; --on-dark:#FFFFFF;
  --band-ink:#FFFFFF; --grid:#ECEBE7; --ok-btn:#1E7A46; --ko-btn:#C23A26;
  --f-head:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-label:"Archivo","Helvetica Neue",Arial,sans-serif;
  --logo-filter:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --orange:#EE7A3C; --orange-dk:#F08A52; --orange-soft:#3A2518;
  --bg:#121212; --surface:#1C1B1A; --ink:#F2F1EE; --muted:#A5A29C; --line:#2E2C2A; --field:#45423F;
  --ok:#3DAA6A; --ok-soft:#16281D; --ko:#E0604B; --ko-soft:#301A16; --dark:#F2F1EE; --on-dark:#121212;
  --band-ink:#FFFFFF; --grid:#2A2826; --logo-filter:invert(1); --ok-btn:#23804F; --ko-btn:#C4402B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --orange:#EE7A3C; --orange-dk:#F08A52; --orange-soft:#3A2518;
  --bg:#121212; --surface:#1C1B1A; --ink:#F2F1EE; --muted:#A5A29C; --line:#2E2C2A; --field:#45423F;
  --ok:#3DAA6A; --ok-soft:#16281D; --ko:#E0604B; --ko-soft:#301A16; --dark:#F2F1EE; --on-dark:#121212;
  --band-ink:#FFFFFF; --grid:#2A2826; --logo-filter:invert(1); --ok-btn:#23804F; --ko-btn:#C4402B;
  color-scheme:dark}
*{box-sizing:border-box;border-radius:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
h1,h2,h3{font-family:var(--f-head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:16px;width:auto;filter:var(--logo-filter);display:block}
.brand .eyebrow{color:var(--orange);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
@media (max-width:560px){.status .long{display:none}}
@media (min-width:561px){.status .short{display:none}}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.status i{width:8px;height:8px;background:var(--muted);display:block}
.status.ok i{background:var(--ok)} .status.local i{background:var(--orange)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:0 0}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:12px 4px 10px;margin-right:18px;font-family:var(--f-label);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.month{display:flex;align-items:center;gap:4px;padding-block:6px}
.month b{font-family:var(--f-head);font-weight:800;font-size:16px;min-width:150px;text-align:center}
.ic{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.ic:hover{border-color:var(--ink)}

main{padding-block:22px 120px;display:flex;flex-direction:column;gap:18px}

/* Fascia guadagno */
.band{background:var(--orange);color:var(--band-ink);padding:24px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end}
.band .eyebrow{opacity:.9}
.band .big{font-family:var(--f-head);font-weight:900;font-size:clamp(40px,8vw,64px);line-height:.95;letter-spacing:-.03em;margin-top:10px}
.band .big small{font-size:.42em;font-weight:800;letter-spacing:0;margin-right:6px}
.band .sub{margin-top:10px;font-size:14px;opacity:.95}
.proj{background:rgba(0,0,0,.14);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.proj .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px}
.proj .row b{font-family:var(--f-head);font-weight:800;font-size:20px}
.meter{height:6px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:#fff;display:block}
.meter u{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.55);display:block;text-decoration:none}
@media (max-width:720px){.band{grid-template-columns:1fr;padding:20px}}

/* Riquadri */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .eyebrow{color:var(--muted);font-size:10.5px}
.tile .v{font-family:var(--f-head);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--muted)}

.card{background:var(--surface);padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:20px;font-weight:800}
.card-h .note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* Grafico */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .lbl{font-family:var(--f-head);font-weight:800;font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;background:var(--dark);color:var(--on-dark);font-size:12.5px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-120%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:2px solid var(--orange);display:inline-block}
.legend i.d{border-top-style:dashed}
.legend i.g{border-top:2px dashed var(--muted)}

/* Aggiornamenti scritti */
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
@media (max-width:900px){.ins{grid-template-columns:1fr}}
.ins article{padding:16px 18px 4px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.ins article + article{padding-left:18px;border-left:1px solid var(--line)}
@media (max-width:900px){.ins article + article{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.ins .eyebrow{color:var(--orange)}
.ins p{margin:0;font-size:14.5px;max-width:62ch}

/* Funnel */
.fun{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.fr .n{font-weight:600;font-size:14px}
.fr .c{font-family:var(--f-head);font-weight:800;font-size:17px;text-align:right}
.fr .bar{grid-column:1/-1;height:8px;background:var(--grid);position:relative}
.fr .bar i{position:absolute;inset:0 auto 0 0;background:var(--orange);display:block}
.fr .r{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.extra{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}

/* Liste e tabelle */
.tbl-wrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-label);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-right:12px}
th.grp{text-align:center;color:var(--ink);border-bottom:2px solid var(--orange)}
th.sep,td.sep{border-left:1px solid var(--line)}
.lnk{background:none;border:0;padding:0 0 2px;border-bottom:2px solid var(--orange);font-family:var(--f-label);font-weight:800;font-size:12px}
.lnk.ko{border-bottom-color:var(--ko);color:var(--ko)}
.empty{padding:20px;border:1px dashed var(--field);color:var(--muted);font-size:14px;text-align:center}
.chip{display:inline-block;font-family:var(--f-label);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--orange);color:var(--orange)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.ko{border-color:var(--ko);color:var(--ko)}
.sale{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sale .a{font-weight:600;overflow-wrap:anywhere}
.sale .m{font-size:13px;color:var(--muted)}
.sale .g{text-align:right;font-family:var(--f-head);font-weight:800}
.sale .g small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:14px;justify-content:flex-end}
@media (max-width:520px){.sale{grid-template-columns:minmax(0,1fr) auto}.sale>.acts,.sale>span:last-child{grid-column:1/-1;justify-content:flex-start}.sale>span:empty{display:none}}

/* Pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;padding:15px 22px;font-family:var(--f-label);font-weight:800;font-size:14px;background:var(--orange);color:#fff;min-height:50px;text-align:center}
.btn:hover{background:var(--orange-dk)}
.btn.dark{background:var(--dark);color:var(--on-dark)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--field)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.ok{background:var(--ok-btn);color:#fff} .btn.ko{background:var(--ko-btn);color:#fff}
.btn.ok:hover,.btn.ko:hover{filter:brightness(1.08)}
.btn.big{min-height:74px;font-size:16px;flex-direction:column;gap:2px}
.btn.big small{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.four{grid-template-columns:1fr 1fr}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.fab{position:fixed;right:max(16px,calc((100vw - 1080px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:64px;height:64px;border:0;background:var(--orange);color:#fff;font-size:34px;line-height:1;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fab:hover{background:var(--orange-dk)}

.resume{background:var(--dark);color:var(--on-dark);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.resume .btn{min-height:40px;padding:10px 16px}

/* Pannelli */
.ov{position:fixed;inset:0;z-index:50;background:rgba(18,18,18,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-size:24px;font-weight:800;line-height:1.1}
.sheet-h h2 span{color:var(--orange)}
.x{background:none;border:0;font-size:26px;line-height:1;padding:2px 6px;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--field);padding:16px}
.pick button:hover{border-color:var(--orange)}
.pick .k{grid-row:1/3;width:44px;height:44px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:18px}
.pick b{font-family:var(--f-head);font-weight:800;font-size:17px}
.pick small{grid-column:2;color:var(--muted);font-size:13px}
.pick .go{grid-row:1/3;grid-column:3;color:var(--orange);font-size:20px}

/* Campi */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:13px;font-weight:600}
.f .h{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{width:100%;background:var(--surface);border:1px solid var(--field);padding:12px 13px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;min-height:48px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
::placeholder{color:var(--muted);opacity:.8}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0;margin-bottom:12px;width:100%}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--orange);padding-bottom:8px;margin-bottom:4px}
.sec-h h3{font-size:18px;font-weight:800}
.sec-h span{font-size:12.5px;color:var(--muted)}
.stps{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:480px){.stps{grid-template-columns:1fr}}
.stp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stp label{font-size:14px;font-weight:500}
.stp-c{display:flex;align-items:stretch;flex:none}
.stp-c button{width:40px;height:44px;border:1px solid var(--field);background:var(--surface);font-size:18px;line-height:1}
.stp-c input{width:62px!important;min-height:44px!important;height:44px;text-align:center;padding:0!important;border-left:0!important;border-right:0!important;font-weight:700;-moz-appearance:textfield}
.stp-c input::-webkit-outer-spin-button,.stp-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}
details.more[open] summary{margin-bottom:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:8px;align-items:start}
.srow .del{height:48px;border:1px solid var(--field);background:var(--surface);color:var(--ko);font-size:20px}
.srow .earn{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}
@media (max-width:480px){.srow{grid-template-columns:minmax(0,1fr) 110px 44px}}
.addl{align-self:flex-start;background:none;border:1px dashed var(--field);padding:10px 14px;font-weight:600;font-size:14px}
.addl:hover{border-color:var(--orange);color:var(--orange)}
.warn{background:var(--orange-soft);border-left:0;padding:10px 12px;font-size:13px}
.sticky-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.conf{background:var(--ko-soft);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}

/* Sessione */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sess-top{position:sticky;top:0;z-index:2;background:var(--dark);color:var(--on-dark);padding-top:env(safe-area-inset-top,0px)}
.sess-top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.sess-top .eyebrow{color:var(--orange)}
.timer{font-family:var(--f-head);font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1}
.sess-top .t{display:flex;align-items:center;gap:14px}
.sess-top .pz{background:transparent;border:1px solid currentColor;color:inherit;padding:8px 12px;font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sess-top .end{background:var(--orange);color:#fff;border:0;padding:10px 16px;font-family:var(--f-label);font-weight:800;font-size:13px}
.sess-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;padding-block:18px 40px;align-items:start}
@media (max-width:860px){.sess-body{grid-template-columns:1fr}}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface)}
.cnt.three{grid-template-columns:repeat(3,1fr)}
.cnt.four{grid-template-columns:repeat(4,1fr)}
.cnt div{padding:12px 10px;text-align:center;border-right:1px solid var(--line);min-width:0}
.cnt div:last-child{border-right:0}
.cnt b{display:block;font-family:var(--f-head);font-weight:900;font-size:24px;line-height:1.1}
.cnt span{font-size:11.5px;color:var(--muted)}
.call{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px}
.call-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.call-h h2{font-size:24px;font-weight:900}
.call-h h2 span{color:var(--orange)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;background:var(--line);display:block}
.steps i.on{background:var(--orange)}
.q{font-family:var(--f-head);font-weight:800;font-size:18px}
.trail{display:flex;gap:6px;flex-wrap:wrap}
.back{align-self:flex-start;background:none;border:0;padding:0 0 3px;border-bottom:2px solid var(--orange);font-family:var(--f-label);font-weight:800;font-size:12px}
.log{background:var(--surface);padding:18px 20px}
.log h3{font-size:17px;font-weight:800;margin-bottom:6px}
.li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.li:last-child{border-bottom:0}
.li-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.li-h b{font-weight:600;overflow-wrap:anywhere}
.li-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.li p{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.sumbox{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.sumbox>div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumbox dt{color:var(--muted)} .sumbox dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (max-width:480px){.sumbox>div{grid-template-columns:1fr;gap:2px}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--dark);color:var(--on-dark);padding:12px 16px;font-size:14px;max-width:calc(100vw - 32px);display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--orange);font-weight:700;padding:0}
.set{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.set{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--orange)}

/* v2: stati, pill, segmenti, storico */
.chip{white-space:normal;max-width:100%;overflow-wrap:anywhere;line-height:1.35}
.dl{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.up{color:var(--ok)} .dl.down{color:var(--ko)} .dl.flat{color:var(--muted);font-weight:600}
.tile .dl{margin-top:2px;white-space:normal}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;background:var(--ok-soft);color:var(--ok)}
.pill.down{background:var(--ko-soft);color:var(--ko)}
.band .pill{background:#FFFFFF;color:#1E7A46}
.band .pill.down{color:#B3321F}
.seg{display:inline-flex;border:1px solid var(--field)}
.seg button{background:var(--surface);border:0;padding:8px 12px;font-family:var(--f-label);font-weight:800;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--field)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.seg.big{align-self:flex-start}.seg.big button{padding:11px 16px;font-size:13px}
.actsum{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px}
.actsum .s{color:var(--muted)}
.legend .sq{width:10px;height:10px;display:inline-block}
.chart .halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tiles.in{grid-template-columns:repeat(4,1fr)}
.tiles.in .tile{background:var(--bg)}
@media (max-width:820px){.tiles.in{grid-template-columns:repeat(2,1fr)}}
.card.sec-l{border-top:4px solid var(--orange)}
.card.sec-d{border-top:4px solid var(--ink)}
.card.sec-r{border-top:4px solid var(--ink)}
.card.sec-t{border-top:4px solid var(--muted)}
.tag-t{color:var(--muted);display:block;margin-bottom:4px}
.reg-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.reg-tools input{flex:1 1 200px;min-width:0}
.li .nt{margin:0;white-space:pre-wrap;font-size:14px}
.tag-r{color:var(--ink);display:block;margin-bottom:4px}
.seg.per{display:grid;grid-template-columns:1fr 1fr;width:100%}.seg.per button{padding:14px 12px;font-size:13px}
.tag-l{color:var(--orange);display:block;margin-bottom:4px}
.tag-d{color:var(--ink);display:block;margin-bottom:4px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hist-top h1{font-size:26px;font-weight:900}
.hist-top .btn{min-height:44px;padding:10px 16px}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
td.hl{color:var(--ok);font-weight:800}
th:first-child,td:first-child{box-shadow:inset -1px 0 0 var(--line)}
.top-right{display:flex;align-items:center;gap:12px}
.th-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.th-btn:hover{border-color:var(--ink)}
.li p b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
'use strict';
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const ymOf=iso=>iso.slice(0,7);
const ymAdd=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const monthName=ym=>MESI[+ym.slice(5)-1];
const aM=m=>(/^a/.test(m)?'ad ':'a ')+m;
const monthLabel=ym=>cap(monthName(ym))+' '+ym.slice(0,4);
const dmy=iso=>iso.slice(8)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4);
const dayShort=iso=>{const d=new Date(iso+'T12:00');return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()].slice(0,3)};
const grp=n=>{const s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"'");return (n<0?'−':'')+s};
const chf=n=>'CHF '+grp(n);
const pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
const pl=(n,one,many)=>n===1?one:many;
const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x)};
const durWords=ms=>{const m=Math.round(ms/60000);if(m<1)return 'meno di un minuto';if(m<60)return m+' '+pl(m,'minuto','minuti');const h=Math.floor(m/60),r=m%60;return h+' '+pl(h,'ora','ore')+(r?' e '+r+' '+pl(r,'minuto','minuti'):'')};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const LKEYS=[['contattati','Chiamate fatte'],['risposti','Risposte'],['interessati','Interessati'],['validi','Validi'],['ricerche','Ricerche fatte'],['proposte','Proposte fatte'],['trattative','Leasing / trattative']];
const LEXTRA=[['permNo','Senza permuta'],['permOk','Permute valide'],['permKo','Permute non valide'],['rem','Remarketing'],['post','Posticipati'],['daValidare','Da validare'],['risentire','Da risentire']];
const DKEYS=[['ricerche','Ricerche fatte'],['prezzi','Prezzi validi'],['autoOk','Auto valide'],['validaz','Validazione auto'],['proposte','Proposte fatte'],['daFare','Proposte da fare'],['trattative','Leasing / trattative']];
const RKEYS=[['ricerche','Ricerche fatte'],['prezzi','Prezzi validi'],['autoOk','Auto valide'],['validaz','Validazione auto'],['proposte','Proposte fatte'],['daFare','Proposte da fare']];
const TNAME={lead:'Chiamate lead',dir:'Vendita diretta',ric:'Ricerche personali',team:'Ricerche team'};
const MAINK={lead:'L',dir:'D',ric:'R',team:'T'};
const emptyPart=p=>({L:emptyL,D:emptyD,R:emptyR,T:emptyR}[p])();
const emptyL=()=>({contattati:0,risposti:0,interessati:0,validi:0,ricerche:0,proposte:0,trattative:0,permNo:0,permOk:0,permKo:0,rem:0,post:0,daValidare:0,risentire:0,min:0});
const emptyD=()=>({ricerche:0,prezzi:0,autoOk:0,validaz:0,proposte:0,daFare:0,trattative:0,min:0});
const emptyR=()=>({ricerche:0,prezzi:0,autoOk:0,validaz:0,proposte:0,daFare:0,min:0});
const DEF_SET={pctOnline:18,pctDiretta:15,goal:0,goalChiusure:0,sabato:false,callsDay:0,searchDay:0};

/* ---------- archivio dati ---------- */
const CACHE='ekk-kpi-cache-v1', DRAFT='ekk-kpi-session-v1';
let S={days:{},sales:{},sessions:{},settings:{...DEF_SET}}, dirty=false;
const cached=lsGet(CACHE); if(cached){S={days:cached.days||{},sales:cached.sales||{},sessions:cached.sessions||{},settings:{...DEF_SET,...(cached.settings||{})}};dirty=!!cached.dirty}
let db=null, mode='init';
const saveCache=()=>lsSet(CACHE,{...S,dirty});
const setStatus=()=>{const el=$('#status');el.className='status '+(mode==='db'?'ok':mode==='local'?'local':'');
  el.querySelector('span').innerHTML=mode==='db'?'<span class="long">Dati salvati online</span><span class="short">Salvato</span>':mode==='local'?'<span class="long">Dati salvati solo su questo dispositivo</span><span class="short">Solo locale</span>':'Caricamento…'};
async function put(col,id,data){
  if(col==='settings')S.settings={...DEF_SET,...data};else S[col][id]=data;
  if(!db)dirty=true; saveCache(); renderView();
  if(db){try{await db.collection(col).doc(id).set(data)}catch(e){toast('Salvataggio non riuscito. Controlla la connessione e riprova.')}}
}
async function del(col,id){
  delete S[col][id]; if(!db)dirty=true; saveCache(); renderView();
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast('Eliminazione non riuscita. Riprova.')}}
}
async function initStore(){
  let tries=0; while(!(window.claude&&window.claude.use)&&tries<20){await new Promise(r=>setTimeout(r,150));tries++}
  if(window.claude&&window.claude.use){try{db=await window.claude.use('db')}catch(e){db=null}}
  if(!db){mode='local';setStatus();return}
  mode='db';setStatus();
  const first={};
  const sub=col=>db.collection(col).limit(1000).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    if(!first[col]){first[col]=true;const up=dirty&&snap.empty&&Object.keys(S[col]).length;
      if(up)Object.entries(S[col]).forEach(([id,v])=>db.collection(col).doc(id).set(v).catch(()=>{}));
      doneFirst();if(up)return;
    }
    S[col]=o;saveCache();renderView();
  },()=>{mode='local';setStatus()});
  let firstCount=0;const doneFirst=()=>{if(++firstCount===4&&dirty){dirty=false;saveCache()}};
  sub('days');sub('sales');sub('sessions');
  let setFirst=false;
  db.collection('settings').doc('main').onSnapshot(d=>{
    if(!setFirst){setFirst=true;doneFirst()}
    if(d.exists)S.settings={...DEF_SET,...d.data()};
    else if(dirty)db.collection('settings').doc('main').set(S.settings).catch(()=>{});
    saveCache();renderView();
  },()=>{});
}

/* ---------- calcoli ---------- */
function workdays(ym,uptoDay){
  const [y,m]=ym.split('-').map(Number), n=new Date(y,m,0).getDate(); let c=0;
  for(let d=1;d<=Math.min(n,uptoDay??n);d++){const w=new Date(y,m-1,d).getDay();if(w>0&&(w<6||S.settings.sabato))c++}
  return c;
}
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
function stats(ym,cut){
  const L=emptyL(),D=emptyD(),R=emptyR(),T=emptyR();let active=0;
  Object.values(S.days).forEach(d=>{if(!d.date||ymOf(d.date)!==ym||(cut&&d.date>cut))return;let any=0;
    for(const k in L){L[k]+=+(d.L?.[k]||0);any+=+(d.L?.[k]||0)} for(const k in D){D[k]+=+(d.D?.[k]||0);any+=+(d.D?.[k]||0)} for(const k in R){R[k]+=+(d.R?.[k]||0);any+=+(d.R?.[k]||0)} for(const k in T){T[k]+=+(d.T?.[k]||0);any+=+(d.T?.[k]||0)} if(any)active++});
  const sales=Object.entries(S.sales).map(([id,s])=>({id,...s})).filter(s=>s.date&&ymOf(s.date)===ym&&!(cut&&s.date>cut)).sort((a,b)=>b.date.localeCompare(a.date));
  const on=sales.filter(s=>s.channel==='online'), di=sales.filter(s=>s.channel==='diretta');
  const mOn=on.reduce((a,s)=>a+(+s.margine||0),0), mDi=di.reduce((a,s)=>a+(+s.margine||0),0);
  const gOn=mOn*S.settings.pctOnline/100, gDi=mDi*S.settings.pctDiretta/100;
  L.chiusure=on.length;D.chiusure=di.length;
  const hasData=active>0||sales.length>0;
  return {ym,L,D,R,T,active,sales,nOn:on.length,nDi:di.length,mOn,mDi,m:mOn+mDi,gOn,gDi,g:gOn+gDi,n:sales.length,hasData};
}

const LSTEPS=[['risposti','contattati','Risposte su contattati','Prova fasce orarie diverse (inizio mattina, pausa pranzo, dopo le 17) e richiama entro 24 ore chi non ha risposto.'],

 ['validi','interessati','Validi su interessati','Molti interessati non sono validi: annota il motivo nelle note e segnala le campagne da cui arrivano, così si corregge il targeting.'],
 ['ricerche','validi','Ricerche su validi','Chiudi la chiamata con un passo concreto: conferma subito la ricerca e fissa quando presenterai la proposta.'],

 ['trattative','proposte','Trattative su proposte','Presenta la proposta in videochiamata e chiedi subito un riscontro su prezzo e rata.'],

 ['autoOk','prezzi','Auto valide su prezzi validi','Controlla subito stato e storico dell\'auto, così non perdi tempo su offerte che poi scarti.'],
 ['proposte','autoOk','Proposte su auto valide','Quando l\'auto è valida, manda subito la proposta: ogni giorno di attesa la rende meno interessante.']];
function weakest(steps,cur,prev){
  const c=steps.map(([to,from,label,tip])=>({label,tip,from:cur[from],to:cur[to],r:cur[from]?cur[to]/cur[from]:null,
    pr:prev&&prev[from]>=5?prev[to]/prev[from]:null})).filter(x=>x.from>=5);
  if(!c.length)return null;
  const withPrev=c.filter(x=>x.pr!=null).map(x=>({...x,d:x.r-x.pr})).sort((a,b)=>a.d-b.d);
  if(withPrev.length&&withPrev[0].d<=-0.05)return {...withPrev[0],kind:'drop'};
  const pool=c.length>1?c.slice(1):c; // il tasso del primo passaggio è sempre il più basso: lo escludo se ci sono altri dati
  return {...pool.slice().sort((a,b)=>a.r-b.r)[0],kind:'low'};
}
function insights(st){
  const out=[], prevSt=stats(ymAdd(st.ym,-1)), p=projection(st), set=S.settings, mn=monthName(st.ym);

    a=st.n?(st.n+' '+pl(st.n,'chiusura','chiusure')+' per '+chf(st.m)+' di margine: il tuo guadagno è '+chf(st.g)+'.')

    const tm=st.L.min+st.R.min+st.T.min, rm=st.R.min+st.T.min;
    if(tm)a+=' Tempo in sessione: '+hm(tm)+(st.L.min&&rm?' ('+hm(st.L.min)+' di chiamate e '+hm(rm)+' di ricerche)':'')+'.';
    if(st.R.ricerche)a+=' Ricerche personali: '+st.R.ricerche+', con '+st.R.proposte+' '+pl(st.R.proposte,'proposta','proposte')+'.';
    if(st.T.ricerche)a+=' Ricerche team: '+st.T.ricerche+', con '+st.T.proposte+' '+pl(st.T.proposte,'proposta','proposte')+'.';
  }
  out.push(['Andamento del mese',a]);
  // Proiezione
  let b='';
  if(future)b='Le proiezioni compaiono quando inizi a inserire i dati del mese.';
  else if(p){
    b=st.g>0?'Al ritmo attuale chiudi '+mn+' con circa '+chf(p.g)+' di guadagno ('+chf(p.m)+' di margine).':'Per ora non ci sono chiusure: la proiezione si aggiorna con la prima.';
    if(prevSt.g>0)b+=' '+cap(aM(monthName(prevSt.ym)))+' avevi guadagnato '+chf(prevSt.g)+'.';
    if(set.goal>0){
      if(p.g>=set.goal&&st.g>0)b+=' Sei in linea con l\'obiettivo di '+chf(set.goal)+'.';
      else{const gap=Math.max(set.goal-st.g,0);
        const pool=[st,prevSt,stats(ymAdd(st.ym,-2))], ns=pool.reduce((x,s)=>x+s.n,0), gs=pool.reduce((x,s)=>x+s.g,0);
        b+=' Per l\'obiettivo di '+chf(set.goal)+' ti mancano '+chf(gap);
        if(ns&&gap>0){const k=Math.ceil(gap/(gs/ns));b+=': con un guadagno medio di '+chf(gs/ns)+' a chiusura '+pl(k,'serve','servono')+' circa '+k+' '+pl(k,'chiusura','chiusure')+(p.rem>0?' nei '+p.rem+' '+pl(p.rem,'giorno lavorativo','giorni lavorativi')+' che restano.':' entro oggi, ultimo giorno lavorativo del mese.')}
        else b+='.';}
    }
    if(p.pace>0){const nx=ymAdd(st.ym,1);b+=' Con lo stesso ritmo, '+aM(monthName(nx))+' puoi arrivare a circa '+chf(p.pace*workdays(nx))+'.'}
  } else if(st.ym<cur){
    b=st.hasData?'Mese concluso con '+chf(st.g)+' di guadagno':'Mese senza dati registrati';
    if(set.goal>0&&st.hasData)b+=st.g>=set.goal?': obiettivo di '+chf(set.goal)+' raggiunto.':': ti sono mancati '+chf(set.goal-st.g)+' all\'obiettivo di '+chf(set.goal)+'.';
    else b+='.';
  } else b='La proiezione parte dal primo giorno lavorativo del mese.';
  out.push(['Proiezione',b]);
  // Dove migliorare
  let c=[];
  const wl=weakest(LSTEPS,st.L,prevSt.hasData?prevSt.L:null), wd=weakest(RSTEPS,st.R,prevSt.hasData?prevSt.R:null);
  const say=(w,tag)=>w.kind==='drop'?tag+': '+w.label.toLowerCase()+' al '+Math.round(w.r*100)+'%, contro il '+Math.round(w.pr*100)+'% di '+monthName(prevSt.ym)+'. '+w.tip
    :tag+': il passaggio più debole è '+w.label.toLowerCase()+' ('+Math.round(w.r*100)+'%). '+w.tip;
  if(wl)c.push(say(wl,'Leads'));
  if(wd)c.push(say(wd,'Ricerche personali'));
  const open=st.L.trattative-st.L.chiusure;
  if(open>0)c.push('Hai '+open+' '+pl(open,'trattativa aperta','trattative aperte')+' senza chiusura in questo mese: sono la strada più corta verso il guadagno.');
  const rc=[];if(st.L.post)rc.push(st.L.post+' '+pl(st.L.post,'lead posticipato','lead posticipati'));if(st.L.daValidare)rc.push(st.L.daValidare+' da validare');if(st.L.risentire)rc.push(st.L.risentire+' da risentire');
  if(rc.length)c.push('Da richiamare: '+rc.join(', ').replace(/, ([^,]*)$/,' e $1')+'.');
  if(!c.length)c.push(future?'Nessun dato ancora.':'Servono almeno 5 contatti per passaggio per indicarti dove migliorare. Continua a registrare le sessioni.');
  out.push(['Dove migliorare',c.join(' ')]);
  return out;
}

function nthWorkday(ym,n){

  for(let d=1;d<=N;d++){const w=new Date(y,m-1,d).getDay();if(w>0&&(w<6||S.settings.sabato)){c++;if(c>=n)return ym+'-'+pad(d)}}
  return ym+'-'+pad(N);
}

function delta(cur,prev,label,inverse){ // freccia verde/rossa con percentuale
  if(!(prev>0)||cur==null)return '';
  const r=(cur-prev)/prev, good=inverse?r<=0:r>=0, v=Math.round(Math.abs(r)*100);
  if(v===0)return '<span class="dl flat">= '+esc(label)+'</span>';
  return '<span class="dl '+(good?'up':'down')+'">'+(r>=0?'▲':'▼')+' '+v+'% '+esc(label)+'</span>';
}
function ptDelta(r,pr){
  if(r==null||pr==null)return '';

function sessionRates(ymX){
  const o={lead:{ms:0,calls:0,ric:0},src:{ms:0,ric:0,prop:0}};
  Object.values(S.sessions).forEach(s=>{if(!s.date||ymOf(s.date)!==ymX)return;const P=partsOf(s);
    if(s.type==='lead'){o.lead.ms+=s.durationMs||0;o.lead.calls+=P.L?.contattati||0;o.lead.ric+=P.L?.ricerche||0}
    else if(s.type==='ric'||s.type==='team'){const m=P[MAINK[s.type]]||{};o.src.ms+=s.durationMs||0;o.src.ric+=m.ricerche||0;o.src.prop+=m.proposte||0}});
  const h=ms=>ms/3600000;

    el.addEventListener('pointermove',show);el.addEventListener('pointerdown',show);

function drawChart(){
  const box=$('#chart');if(!box)return;
  const st=stats(ym), p=projection(st), N=daysIn(ym), goal=S.settings.goal, tot=workdays(ym);
  const lastDay=ym===ymOf(today())?+today().slice(8):(ym<ymOf(today())?N:0);
  const per=new Array(N+1).fill(0); st.sales.forEach(s=>{per[+s.date.slice(8)]+=earn(s)});
  const cum=[0];for(let d=1;d<=N;d++)cum[d]=cum[d-1]+per[d];
  const pace=d=>goal>0&&tot?goal*workdays(ym,d)/tot:null;
  const W=Math.max(box.clientWidth,280), H=Math.round(Math.min(280,Math.max(200,W*.34))), L=48,R=18,T=22,B=28;
  const top=Math.max(p?p.g:0,goal||0,cum[Math.max(lastDay,0)]||0,100)*1.12;
  const step=niceStep(top/4), ymax=Math.ceil(top/step)*step;
  const x=d=>L+(d-1)/(N-1)*(W-L-R), y=v=>T+(1-v/ymax)*(H-T-B);
  const ahead=goal>0&&lastDay>=1?cum[lastDay]>=pace(lastDay):null;
  const col=ahead==null?'var(--orange)':ahead?'var(--ok)':'var(--ko)';
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Guadagno cumulato di '+monthName(ym)+'">'
   +'<defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".32"/><stop offset="1" stop-color="'+col+'" stop-opacity=".02"/></linearGradient></defs>';
  for(let v=0;v<=ymax+1e-6;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v>=1000?dec(v/1000)+'k':grp(v))+'</text>';
  [1,8,15,22,N].forEach(d=>{s+='<text class="ax" x="'+x(d)+'" y="'+(H-8)+'" text-anchor="'+(d===1?'start':d===N?'end':'middle')+'">'+d+'</text>'});
  if(goal>0){let pd='M'+x(1)+' '+y(pace(1));for(let d=2;d<=N;d++)pd+=' L'+x(d)+' '+y(pace(d));
    s+='<path d="'+pd+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>';}
  if(lastDay>=1){
    let d='M'+x(1)+' '+y(cum[1]);for(let i=2;i<=lastDay;i++)d+=' L'+x(i)+' '+y(cum[i]);
    s+='<path d="'+d+' L'+x(lastDay)+' '+y(0)+' L'+x(1)+' '+y(0)+'Z" fill="url(#gfill)" stroke="none"/>';
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    for(let i=1;i<=lastDay;i++)if(per[i]>0)s+='<circle cx="'+x(i)+'" cy="'+y(cum[i])+'" r="4" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';
    if(p&&lastDay<N)s+='<line x1="'+x(lastDay)+'" y1="'+y(cum[lastDay])+'" x2="'+x(N)+'" y2="'+y(p.g)+'" stroke="'+col+'" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/><circle cx="'+x(N)+'" cy="'+y(p.g)+'" r="4" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>';
    s+='<circle cx="'+x(lastDay)+'" cy="'+y(cum[lastDay])+'" r="6.5" fill="'+col+'" stroke="var(--surface)" stroke-width="2.5"/>';
    const lx=x(lastDay), anchor=lx>W-140?'end':'start', ly=y(cum[lastDay]);
    const near=false;
    s+='<text class="lbl" x="'+(lx+(anchor==='end'?-12:12))+'" y="'+(near||ly<T+16?ly+22:ly-12)+'" text-anchor="'+anchor+'">'+chf(cum[lastDay])+'</text>';
  }
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect class="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/></svg><div class="tip" hidden></div>';
  box.innerHTML=s;
  const xh=box.querySelector('.xh');
  setupHover(box,'.hit',(el,e)=>{const r=box.getBoundingClientRect();let d=Math.round((e.clientX-r.left-L)/(W-L-R)*(N-1))+1;d=Math.max(1,Math.min(N,d));
    xh.setAttribute('x1',x(d));xh.setAttribute('x2',x(d));xh.setAttribute('visibility','visible');
    const has=d<=lastDay, pc=pace(d);
    let t=dayShort(ym+'-'+pad(d))+' · '+(has?chf(cum[d])+(per[d]?' (+'+grp(per[d])+')':''):'giorno futuro');
    if(has&&pc!=null)t+=' · '+(cum[d]>=pc?'avanti di '+grp(cum[d]-pc):'indietro di '+grp(pc-cum[d]));
    return {text:t,x:Math.min(Math.max(x(d),90),W-90),y:has?y(cum[d]):y(0)}});
  $('#chart-legend').innerHTML='<span><i style="border-top-color:'+col+'"></i>Guadagno'+(ahead==null?'':ahead?' (avanti sul ritmo)':' (indietro sul ritmo)')+'</span>'
    +(p&&lastDay<N?'<span><i class="d" style="border-top-color:'+col+'"></i>Proiezione</span>':'')
    +(goal>0?'<span><i class="g"></i>Ritmo per l\'obiettivo di '+chf(goal)+'</span>':'');
}
function actTarget(metric){

  if(setV>0)return {v:setV,label:'Obiettivo'};
  const avgOf=ymX=>{let n=0,t=0;Object.values(S.days).forEach(d=>{if(!d.date||ymOf(d.date)!==ymX)return;const v=metric==='calls'?+(d.L?.contattati||0):(+(d.R?.ricerche||0)+ +(d.T?.ricerche||0));if(v>0){n++;t+=v}});return n?t/n:0};
  const pv=avgOf(ymAdd(ym,-1));if(pv)return {v:Math.round(pv),label:'Media di '+monthName(ymAdd(ym,-1))};
  const cu=avgOf(ym);return cu?{v:Math.round(cu),label:'Media del mese'}:{v:0,label:''};
}
function drawActivity(){

  let above=0,elapsed=0,streak=0,streakOpen=true;

  segs.forEach(g=>{
    if(g.past){const hgt=Math.max(g.v?H-B-y(g.v):2,2);s+='<rect x="'+g.x0+'" y="'+(H-B-hgt)+'" width="'+g.w+'" height="'+hgt+'" fill="'+g.c+'"/>'}

    return {text:dayShort(ym+'-'+pad(g.d))+' · '+(g.past?g.v+' '+what+(T0?(g.v>=T0?' ✓':' · mancano '+(T0-g.v)):''):'giorno futuro'),x:Math.min(Math.max(g.x0+g.w/2,80),W-80),y:g.past?y(g.v):H-B}});
  const sum=$('#act-sum');

    +'<span class="s">'+(metric==='calls'?'Chiamate':'Ricerche')+' del mese: '+segs.reduce((a,g)=>a+(g.past?g.v:0),0)+'</span>';

    :'<span><b class="sq" style="background:var(--orange)"></b>'+(metric==='calls'?'Chiamate':'Ricerche')+'</span>';
}
function niceStep(v){const e=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

  ov=>{
    const val=()=>{const o={...it,name:ov.querySelector('#it-name').value.trim(),quando:ov.querySelector('#it-when').value.trim(),note:ov.querySelector('#it-note').value.trim()};const a=ov.querySelector('#it-auto');if(a)o.auto=a.value.trim();return o};
    const cr=ov.querySelector('#it-crm');if(cr)cr.onclick=()=>copy(crmText(val(),i+1,s.date));
    ov.querySelector('#it-f').onsubmit=async e=>{e.preventDefault();const items=s.items.slice();items[i]=val();closeSheet();await put('sessions',id,{...s,items});toast('Modifiche salvate.')};
    ov.querySelector('#it-del').onclick=()=>{const c=ov.querySelector('#it-conf');c.innerHTML='<div class="conf"><span>Eliminare questa voce? I conteggi del '+dmy(s.date)+' vengono aggiornati.</span><span class="row-end"><button type="button" class="btn ghost" id="itn">No</button><button type="button" class="btn ko" id="ity">Sì, elimina</button></span></div>';
      c.querySelector('#itn').onclick=()=>{c.innerHTML=''};c.querySelector('#ity').onclick=async()=>{closeSheet();await updateSession(id,s.items.filter((_,k)=>k!==i));toast('Voce eliminata.')}};

/* ---------- pannelli ---------- */
function sheet(html,onMount){
  const L=$('#layer');L.innerHTML='<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  const ov=$('#ov');ov.addEventListener('click',e=>{if(e.target===ov)closeSheet()});
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  document.body.style.overflow='hidden';
  onMount&&onMount(ov);
  const f=ov.querySelector('input,textarea,button:not(.x)');if(f&&!('ontouchstart' in window))f.focus();
}
function closeSheet(){$('#layer').innerHTML='';if(!$('.sess'))document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov'))closeSheet()});
function toast(msg,undo){
  const t=$('#toast-slot');t.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button id="undo">Annulla</button>':'')+'</div>';
  if(undo)$('#undo').onclick=()=>{undo();t.innerHTML=''};

}

/* ---------- aggiornamento giornaliero ---------- */
function stepper(id,label,val,st){st=st||1;return '<div class="stp"><label for="'+id+'">'+label+'</label><div class="stp-c"><button type="button" data-d="-'+st+'" data-for="'+id+'" aria-label="Togli uno">−</button><input type="number" inputmode="numeric" min="0" step="1" id="'+id+'" value="'+(val||0)+'"><button type="button" data-d="'+st+'" data-for="'+id+'" aria-label="Aggiungi uno">+</button></div></div>'}
function openDay(date){
  let rows=null;
  const build=ov=>{
    const d=ov.querySelector('#d-date').value;const day=S.days[d]||{L:emptyL(),R:emptyR(),T:emptyR()};
    rows=Object.entries(S.sales).filter(([,s])=>s.date===d).map(([id,s])=>({id,...s}));
    ov.querySelector('#d-body').innerHTML=
      '<p class="h" style="margin:0;font-size:13px;color:var(--muted)">'+(S.days[d]?'I numeri delle sessioni di questo giorno sono già inclusi: correggili se serve.':'Nessun dato per questo giorno: inserisci i numeri a mano.')+'</p>'
     +'<fieldset><legend class="sec-h"><h3>Leads · online</h3><span>'+S.settings.pctOnline+'% sul margine</span></legend><div class="stps">'
     +LKEYS.map(([k,l])=>stepper('dL-'+k,l,day.L?.[k])).join('')+stepper('dL-min','Tempo in chiamate (min)',day.L?.min,5)+'</div>'
     +'<details class="more"><summary>Altri esiti (permute, remarketing, posticipati, da risentire)</summary><div class="stps">'+LEXTRA.map(([k,l])=>stepper('dL-'+k,l,day.L?.[k])).join('')+'</div></details>'
     +'<div class="lbl">Chiusure</div><div class="srows" id="rows-online"></div><button type="button" class="addl" data-add="online">+ Aggiungi chiusura</button></fieldset>'
     +(rows.some(r=>r.channel==='diretta')?'<fieldset><legend class="sec-h"><h3>Vecchie chiusure dirette</h3><span>'+S.settings.pctDiretta+'% sul margine</span></legend><div class="srows" id="rows-diretta"></div></fieldset>':'')
     +'<fieldset><legend class="sec-h"><h3>Ricerche personali</h3><span>Collegate ai lead</span></legend><div class="stps">'
     +RKEYS.map(([k,l])=>stepper('dR-'+k,l,day.R?.[k])).join('')+stepper('dR-min','Tempo in ricerca (min)',day.R?.min,5)+'</div>'
     +'<p class="h" style="margin:0;font-size:12.5px;color:var(--muted)">Le ricerche e le proposte delle sessioni personali sono già contate anche in Leads · online.</p></fieldset>'
     +'<fieldset><legend class="sec-h"><h3>Ricerche team</h3><span>Separate dai lead</span></legend><div class="stps">'
     +RKEYS.map(([k,l])=>stepper('dT-'+k,l,day.T?.[k])).join('')+stepper('dT-min','Tempo in ricerca (min)',day.T?.min,5)+'</div></fieldset>'
     +'<div id="d-warn"></div>';
    ov.querySelector('#d-del').hidden=!S.days[d]&&!rows.length;
    drawRows(ov);
  };
  const drawRows=ov=>{['online','diretta'].forEach(ch=>{
    const box=ov.querySelector('#rows-'+ch);if(!box)return;const list=rows.filter(r=>r.channel===ch);
    box.innerHTML=list.length?list.map(r=>'<div class="srow" data-rid="'+r.id+'"><input type="text" id="a-'+r.id+'" placeholder="Auto, es. Audi Q5 2023" value="'+esc(r.auto||'')+'" aria-label="Auto"><input type="number" id="m-'+r.id+'" inputmode="numeric" min="0" step="50" placeholder="Margine CHF" value="'+(r.margine||'')+'" aria-label="Margine in CHF"><button type="button" class="del" data-rm="'+r.id+'" aria-label="Rimuovi chiusura">×</button><div class="earn num" id="e-'+r.id+'">'+earnTxt(r)+'</div></div>').join('')
      :'<div class="h" style="font-size:13px;color:var(--muted)">Nessuna chiusura.</div>';
    box.style.display='flex';box.style.flexDirection='column';box.style.gap='10px';
  })};
  const earnTxt=r=>'Tuo guadagno: '+chf(earn(r));
  const syncRows=ov=>rows.forEach(r=>{const a=ov.querySelector('#a-'+r.id),m=ov.querySelector('#m-'+r.id);if(a)r.auto=a.value;if(m)r.margine=m.value});
  const check=ov=>{const g=id=>+(ov.querySelector('#'+id)?.value||0);const w=[];
    const chain=[['dL-risposti','dL-contattati','Le risposte'],['dL-interessati','dL-risposti','Gli interessati'],['dL-validi','dL-interessati','I validi'],['dL-ricerche','dL-validi','Le ricerche online']];
    chain.forEach(([a,b,t])=>{if(g(a)>g(b)&&g(b)>0)w.push(t+' superano il passaggio precedente.')});
    if(g('dR-prezzi')>g('dR-ricerche'))w.push('I prezzi validi superano le ricerche personali.');if(g('dT-prezzi')>g('dT-ricerche'))w.push('I prezzi validi superano le ricerche team.');
    const el=ov.querySelector('#d-warn');if(el&&!el.querySelector('.conf'))el.innerHTML=w.length?'<div class="warn">Controlla: '+w.join(' ')+'</div>':'';
  };
  sheet('<div class="sheet-h"><h2>Aggiornamento <span>di fine giornata</span></h2><button class="x" data-close aria-label="Chiudi">×</button></div>'
   +'<form id="d-form" style="display:flex;flex-direction:column;gap:22px"><div class="f"><label for="d-date">Giorno</label><input type="date" id="d-date" value="'+date+'" max="'+today()+'"></div><div id="d-body" style="display:flex;flex-direction:column;gap:22px"></div>'
   +'<div class="sticky-foot row-end"><button type="button" class="btn ghost" id="d-del" style="margin-right:auto;color:var(--ko)">Elimina giorno</button><button type="button" class="btn ghost" data-close>Annulla</button><button type="submit" class="btn">Salva</button></div></form>',
  ov=>{
    build(ov);
    ov.querySelector('#d-date').onchange=()=>{if(ov.querySelector('#d-date').value)build(ov)};
    ov.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.d){const i=ov.querySelector('#'+b.dataset.for);i.value=Math.max(0,(+i.value||0)+ +b.dataset.d);check(ov)}
      if(b.dataset.add){syncRows(ov);rows.push({id:uid('s'),channel:b.dataset.add,auto:'',margine:''});drawRows(ov);const last=rows[rows.length-1];ov.querySelector('#a-'+last.id).focus()}
      if(b.dataset.rm){syncRows(ov);rows=rows.filter(r=>r.id!==b.dataset.rm);drawRows(ov)}
    });
    ov.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('m-')){const id=e.target.id.slice(2),r=rows.find(x=>x.id===id);if(r){r.margine=e.target.value;ov.querySelector('#e-'+id).textContent=earnTxt(r)}}check(ov)});
    ov.querySelector('#d-del').onclick=()=>{const d=ov.querySelector('#d-date').value;
      const bar=ov.querySelector('#d-warn');bar.innerHTML='<div class="conf"><span>Eliminare tutti i dati e le chiusure del '+dmy(d)+'?</span><span class="row-end"><button type="button" class="btn ghost" id="dd-no">No</button><button type="button" class="btn ko" id="dd-yes">Sì, elimina</button></span></div>';
      bar.scrollIntoView({block:'nearest'});
      bar.querySelector('#dd-no').onclick=()=>{bar.innerHTML=''};
      bar.querySelector('#dd-yes').onclick=async()=>{closeSheet();const ids=Object.entries(S.sales).filter(([,s])=>s.date===d).map(([id])=>id);for(const id of ids)await del('sales',id);if(S.days[d])await del('days',d);toast('Giorno '+dmy(d)+' eliminato.')};
    };
    ov.querySelector('#d-form').onsubmit=async e=>{e.preventDefault();syncRows(ov);
      const d=ov.querySelector('#d-date').value;if(!d){toast('Scegli il giorno.');return}
      const v=id=>Math.max(0,Math.round(+ov.querySelector('#'+id).value||0));
      const L={},R={},T={},D={...emptyD(),...(S.days[d]?.D||{})};LKEYS.concat(LEXTRA,[['min']]).forEach(([k])=>L[k]=v('dL-'+k));RKEYS.concat([['min']]).forEach(([k])=>R[k]=v('dR-'+k));RKEYS.concat([['min']]).forEach(([k])=>T[k]=v('dT-'+k));
      const bad=rows.find(r=>!(+r.margine>0));if(bad){toast('Inserisci il margine di ogni chiusura.');ov.querySelector('#m-'+bad.id).focus();return}
      closeSheet();
      await put('days',d,{date:d,L,D,R,T,updatedAt:Date.now()});
      const keep=new Set(rows.map(r=>r.id));
      for(const [id,s] of Object.entries(S.sales))if(s.date===d&&!keep.has(id))await del('sales',id);
      for(const r of rows){const o={date:d,channel:r.channel,auto:(r.auto||'').trim(),margine:Math.round(+r.margine)};const old=S.sales[r.id];
        if(!old||old.auto!==o.auto||old.margine!==o.margine||old.channel!==o.channel)await put('sales',r.id,o)}
      if(ymOf(d)!==ym){ym=ymOf(d);renderView()}
      toast('Dati del '+dmy(d)+' salvati.');
    };
    check(ov);
  });

}
function openSale(id){
  const s=S.sales[id];if(!s)return;
  sheet('<div class="sheet-h"><h2>Modifica <span>chiusura</span></h2><button class="x" data-close aria-label="Chiudi">×</button></div>'
   +'<form id="sf" style="display:flex;flex-direction:column;gap:14px"><div class="f"><label for="sa">Auto</label><input type="text" id="sa" value="'+esc(s.auto||'')+'" placeholder="Es. BMW X3 2022"></div>'
   +'<div class="stps"><div class="f"><label for="sd">Giorno</label><input type="date" id="sd" value="'+s.date+'"></div><div class="f"><label for="sm">Margine (CHF)</label><input type="number" id="sm" min="0" step="50" value="'+s.margine+'"></div></div>'
   +(s.channel!=='diretta'?'':'<div class="f"><span class="lbl">Canale</span><div class="btns"><button type="button" class="btn '+(s.channel==='online'?'dark':'ghost')+'" data-ch="online">Online · '+S.settings.pctOnline+'%</button><button type="button" class="btn '+(s.channel==='diretta'?'dark':'ghost')+'" data-ch="diretta">Diretta · '+S.settings.pctDiretta+'%</button></div></div>')
   +'<div id="sconf"></div><div class="row-end"><button type="button" class="btn ghost" id="sdel" style="margin-right:auto;color:var(--ko)">Elimina</button><button type="button" class="btn ghost" data-close>Annulla</button><button class="btn" type="submit">Salva</button></div></form>',
  ov=>{let ch=s.channel;
    ov.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ch=b.dataset.ch;ov.querySelectorAll('[data-ch]').forEach(x=>x.className='btn '+(x===b?'dark':'ghost'))});
    ov.querySelector('#sdel').onclick=()=>{const c=ov.querySelector('#sconf');c.innerHTML='<div class="conf"><span>Eliminare questa chiusura?</span><span class="row-end"><button type="button" class="btn ghost" id="sn">No</button><button type="button" class="btn ko" id="sy">Sì, elimina</button></span></div>';
      c.querySelector('#sn').onclick=()=>{c.innerHTML=''};c.querySelector('#sy').onclick=()=>{closeSheet();del('sales',id);toast('Chiusura eliminata.')}};
    ov.querySelector('#sf').onsubmit=e=>{e.preventDefault();const m=Math.round(+ov.querySelector('#sm').value),d=ov.querySelector('#sd').value;
      if(!(m>0)){toast('Inserisci un margine valido.');return} if(!d){toast('Scegli il giorno.');return}
      closeSheet();put('sales',id,{date:d,channel:ch,auto:ov.querySelector('#sa').value.trim(),margine:m});toast('Chiusura aggiornata.')};
  });
}

/* ---------- sessioni ---------- */
let SS=null, tick=null;
const saveDraft=()=>lsSet(DRAFT,SS);
const elapsed=()=>SS?SS.acc+(SS.runFrom?Date.now()-SS.runFrom:0):0;
function startSession(type){
  SS={type,date:today(),startedAt:Date.now(),acc:0,runFrom:Date.now(),items:[],cur:type==='lead'?newCall():newSearch(),phase:'work'};
  saveDraft();openSession();
}
function resumeSession(){SS=lsGet(DRAFT);if(!SS)return;openSession()}
const newCall=()=>({step:'start',name:'',note:'',quando:''});
const newSearch=()=>({step:'start',auto:'',name:''});
function openSession(){
  let el=$('.sess');if(!el){el=document.createElement('div');el.className='sess';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.style.overflow='hidden';
  renderSession();
  clearInterval(tick);tick=setInterval(()=>{const t=$('#timer');if(t)t.textContent=dur(elapsed())},1000);
}
function closeSession(){clearInterval(tick);const el=$('.sess');if(el)el.remove();document.body.style.overflow='';SS=null;renderView()}
function leadCounts(items){const c={contattati:0,risposti:0,interessati:0,validi:0,ricerche:0,permNo:0,permOk:0,permKo:0,rem:0,post:0,daValidare:0,risentire:0};
  items.forEach(i=>{c.contattati++;if(i.risposto)c.risposti++;if(i.interessato)c.interessati++;if(i.esito==='valido')c.validi++;if(i.esito==='remarketing')c.rem++;if(i.esito==='posticipato')c.post++;if(i.esito==='da_validare')c.daValidare++;
    if(i.permuta==='nessuna')c.permNo++;if(i.permuta==='valida')c.permOk++;if(i.permuta==='non_valida')c.permKo++;
    if(i.ricerca==='confermata')c.ricerche++;if(i.ricerca==='risentire')c.risentire++});return c}
function dirCounts(items){const c={ricerche:0,prezzi:0,autoOk:0,validaz:0,proposte:0,daFare:0};items.forEach(i=>{c.ricerche++;if(i.prezzo==='valido')c.prezzi++;if(i.autoV==='valida')c.autoOk++;
  if(i.autoV==='da_valutare'||i.esito==='validazione')c.validaz++;if(i.esito==='proposta')c.proposte++;if(i.esito==='da_fare')c.daFare++});return c}
const propPer=(items,per)=>items.filter(i=>i.per===per&&i.esito==='proposta').length;
const searchTitle=(it,i)=>{const who=it.per?(it.per==='lead'?'Lead':'Cliente')+(it.name?' '+it.name:''):it.name;return (who?who+' · ':'')+(it.auto||'Ricerca '+(i+1))};
const whenLbl=it=>it.esito==='da_fare'?'Proposta da fare':'Il fornitore richiama';
const ESITO={valido:'Valido',non_valido:'Non valido',remarketing:'Remarketing',posticipato:'Posticipato',da_validare:'Da validare'};
function callTrail(c){const t=[];
  if(c.risposto===false)t.push(['Non risposto','ko']);
  if(c.risposto)t.push(['Risposto','ok']);
  if(c.interessato===true)t.push(['Interessato','ok']);if(c.interessato===false)t.push(['Non interessato','ko']);
  if(c.esito)t.push([ESITO[c.esito],c.esito==='valido'?'ok':c.esito==='non_valido'?'ko':'on']);
  if(c.permuta==='nessuna')t.push(['Nessuna permuta','']);if(c.permuta==='valida')t.push(['Permuta valida','ok']);if(c.permuta==='non_valida')t.push(['Permuta non valida','ko']);
  if(c.ricerca==='confermata')t.push(['Ricerca confermata','ok']);if(c.ricerca==='risentire')t.push(['No ricerca, da risentire','on']);
  return t}
const chips=t=>'<div class="trail">'+t.map(([x,k])=>'<span class="chip '+k+'">'+esc(x)+'</span>').join('')+'</div>';
function crmText(c,n,date){const t=callTrail(c).map(x=>x[0]).join(' · ');
  return 'Lead: '+(c.name||'Chiamata '+n)+'\nData: '+dmy(date||(SS?SS.date:today()))+(c.t?' '+hhmm(c.t):'')+'\nEsito: '+t+(c.esito==='posticipato'&&c.quando?'\nRichiamare: '+c.quando:'')+(c.note?'\nNote: '+c.note:'')}
function dirTrail(s){const t=[];if(s.per)t.push([s.per==='lead'?'Per lead':'Per cliente','']);t.push(['Ricerca eseguita','on']);
  if(s.prezzo==='valido')t.push(['Prezzo valido','ok']);if(s.prezzo==='non_valido')t.push(['Prezzo non valido','ko']);
  if(s.autoV==='valida')t.push(['Auto valida','ok']);if(s.autoV==='non_valida')t.push(['Auto non valida','ko']);if(s.autoV==='da_valutare')t.push(['Da valutare','on']);
  if(s.esito==='proposta')t.push(['Proposta fatta','ok']);if(s.esito==='da_fare')t.push(['Proposta da fare','on']);
  if(s.esito==='validazione')t.push(['Validazione auto','on']);if(s.esito==='auto_non_valida')t.push(['Auto non valida','ko']);return t}

function renderSession(){
  const el=$('.sess');if(!el||!SS)return;
  const lead=SS.type==='lead', c=lead?leadCounts(SS.items):dirCounts(SS.items);
  let h='<div class="sess-top"><div class="wrap"><div><div class="eyebrow">Sessione '+TNAME[SS.type].toLowerCase()+'</div><div style="font-size:13px;opacity:.8">Iniziata alle '+hhmm(SS.startedAt)+'</div></div>'
    +'<div class="t"><span class="timer num" id="timer">'+dur(elapsed())+'</span>'+(SS.phase==='work'?'<button class="pz" id="pz">'+(SS.runFrom?'Pausa':'Riprendi')+'</button><button class="end" id="end">Termina sessione</button>':'')+'</div></div></div>';
  h+='<div class="wrap">';
  if(SS.phase==='summary'){h+=sessionSummary(SS,true)+'</div>';el.innerHTML=h;bindSession();return}
  h+='<div class="sess-body"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">';
  h+=lead?'<div class="cnt num"><div><b>'+c.contattati+'</b><span>Chiamate</span></div><div><b>'+c.risposti+'</b><span>Risposte</span></div><div><b>'+c.interessati+'</b><span>Interessati</span></div><div><b>'+c.validi+'</b><span>Validi</span></div><div><b>'+c.ricerche+'</b><span>Ricerche</span></div></div>'
         :'<div class="cnt num"><div><b>'+c.ricerche+'</b><span>Ricerche</span></div><div><b>'+c.prezzi+'</b><span>Prezzi validi</span></div><div><b>'+c.autoOk+'</b><span>Auto valide</span></div><div><b>'+c.validaz+'</b><span>Da valutare</span></div><div><b>'+c.proposte+'</b><span>Proposte</span></div></div>';
  h+=lead?callCard():searchCard();
  h+='</div><aside class="log"><h3>'+(lead?'Chiamate della sessione':'Ricerche della sessione')+'</h3>';
  if(!SS.items.length)h+='<div class="empty" style="margin-top:8px">'+(lead?'Qui compaiono le chiamate concluse, con esito e note.':'Qui compaiono le ricerche concluse.')+'</div>';
  else h+=SS.items.map((it,i)=>({it,i})).reverse().map(({it,i})=>'<div class="li"><div class="li-h"><b>'+(lead?esc(it.name||'Chiamata '+(i+1)):esc(searchTitle(it,i)))+'</b><small>'+hhmm(it.t)+'</small></div>'
    +chips(lead?callTrail(it):dirTrail(it))+(it.quando?'<p><b>'+(lead?'Richiamare':whenLbl(it))+':</b> '+esc(it.quando)+'</p>':'')+(it.note?'<p>'+esc(it.note)+'</p>':'')
    +'<div class="acts" style="justify-content:flex-start">'+(lead&&it.risposto?'<button class="lnk" data-copy="'+i+'">Copia per CRM</button>':'')+'<button class="lnk ko" data-rmitem="'+i+'">Elimina</button></div></div>').join('');
  h+='</aside></div></div>';
  el.innerHTML=h;bindSession();
}
function callCard(){
  const c=SS.cur,n=c.idx!=null?c.idx+1:SS.items.length+1;
  const stepsIdx={start:1,answered:2,interested:3,perm:4,valid:5,done:5}[c.step]||1;
  let h='<div class="call"><div class="call-h"><h2>'+(c.step==='done'?'Resoconto <span>chiamata '+n+'</span>':'Chiamata <span>'+n+'</span>')+'</h2><span class="eyebrow" style="color:var(--muted)">'+(c.step==='done'?'Fatto':stepsIdx+' / 5')+'</span></div>'
   +'<div class="steps">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=stepsIdx?'on':'')+'"></i>').join('')+'</div>';
  if(c.step!=='start'&&c.step!=='done')h+=chips(callTrail(c));
  if(c.step==='start'){
    h+='<div class="f"><label for="c-name">Lead <span style="font-weight:400;color:var(--muted)">(facoltativo)</span></label><input type="text" id="c-name" placeholder="Nome, cognome o telefono" value="'+esc(c.name)+'" autocomplete="off"></div>'
