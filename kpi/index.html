/* ---------- sessioni ---------- */
let SS=null, tick=null;
const saveDraft=()=>lsSet(DRAFT,SS);
const elapsed=()=>SS?SS.acc+(SS.runFrom?Date.now()-SS.runFrom:0):0;
function startSession(type){
  SS={type,date:today(),startedAt:Date.now(),acc:0,runFrom:Date.now(),items:[],cur:type==='lead'?newCall():newSearch(),phase:'work'};
  saveDraft();openSession();
}
function resumeSession(){SS=lsGet(DRAFT);if(!SS)return;openSession()}
const newCall=()=>({step:'start',name:'',note:'',quando:'',lid:null});
const newSearch=()=>({step:'start',auto:'',name:''});
function openSession(){
  let el=$('.sess');if(!el){el=document.createElement('div');el.className='sess';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.style.overflow='hidden';
  renderSession();
  clearInterval(tick);tick=setInterval(()=>{const t=$('#timer');if(t)t.textContent=dur(elapsed())},1000);
}
function closeSession(){clearInterval(tick);const el=$('.sess');if(el)el.remove();document.body.style.overflow='';SS=null;renderView()}
function leadCounts(items){const c={contattati:0,risposti:0,interessati:0,validi:0,ricerche:0,permNo:0,permOk:0,permKo:0,permVal:0,rem:0,post:0,daValidare:0,risentire:0};
  items.forEach(i=>{c.contattati++;if(i.risposto)c.risposti++;if(i.interessato)c.interessati++;if(i.esito==='valido')c.validi++;if(i.esito==='remarketing')c.rem++;if(i.esito==='posticipato')c.post++;if(i.esito==='da_validare')c.daValidare++;
    if(PERMK[i.permuta])c[PERMK[i.permuta]]++;
    if(i.ricerca==='confermata')c.ricerche++;if(i.ricerca==='risentire')c.risentire++});return c}
function dirCounts(items){const c=emptyR();delete c.min;items.forEach(i=>addSearch(c,i));return c}
const searchTitle=(it,i)=>{const who=it.per?(it.per==='lead'?'Lead':'Cliente')+(it.name?' '+it.name:''):it.name;return (who?who+' · ':'')+(it.auto||'Ricerca '+(i+1))};
const whenLbl=it=>it.esito==='da_fare'?'Proposta da fare':'Il fornitore richiama';
const ESITO={valido:'Valido',non_valido:'Non valido',remarketing:'Remarketing',posticipato:'Posticipato',da_validare:'Da validare'};
function callTrail(c){const t=[];
  if(c.risposto===false)t.push(['Non risposto','ko']);
  if(c.risposto)t.push(['Risposto','ok']);
  if(c.interessato===true)t.push(['Interessato','ok']);if(c.interessato===false)t.push(['Non interessato','ko']);
  if(c.esito)t.push([ESITO[c.esito],c.esito==='valido'?'ok':c.esito==='non_valido'?'ko':'on']);
  if(c.permuta==='nessuna')t.push(['Nessuna permuta','']);if(c.permuta==='valida')t.push(['Permuta valida','ok']);if(c.permuta==='non_valida')t.push(['Permuta non valida','ko']);if(c.permuta==='da_valutare')t.push(['Permuta da valutare','on']);
  if(c.ricerca==='confermata')t.push(['Ricerca confermata','ok']);if(c.ricerca==='risentire')t.push(['No ricerca, da risentire','on']);
  return t}
const chips=t=>'<div class="trail">'+t.map(([x,k])=>'<span class="chip '+k+'">'+esc(x)+'</span>').join('')+'</div>';
function crmText(c,n,date){const t=callTrail(c).map(x=>x[0]).join(' · ');
  return 'Lead: '+(c.name||'Chiamata '+n)+'\nData: '+dmy(date||(SS?SS.date:today()))+(c.t?' '+hhmm(c.t):'')+'\nEsito: '+t+(c.quando?'\nRichiamare: '+c.quando:'')+(c.note?'\nNote: '+c.note:'')}
function dirTrail(s){const t=[];if(s.per)t.push([s.per==='lead'?'Per lead':'Per cliente','']);t.push(['Ricerca eseguita','on']);
  if(s.prezzo==='valido')t.push(['Prezzo valido','ok']);if(s.prezzo==='non_valido')t.push(['Prezzo non valido','ko']);
  if(s.autoV==='valida')t.push(['Auto valida','ok']);if(s.autoV==='non_valida')t.push(['Auto non valida','ko']);if(s.autoV==='da_valutare')t.push(['Da valutare','on']);
  if(s.esito==='proposta')t.push(['Proposta fatta','ok']);if(s.esito==='da_fare')t.push(['Proposta da fare','on']);
  if(s.esito==='validazione')t.push(['Validazione auto','on']);if(s.esito==='auto_non_valida')t.push(['Auto non valida','ko']);return t}

/* lead già chiamati: salvati e della sessione in corso */
function knownLeads(){
  const m={};
  Object.values(derive().leads).forEach(l=>{if(l.calls.length)m[l.key]={key:l.key,name:l.name,calls:l.calls.map(c=>({date:c.date,t:c.t,it:c.it}))}});
  if(SS)SS.items.forEach(it=>{const k=leadKey(it);if(!k)return;const o=m[k]=m[k]||{key:k,name:it.name,calls:[]};o.calls.push({date:SS.date,t:it.t,it})});
  return Object.values(m).map(l=>{l.calls.sort((a,b)=>a.t-b.t);l.last=l.calls[l.calls.length-1];l.lastAns=[...l.calls].reverse().find(c=>c.it.risposto)||l.last;return l});
}
function leadCardHTML(l){const a=l.lastAns,n=l.calls.length;
  return '<div class="match"><div class="mh"><b>Lead già chiamato</b><small>'+n+' '+pl(n,'chiamata','chiamate')+' · ultima il '+dmy(l.last.date)+' alle '+hhmm(l.last.t)+'</small></div>'
    +chips(callTrail(a.it))+(a.it.quando?'<p><b>Richiamare:</b> '+esc(a.it.quando)+'</p>':'')+(a.it.note?'<p class="nt">'+esc(a.it.note)+'</p>':'')
    +'<p class="h">Questa chiamata aggiorna la sua scheda: il lead non viene contato due volte.</p><button type="button" class="lnk" data-a="newlead">È un altro lead con lo stesso nome</button></div>'}
function matchHTML(c){
  const q=normName(c.name);if(!q)return '';
  if(c.lid&&c.lid.startsWith('u:')&&!knownLeads().some(l=>l.key===c.lid))return '<div class="match new"><p class="h" style="margin:0">Nuovo lead, separato da quello con lo stesso nome.</p><button type="button" class="lnk" data-a="unlink">Annulla</button></div>';
  const L=knownLeads();
  if(c.lid){const l=L.find(x=>x.key===c.lid);if(l)return leadCardHTML(l)}
  const ex=L.filter(l=>normName(l.name)===q);
  if(ex.length===1)return leadCardHTML(ex[0]);
  const list=ex.length>1?ex:L.filter(l=>normName(l.name).includes(q)).slice(0,4);
  if(!list.length)return '';
  return '<div class="sugg"><span class="lbl">'+(ex.length>1?'Ci sono '+ex.length+' lead con questo nome: scegli quale':'Lead già chiamati')+'</span>'
    +list.map(l=>'<button type="button" data-pick="'+esc(l.key)+'"><b>'+esc(l.name)+'</b><small>'+dmy(l.last.date)+' · '+callTrail(l.lastAns.it).map(x=>x[0]).slice(-2).join(' · ')+'</small></button>').join('')
    +(ex.length>1?'<button type="button" class="lnk" data-a="newlead">È un altro lead</button>':'')+'</div>'}

function renderSession(){
  const el=$('.sess');if(!el||!SS)return;
  const lead=SS.type==='lead', c=lead?leadCounts(SS.items):dirCounts(SS.items);
  let h='<div class="sess-top"><div class="wrap"><div><div class="eyebrow">Sessione '+TNAME[SS.type].toLowerCase()+'</div><div style="font-size:13px;opacity:.8">Iniziata alle '+hhmm(SS.startedAt)+'</div></div>'
    +'<div class="t"><span class="timer num" id="timer">'+dur(elapsed())+'</span>'+(SS.phase==='work'?'<button class="pz" id="pz">'+(SS.runFrom?'Pausa':'Riprendi')+'</button><button class="end" id="end">Termina sessione</button>':'')+'</div></div></div>';
  h+='<div class="wrap">';
  if(SS.phase==='summary'){h+=sessionSummary(SS,true)+'</div>';el.innerHTML=h;bindSession();return}
  h+='<div class="sess-body"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">';
  h+=lead?'<div class="cnt num"><div><b>'+c.contattati+'</b><span>Chiamate</span></div><div><b>'+c.risposti+'</b><span>Risposte</span></div><div><b>'+c.interessati+'</b><span>Interessati</span></div><div><b>'+c.validi+'</b><span>Validi</span></div><div><b>'+c.ricerche+'</b><span>Ricerche</span></div></div>'
         :'<div class="cnt num"><div><b>'+c.ricerche+'</b><span>Ricerche</span></div><div><b>'+c.prezzi+'</b><span>Prezzi validi</span></div><div><b>'+c.autoOk+'</b><span>Auto valide</span></div><div><b>'+c.validaz+'</b><span>Da valutare</span></div><div><b>'+c.proposte+'</b><span>Proposte</span></div></div>';
  h+=lead?callCard():searchCard();
  h+='</div><aside class="log"><h3>'+(lead?'Chiamate della sessione':'Ricerche della sessione')+'</h3>';
  if(!SS.items.length)h+='<div class="empty" style="margin-top:8px">'+(lead?'Qui compaiono le chiamate concluse: puoi modificarle in qualsiasi momento.':'Qui compaiono le ricerche concluse: puoi modificarle in qualsiasi momento.')+'</div>';
  else h+=SS.items.map((it,i)=>({it,i})).reverse().map(({it,i})=>'<div class="li"><div class="li-h"><b>'+(lead?esc(it.name||'Chiamata '+(i+1)):esc(searchTitle(it,i)))+'</b><small>'+hhmm(it.t)+'</small></div>'
    +chips(lead?callTrail(it):dirTrail(it))+(it.quando?'<p><b>'+(lead?'Richiamare':whenLbl(it))+':</b> '+esc(it.quando)+'</p>':'')+(it.note?'<p class="nt">'+esc(it.note)+'</p>':'')
    +'<div class="acts" style="justify-content:flex-start"><button class="lnk" data-edit="'+i+'">Modifica</button>'+(lead&&it.risposto?'<button class="lnk" data-copy="'+i+'">Copia per CRM</button>':'')+'</div></div>').join('');
  h+='</aside></div></div>';
  el.innerHTML=h;bindSession();
}
const WHEN_F=c=>'<div class="f"><label for="c-when">Quando va ricontattato?</label><input type="text" id="c-when" placeholder="Es. lunedì alle 10, dopo il 15 ottobre" value="'+esc(c.quando)+'"></div><div class="row-end"><button class="btn dark" data-a="postok">Conferma posticipo</button></div>';
const NOTE_F=(c,hint)=>'<div class="f"><label for="c-note">Note della chiamata</label><textarea id="c-note" placeholder="Auto cercata, budget, tempi, permuta, leasing o contanti…">'+esc(c.note)+'</textarea>'+(hint?'<span class="h">Le trovi nel resoconto, pronte da copiare nel CRM.</span>':'')+'</div>';
function callCard(){
  const c=SS.cur,n=c.idx!=null?c.idx+1:SS.items.length+1;
  const stepsIdx={start:1,answered:2,interested:3,perm:4,valid:5,done:5}[c.step]||1;
  const known=c.step!=='start'&&(()=>{const k=c.lid||leadKey(c);return k&&knownLeads().some(l=>l.key===k&&l.calls.some(x=>x.it!==SS.items[c.idx]))})();
  let h='<div class="call"><div class="call-h"><div style="min-width:0"><span class="eyebrow" style="color:var(--muted)">Chiamata '+n+(c.step==='done'?' · resoconto':' · passo '+stepsIdx+' di 5')+'</span>'
   +'<h2 class="who">'+(c.step==='start'?'Nuova chiamata':esc(c.name))+(known?' <span class="chip on">Richiamata</span>':'')+'</h2></div></div>'
   +'<div class="steps">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=stepsIdx?'on':'')+'"></i>').join('')+'</div>';
  if(c.step!=='start'&&c.step!=='done')h+=chips(callTrail(c));
  if(c.step==='start'){
    h+='<div class="f"><label for="c-name">Nome del lead</label><input type="text" id="c-name" placeholder="Nome e cognome" value="'+esc(c.name)+'" autocomplete="off"></div><div id="c-match">'+matchHTML(c)+'</div>'
      +'<div class="btns"><button class="btn ok big" data-a="risposto">Risposto</button><button class="btn ko big" data-a="nonrisposto">Non risposto</button></div>';
  } else if(c.step==='answered'){
    h+='<div class="q">Il lead è interessato?</div><div class="btns"><button class="btn ok big" data-a="int">Interessato</button><button class="btn ko big" data-a="noint">Non interessato</button></div>'
      +'<button class="btn dark big" data-a="post">Posticipato<small>da ricontattare più avanti</small></button>'+(c.askWhen?WHEN_F(c):'');
  } else if(c.step==='interested'){
    h+=NOTE_F(c,true)
      +'<div class="q">Il lead è valido?</div><div class="btns four"><button class="btn ok big" data-a="valido">Valido</button><button class="btn ko big" data-a="nonvalido">Non valido</button><button class="btn big" data-a="remarketing">Remarketing</button><button class="btn dark big" data-a="post">Posticipato</button></div>'
      +'<button class="btn ghost big" data-a="davalid">Da validare<small>devi ancora capire se è valido</small></button>'+(c.askWhen?WHEN_F(c):'');
  } else if(c.step==='perm'){
    h+=NOTE_F(c)
      +'<div class="q">Il cliente ha un\'auto da dare in permuta?</div><button class="btn dark big" data-a="permno">Nessuna permuta<small>il cliente non ha un\'auto da dare</small></button><div class="btns"><button class="btn ok big" data-a="permok">Permuta valida</button><button class="btn ko big" data-a="permko">Permuta non valida</button></div>'
      +'<button class="btn ghost big" data-a="permval">Permuta da valutare<small>serve una stima o altre informazioni</small></button>';
  } else if(c.step==='valid'){
    h+=NOTE_F(c)
      +'<div class="q">La ricerca è confermata?</div><div class="btns"><button class="btn ok big" data-a="ric">Ricerca confermata</button><button class="btn ko big" data-a="noric">No ricerca<small>da risentire</small></button></div>';
  } else if(c.step==='done'){
    h+='<dl class="sumbox"><div><dt>Ora</dt><dd>'+hhmm(c.t)+'</dd></div><div><dt>Esito</dt><dd>'+chips(callTrail(c))+'</dd></div>'+(c.quando?'<div><dt>Richiamare</dt><dd>'+esc(c.quando)+'</dd></div>':'')+'</dl>'
      +'<div class="f"><label for="c-note">Note per il CRM</label><textarea id="c-note" placeholder="Nessuna nota">'+esc(c.note)+'</textarea></div>'
      +'<div class="btns three"><button class="btn ghost" data-a="editcur">Modifica esito</button><button class="btn ghost" data-a="copy">Copia per CRM</button><button class="btn" data-a="next">Prossima chiamata</button></div>'
      +'<button class="back" data-a="end" style="align-self:flex-end">Termina la sessione</button>';
  }
  if(c.step!=='start'&&c.step!=='done')h+='<button class="back" data-a="back">Indietro</button>';
  return h+'</div>';
}
function searchCard(){
  const c=SS.cur,n=SS.items.length+1;
  const idx={start:1,exec:2,auto:3,prop:4}[c.step]||1;
  let h='<div class="call"><div class="call-h"><div style="min-width:0"><span class="eyebrow" style="color:var(--muted)">Ricerca '+n+' · passo '+idx+' di 4</span>'
   +'<h2 class="who">'+(c.step==='start'?'Nuova ricerca':esc([c.name,c.auto].filter(Boolean).join(' · ')||'Ricerca '+n))+'</h2></div></div>'
   +'<div class="steps">'+[1,2,3,4].map(i=>'<i class="'+(i<=idx?'on':'')+'"></i>').join('')+'</div>';
  if(c.step==='start'){
    if(SS.type!=='dir')h+='<div class="f"><label for="s-name">'+(SS.type==='team'?'Collega o cliente':'Lead')+' <span class="opt">(facoltativo)</span></label><input type="text" id="s-name" placeholder="'+(SS.type==='team'?'Nome del collega o del cliente':'Nome e cognome del lead')+'" value="'+esc(c.name)+'" autocomplete="off"></div>';
    h+='<div class="f"><label for="s-auto">Auto cercata <span class="opt">(facoltativo)</span></label><input type="text" id="s-auto" placeholder="Es. Mercedes GLC 300 de 2023" value="'+esc(c.auto)+'" autocomplete="off"></div>'
      +'<button class="btn big" data-a="exec">Ricerca eseguita<small>Conta la ricerca e passa al prezzo</small></button>';
  } else {
    h+=chips(dirTrail(c));
    if(c.step==='exec')h+='<div class="q">Il prezzo è valido?</div><div class="btns"><button class="btn ok big" data-a="pv">Prezzo valido</button><button class="btn ko big" data-a="pnv">Non valida<small>torna alla ricerca</small></button></div>';
    else if(c.step==='auto')h+='<div class="q">L\'auto è valida?</div><div class="btns"><button class="btn ok big" data-a="av">Auto valida</button><button class="btn ko big" data-a="anv">Non valida</button></div>'
      +'<button class="btn dark big" data-a="adv">Da valutare<small>validazione auto, il fornitore deve confermare</small></button>';
    else if(c.step==='prop')h+='<div class="q">Proposta fatta?</div><div class="btns"><button class="btn ok big" data-a="prop">Proposta fatta</button><button class="btn dark big" data-a="dafare">Da fare</button></div>'
      +(c.askWhen?'<div class="f"><label for="s-when">Quando la fai? <span class="opt">(facoltativo)</span></label><input type="text" id="s-when" placeholder="Es. domani mattina, venerdì" value="'+esc(c.quando)+'" autocomplete="off"></div><div class="row-end"><button class="btn dark" data-a="dafareok">Conferma</button></div>':'');
    h+='<button class="back" data-a="back">Indietro</button>';
  }
  return h+'</div>';
}
function editSessionItem(i){
  const it=SS.items[i];if(!it)return;
  editItem(SS.type,it,{date:SS.date,
    save:o=>{SS.items[i]=o;if(SS.cur.idx===i)SS.cur={...SS.cur,...o,step:'done'};saveDraft();renderSession();toast('Modifica salvata.')},
    remove:()=>{SS.items.splice(i,1);if(SS.cur.idx!=null){if(SS.cur.idx===i)SS.cur=SS.type==='lead'?newCall():newSearch();else if(SS.cur.idx>i)SS.cur.idx--}
      saveDraft();renderSession();toast((SS.type==='lead'?'Chiamata':'Ricerca')+' eliminata.',()=>{SS.items.splice(i,0,it);saveDraft();renderSession()})}});
}
function bindMatch(){
  const box=$('#c-match');if(!box)return;
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
  box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const l=knownLeads().find(x=>x.key===b.dataset.pick);if(!l)return;SS.cur.lid=l.key;SS.cur.name=l.name;saveDraft();renderSession()});
}
function bindSession(){
  const el=$('.sess');
  const pz=el.querySelector('#pz');if(pz)pz.onclick=()=>{if(SS.runFrom){SS.acc+=Date.now()-SS.runFrom;SS.runFrom=null}else SS.runFrom=Date.now();saveDraft();renderSession()};
  const end=el.querySelector('#end');if(end)end.onclick=endSession;
  el.querySelectorAll('.call [data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
  bindMatch();
  const nm=el.querySelector('#c-name');if(nm)nm.oninput=()=>{SS.cur.name=nm.value;if(SS.cur.lid&&!SS.cur.lid.startsWith('u:'))SS.cur.lid=null;saveDraft();$('#c-match').innerHTML=matchHTML(SS.cur);bindMatch()};
  const nt=el.querySelector('#c-note');if(nt)nt.oninput=()=>{SS.cur.note=nt.value;if(SS.cur.step==='done'&&SS.cur.idx!=null)SS.items[SS.cur.idx].note=nt.value;saveDraft()};
  const wh=el.querySelector('#c-when');if(wh){wh.oninput=()=>{SS.cur.quando=wh.value;saveDraft()};wh.focus()}
  const sa=el.querySelector('#s-auto');if(sa)sa.oninput=()=>{SS.cur.auto=sa.value;saveDraft()};
  const sn=el.querySelector('#s-name');if(sn)sn.oninput=()=>{SS.cur.name=sn.value;saveDraft()};
  const sw=el.querySelector('#s-when');if(sw){sw.oninput=()=>{SS.cur.quando=sw.value;saveDraft()};sw.focus()}
  el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(crmText(SS.items[+b.dataset.copy],+b.dataset.copy+1)));
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSessionItem(+b.dataset.edit));
  // riepilogo finale
  const sv=el.querySelector('#ss-save');if(sv)sv.onclick=saveSession;
  const bk=el.querySelector('#ss-back');if(bk)bk.onclick=()=>{SS.phase='work';if(!SS.runFrom&&SS.wasRunning)SS.runFrom=Date.now();saveDraft();renderSession()};
  const ds=el.querySelector('#ss-discard');if(ds)ds.onclick=()=>{const c=el.querySelector('#ss-conf');c.innerHTML='<div class="conf"><span>La sessione non verrà salvata e i dati andranno persi.</span><span class="row-end"><button class="btn ghost" id="sd-no">No</button><button class="btn ko" id="sd-yes">Scarta</button></span></div>';
    c.querySelector('#sd-no').onclick=()=>{c.innerHTML=''};c.querySelector('#sd-yes').onclick=()=>{lsSet(DRAFT,null);closeSession();toast('Sessione scartata.')}};
  const ca=el.querySelector('#ss-copyall');if(ca)ca.onclick=()=>copy(SS.items.map((c,i)=>({c,i})).filter(x=>x.c.risposto).map(x=>crmText(x.c,x.i+1)).join('\n\n'));
  el.querySelectorAll('[data-copy2]').forEach(b=>b.onclick=()=>copy(crmText(SS.items[+b.dataset.copy2],+b.dataset.copy2+1)));
  el.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{SS.items[+t.dataset.note].note=t.value;saveDraft()});
  el.querySelectorAll('[data-edit2]').forEach(b=>b.onclick=()=>editSessionItem(+b.dataset.edit2));
}
const callItem=c=>({name:(c.name||'').trim(),lid:c.lid||null,risposto:c.risposto,interessato:c.interessato??null,esito:c.esito||null,quando:(c.quando||'').trim(),permuta:c.permuta||null,ricerca:c.ricerca||null,note:(c.note||'').trim(),t:c.t||Date.now()});
const searchItem=c=>({per:null,note:(c.note||'').trim(),name:(c.name||'').trim(),auto:(c.auto||'').trim(),prezzo:c.prezzo||null,autoV:c.autoV||null,esito:c.esito||null,quando:(c.quando||'').trim(),t:Date.now()});
function act(a){
  const c=SS.cur;
  const finishCall=()=>{c.t=c.t||Date.now();const item=callItem(c);if(c.idx!=null)SS.items[c.idx]=item;else{SS.items.push(item);c.idx=SS.items.length-1}};
  const finishSearch=()=>{SS.items.push(searchItem(c));SS.cur=newSearch()};
  if(SS.type==='lead'){
    const nt=$('#c-note');if(nt)c.note=nt.value;
    const nm=$('#c-name');if(nm)c.name=nm.value;
    if((a==='risposto'||a==='nonrisposto')&&!c.name.trim()){toast('Scrivi il nome del lead: serve per riconoscerlo quando lo richiami.');nm&&nm.focus();return}
    switch(a){
      case 'risposto':c.name=c.name.trim();c.risposto=true;c.t=Date.now();c.step='answered';break;
      case 'nonrisposto':c.name=c.name.trim();c.risposto=false;c.t=Date.now();finishCall();SS.cur=newCall();toast('Non risposto: '+c.name+'.',()=>{SS.items.pop();saveDraft();renderSession()});break;
      case 'newlead':c.lid='u:'+uid('');break;
      case 'unlink':c.lid=null;break;
      case 'int':c.interessato=true;c.askWhen=false;c.step='interested';break;
      case 'noint':c.interessato=false;c.askWhen=false;c.step='done';finishCall();break;
      case 'valido':c.esito='valido';c.askWhen=false;c.step='perm';break;
      case 'permno':c.permuta='nessuna';c.step='valid';break;
      case 'permok':c.permuta='valida';c.step='valid';break;
      case 'permko':c.permuta='non_valida';c.step='valid';break;
      case 'permval':c.permuta='da_valutare';c.step='valid';break;
      case 'nonvalido':c.esito='non_valido';c.askWhen=false;c.step='done';finishCall();break;
      case 'davalid':c.esito='da_validare';c.askWhen=false;c.step='done';finishCall();break;
      case 'remarketing':c.esito='remarketing';c.askWhen=false;c.step='done';finishCall();break;
      case 'post':c.askWhen=true;break;
      case 'postok':{const w=$('#c-when');c.quando=(w?w.value:c.quando||'').trim();if(!c.quando){toast('Scrivi quando va ricontattato.');w&&w.focus();return}c.esito='posticipato';c.askWhen=false;c.step='done';finishCall();break}
      case 'ric':c.ricerca='confermata';c.step='done';finishCall();break;
      case 'noric':c.ricerca='risentire';c.step='done';finishCall();break;
      case 'copy':copy(crmText(SS.items[c.idx],c.idx+1));return;
      case 'editcur':editSessionItem(c.idx);return;
      case 'next':SS.cur=newCall();break;
      case 'end':SS.cur=newCall();endSession();return;
      case 'back':
        if(c.step==='answered'){if(c.askWhen){c.askWhen=false}else{c.step='start';delete c.risposto}}
        else if(c.step==='interested'){if(c.askWhen){c.askWhen=false}else{c.step='answered';delete c.interessato}}
        else if(c.step==='perm'){c.step='interested';delete c.esito}
        else if(c.step==='valid'){c.step='perm';delete c.permuta}
        break;
    }
  } else {
    const sa=$('#s-auto');if(sa)c.auto=sa.value;const sn=$('#s-name');if(sn)c.name=sn.value;
    switch(a){
      case 'exec':c.step='exec';break;
      case 'pv':c.prezzo='valido';c.step='auto';break;
      case 'pnv':c.prezzo='non_valido';finishSearch();toast('Ricerca registrata: prezzo non valido.');break;
      case 'av':c.autoV='valida';c.step='prop';break;
      case 'anv':c.autoV='non_valida';finishSearch();toast('Ricerca registrata: auto non valida.');break;
      case 'adv':c.autoV='da_valutare';finishSearch();toast('Ricerca registrata: auto da valutare.');break;
      case 'prop':c.esito='proposta';finishSearch();toast(SS.type==='ric'?'Proposta registrata, conta anche nei Leads online.':'Proposta registrata.');break;
      case 'dafare':c.askWhen=true;break;
      case 'dafareok':{const w=$('#s-when');c.quando=w?w.value:(c.quando||'');c.esito='da_fare';c.askWhen=false;finishSearch();toast('Ricerca registrata: proposta da fare.');break}
      case 'back':if(c.step==='prop'){if(c.askWhen)c.askWhen=false;else{c.step='auto';delete c.autoV}}else if(c.step==='auto'){c.step='exec';delete c.prezzo}else if(c.step==='exec')c.step='start';break;
    }
  }
  saveDraft();renderSession();
  const f=$('.sess #c-name, .sess #s-auto');if(f&&(a==='next'||a==='nonrisposto'||(SS.type!=='lead'&&a!=='back')))f.focus();
}
function endSession(){
  const c=SS.cur;
  if(SS.type==='lead'&&c.step!=='start'&&c.step!=='done'&&c.idx==null)SS.items.push(callItem(c)); // chiamata lasciata a metà: la registro con gli esiti scelti
  if(SS.type!=='lead'&&c.step!=='start')SS.items.push(searchItem(c));
  SS.cur=SS.type==='lead'?newCall():newSearch();
  SS.wasRunning=!!SS.runFrom; if(SS.runFrom){SS.acc+=Date.now()-SS.runFrom;SS.runFrom=null}
  SS.endedAt=Date.now();
  SS.phase='summary';saveDraft();renderSession();$('.sess').scrollTo(0,0);
}
function recalled(s){ // lead della sessione già chiamati prima (in sessioni salvate o prima nella stessa sessione)
  const saved=new Set(Object.values(derive().leads).filter(l=>l.calls.length).map(l=>l.key)),seen=new Set();let n=0;
  s.items.forEach(it=>{const k=leadKey(it);if(!k)return;if(saved.has(k)||seen.has(k))n++;seen.add(k)});return n}
function sessionSummary(s,live){
  const lead=s.type==='lead', c=lead?leadCounts(s.items):dirCounts(s.items), ms=s.durationMs??(s.acc||0);
  let h='<div style="display:flex;flex-direction:column;gap:16px;padding-block:'+(live?'18px 40px':'0')+';max-width:820px;margin-inline:auto;width:100%">';
  h+='<div class="call"><div class="call-h"><h2>Resoconto <span>sessione</span></h2><span class="eyebrow" style="color:var(--muted)">'+dmy(s.date)+'</span></div>';
  h+='<dl class="sumbox num"><div><dt>Durata</dt><dd>'+durWords(ms)+' (dalle '+hhmm(s.startedAt)+(s.endedAt?' alle '+hhmm(s.endedAt):'')+')</dd></div>';
  if(lead){const rc=live?recalled(s):0;
    h+='<div><dt>Chiamate</dt><dd>'+c.contattati+(rc?' · '+rc+' '+pl(rc,'lead richiamato','lead richiamati'):'')+'</dd></div><div><dt>Risposte</dt><dd>'+c.risposti+' ('+pct(c.risposti,c.contattati)+')</dd></div>'
     +'<div><dt>Interessati</dt><dd>'+c.interessati+' ('+pct(c.interessati,c.risposti)+' delle risposte)</dd></div><div><dt>Validi</dt><dd>'+c.validi+'</dd></div>'
     +'<div><dt>Permute</dt><dd>Nessuna '+c.permNo+' · Valide '+c.permOk+' · Non valide '+c.permKo+' · Da valutare '+c.permVal+'</dd></div><div><dt>Ricerche confermate</dt><dd>'+c.ricerche+'</dd></div><div><dt>Altri esiti</dt><dd>Posticipati '+c.post+' · Da validare '+c.daValidare+' · Remarketing '+c.rem+' · Da risentire '+c.risentire+'</dd></div>'
     +(c.contattati&&ms>60000?'<div><dt>Ritmo</dt><dd>'+dec(c.contattati/(ms/3600000))+' chiamate all\'ora</dd></div>':'');
  } else {
    h+=(c.ricerche&&ms>60000?'<div><dt>Ritmo</dt><dd>'+dec(c.ricerche/(ms/3600000))+' ricerche all\'ora</dd></div>':'')+'<div><dt>Ricerche fatte</dt><dd>'+c.ricerche+'</dd></div><div><dt>Prezzi validi</dt><dd>'+c.prezzi+' ('+pct(c.prezzi,c.ricerche)+')</dd></div>'
     +'<div><dt>Auto valide</dt><dd>'+c.autoOk+'</dd></div><div><dt>Validazione auto</dt><dd>'+c.validaz+' da valutare</dd></div>'
     +'<div><dt>Proposte fatte</dt><dd>'+c.proposte+'</dd></div><div><dt>Proposte da fare</dt><dd>'+c.daFare+'</dd></div>';
  }
  h+='</dl>';
  if(live)h+='<p style="margin:0;font-size:13.5px;color:var(--muted)">'+(lead?'Salvando, le chiamate entrano nel '+dmy(s.date)+'. I lead richiamati aggiornano la loro scheda senza essere contati due volte. Proposte, leasing / trattative e chiusure le inserisci nell\'aggiornamento di fine giornata.'
      :s.type==='ric'?'Salvando, le ricerche entrano nel '+dmy(s.date)+' e aggiornano anche i Leads online, una volta per lead.':'Salvando, le ricerche entrano nel '+dmy(s.date)+', separate dai dati dei tuoi lead.')+'</p>'
    +'<div id="ss-conf"></div><div class="row-end"><button class="btn ghost ko-t" id="ss-discard" style="margin-right:auto">Scarta sessione</button><button class="btn ghost" id="ss-back">Torna alla sessione</button><button class="btn" id="ss-save">Salva e aggiorna la dashboard</button></div>';
  h+='</div>';
  if(lead){
    const ans=s.items.map((c,i)=>({c,i})).filter(x=>x.c.risposto);
    h+='<div class="log"><div class="card-h" style="margin-bottom:4px"><h3 style="margin:0">Note per il CRM</h3>'+(ans.length&&live?'<button class="lnk" id="ss-copyall">Copia tutte</button>':'')+'</div>';
    h+=ans.length?ans.map(({c,i})=>'<div class="li"><div class="li-h"><b>'+esc(c.name||'Chiamata '+(i+1))+'</b><small>'+hhmm(c.t)+'</small></div>'+chips(callTrail(c))+(c.quando?'<p><b>Richiamare:</b> '+esc(c.quando)+'</p>':'')
      +(live?'<textarea data-note="'+i+'" aria-label="Note" placeholder="Nessuna nota">'+esc(c.note)+'</textarea><div class="acts" style="justify-content:flex-start"><button class="lnk" data-edit2="'+i+'">Modifica</button><button class="lnk" data-copy2="'+i+'">Copia per CRM</button></div>'
            :(c.note?'<p class="nt">'+esc(c.note)+'</p>':''))+'</div>').join('')
      :'<div class="empty" style="margin-top:8px">Nessuna chiamata con risposta.</div>';
    const nr=s.items.length-ans.length; if(nr)h+='<p style="margin:10px 0 0;font-size:13px;color:var(--muted)">'+nr+' '+pl(nr,'chiamata senza risposta','chiamate senza risposta')+'.</p>';
    h+='</div>';
  } else if(s.items.length){
    h+='<div class="log"><h3>Ricerche</h3>'+s.items.map((it,i)=>'<div class="li"><div class="li-h"><b>'+esc(searchTitle(it,i))+'</b><small>'+hhmm(it.t)+'</small></div>'+chips(dirTrail(it))+(it.quando?'<p><b>'+whenLbl(it)+':</b> '+esc(it.quando)+'</p>':'')+(it.note?'<p class="nt">'+esc(it.note)+'</p>':'')
      +(live?'<div class="acts" style="justify-content:flex-start"><button class="lnk" data-edit2="'+i+'">Modifica</button></div>':'')+'</div>').join('')+'</div>';
  }
  return h+'</div>';
}
async function saveSession(){
  const s=SS;
  if(!s.items.length){lsSet(DRAFT,null);closeSession();toast('Sessione vuota: niente da salvare.');return}
  const id=uid('x'), doc={type:s.type,date:s.date,startedAt:s.startedAt,endedAt:s.endedAt||Date.now(),durationMs:s.acc,items:s.items};
  lsSet(DRAFT,null);closeSession();
  if(ymOf(s.date)!==ym)ym=ymOf(s.date);
  view='dash';document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.view==='dash'));
  await put('sessions',id,doc);
  toast('Sessione salvata: dashboard aggiornata.');
}
async function deleteSession(id){
  const s=S.sessions[id];if(!s)return;
  await ensureV2(s.date);
  await del('sessions',id);toast('Sessione eliminata.');
}
async function updateSession(id,items){
  const s=S.sessions[id];if(!s)return;
  if(!items.length){await deleteSession(id);return}
  await put('sessions',id,{...s,items});
}
function viewSession(id){
  const s=S.sessions[id];if(!s)return;
  sheet('<div class="sheet-h"><h2>'+TNAME[s.type]+' <span>'+dmy(s.date)+'</span></h2><button class="x" data-close aria-label="Chiudi">×</button></div>'+sessionSummary(s,false)
    +(s.type==='lead'?'<div class="row-end"><button class="btn ghost" id="vs-copy">Copia tutte le note</button></div>':''),
    ov=>{const b=ov.querySelector('#vs-copy');if(b)b.onclick=()=>copy(s.items.map((c,i)=>({c,i})).filter(x=>x.c.risposto).map(x=>crmText(x.c,x.i+1,s.date)).join('\n\n'))});
}
function copy(text){
  const done=()=>toast('Copiato: incollalo nel CRM.');
  const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();ok?done():toast('Copia non riuscita: seleziona il testo a mano.')};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

/* ---------- avvio ---------- */
renderView();setStatus();initStore();
})();
</script>
