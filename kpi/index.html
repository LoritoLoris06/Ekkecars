<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KPI ekkecars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter+Tight:wght@400;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra bianca con logo e mese, fascia arancio col guadagno, griglia di schede squadrate; tasto + fisso in basso a destra. */
:root{
  color-scheme:light;
  --orange:#EE7A3C; --orange-dk:#D9662A; --orange-soft:#FDF1EA;
  --bg:#F2F1EE; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#6B6B6B; --line:#E2E2E2; --field:#CFCFCF;
  --ok:#1E7A46; --ok-soft:#E6F2EA; --ko:#C23A26; --ko-soft:#FBEAE6; --dark:#121212; --on-dark:#FFFFFF;
  --band-ink:#FFFFFF; --grid:#ECEBE7; --ok-btn:#1E7A46; --ko-btn:#C23A26;
  --f-head:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter","Helvetica Neue",Arial,sans-serif;
  --f-label:"Archivo","Helvetica Neue",Arial,sans-serif;
  --logo-filter:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --orange:#EE7A3C; --orange-dk:#F08A52; --orange-soft:#3A2518;
  --bg:#121212; --surface:#1C1B1A; --ink:#F2F1EE; --muted:#A5A29C; --line:#2E2C2A; --field:#45423F;
  --ok:#3DAA6A; --ok-soft:#16281D; --ko:#E0604B; --ko-soft:#301A16; --dark:#F2F1EE; --on-dark:#121212;
  --band-ink:#FFFFFF; --grid:#2A2826; --logo-filter:invert(1); --ok-btn:#23804F; --ko-btn:#C4402B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --orange:#EE7A3C; --orange-dk:#F08A52; --orange-soft:#3A2518;
  --bg:#121212; --surface:#1C1B1A; --ink:#F2F1EE; --muted:#A5A29C; --line:#2E2C2A; --field:#45423F;
  --ok:#3DAA6A; --ok-soft:#16281D; --ko:#E0604B; --ko-soft:#301A16; --dark:#F2F1EE; --on-dark:#121212;
  --band-ink:#FFFFFF; --grid:#2A2826; --logo-filter:invert(1); --ok-btn:#23804F; --ko-btn:#C4402B;
  color-scheme:dark}
*{box-sizing:border-box;border-radius:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
h1,h2,h3{font-family:var(--f-head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:16px;width:auto;filter:var(--logo-filter);display:block}
.brand .eyebrow{color:var(--orange);padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
@media (max-width:560px){.status .long{display:none}}
@media (min-width:561px){.status .short{display:none}}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.status i{width:8px;height:8px;background:var(--muted);display:block}
.status.ok i{background:var(--ok)} .status.local i{background:var(--orange)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:0 0}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:12px 4px 10px;margin-right:18px;font-family:var(--f-label);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.month{display:flex;align-items:center;gap:4px;padding-block:6px}
.month b{font-family:var(--f-head);font-weight:800;font-size:16px;min-width:150px;text-align:center}
.ic{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.ic:hover{border-color:var(--ink)}

main{padding-block:22px 120px;display:flex;flex-direction:column;gap:18px}

/* Fascia guadagno */
.band{background:var(--orange);color:var(--band-ink);padding:24px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end}
.band .eyebrow{opacity:.9}
.band .big{font-family:var(--f-head);font-weight:900;font-size:clamp(40px,8vw,64px);line-height:.95;letter-spacing:-.03em;margin-top:10px}
.band .big small{font-size:.42em;font-weight:800;letter-spacing:0;margin-right:6px}
.band .sub{margin-top:10px;font-size:14px;opacity:.95}
.proj{background:rgba(0,0,0,.14);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.proj .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px}
.proj .row b{font-family:var(--f-head);font-weight:800;font-size:20px}
.meter{height:6px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:#fff;display:block}
.meter u{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.55);display:block;text-decoration:none}
@media (max-width:720px){.band{grid-template-columns:1fr;padding:20px}}

/* Riquadri */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .eyebrow{color:var(--muted);font-size:10.5px}
.tile .v{font-family:var(--f-head);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.tile .s{font-size:13px;color:var(--muted)}

.card{background:var(--surface);padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:20px;font-weight:800}
.card-h .note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* Grafico */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .lbl{font-family:var(--f-head);font-weight:800;font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;background:var(--dark);color:var(--on-dark);font-size:12.5px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-120%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:2px solid var(--orange);display:inline-block}
.legend i.d{border-top-style:dashed}
.legend i.g{border-top:2px dashed var(--muted)}

/* Aggiornamenti scritti */
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
@media (max-width:900px){.ins{grid-template-columns:1fr}}
.ins article{padding:16px 18px 4px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.ins article + article{padding-left:18px;border-left:1px solid var(--line)}
@media (max-width:900px){.ins article + article{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
.ins .eyebrow{color:var(--orange)}
.ins p{margin:0;font-size:14.5px;max-width:62ch}

/* Funnel */
.fun{display:flex;flex-direction:column;gap:10px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.fr .n{font-weight:600;font-size:14px}
.fr .c{font-family:var(--f-head);font-weight:800;font-size:17px;text-align:right}
.fr .bar{grid-column:1/-1;height:8px;background:var(--grid);position:relative}
.fr .bar i{position:absolute;inset:0 auto 0 0;background:var(--orange);display:block}
.fr .r{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.extra{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}

/* Liste e tabelle */
.tbl-wrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-label);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-right:12px}
th.grp{text-align:center;color:var(--ink);border-bottom:2px solid var(--orange)}
th.sep,td.sep{border-left:1px solid var(--line)}
.lnk{background:none;border:0;padding:0 0 2px;border-bottom:2px solid var(--orange);font-family:var(--f-label);font-weight:800;font-size:12px}
.lnk.ko{border-bottom-color:var(--ko);color:var(--ko)}
.empty{padding:20px;border:1px dashed var(--field);color:var(--muted);font-size:14px;text-align:center}
.chip{display:inline-block;font-family:var(--f-label);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--orange);color:var(--orange)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.ko{border-color:var(--ko);color:var(--ko)}
.sale{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sale .a{font-weight:600;overflow-wrap:anywhere}
.sale .m{font-size:13px;color:var(--muted)}
.sale .g{text-align:right;font-family:var(--f-head);font-weight:800}
.sale .g small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:14px;justify-content:flex-end}
@media (max-width:520px){.sale{grid-template-columns:minmax(0,1fr) auto}.sale>.acts,.sale>span:last-child{grid-column:1/-1;justify-content:flex-start}.sale>span:empty{display:none}}

/* Pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;padding:15px 22px;font-family:var(--f-label);font-weight:800;font-size:14px;background:var(--orange);color:#fff;min-height:50px;text-align:center}
.btn:hover{background:var(--orange-dk)}
.btn.dark{background:var(--dark);color:var(--on-dark)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--field)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.ok{background:var(--ok-btn);color:#fff} .btn.ko{background:var(--ko-btn);color:#fff}
.btn.ok:hover,.btn.ko:hover{filter:brightness(1.08)}
.btn.big{min-height:74px;font-size:16px;flex-direction:column;gap:2px}
.btn.big small{font-family:var(--f-body);font-weight:500;font-size:12px;opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.four{grid-template-columns:1fr 1fr}
.row-end{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.fab{position:fixed;right:max(16px,calc((100vw - 1080px)/2 + 16px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:64px;height:64px;border:0;background:var(--orange);color:#fff;font-size:34px;line-height:1;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.fab:hover{background:var(--orange-dk)}

.resume{background:var(--dark);color:var(--on-dark);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.resume .btn{min-height:40px;padding:10px 16px}

/* Pannelli */
.ov{position:fixed;inset:0;z-index:50;background:rgba(18,18,18,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-size:24px;font-weight:800;line-height:1.1}
.sheet-h h2 span{color:var(--orange)}
.x{background:none;border:0;font-size:26px;line-height:1;padding:2px 6px;color:var(--muted)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--field);padding:16px}
.pick button:hover{border-color:var(--orange)}
.pick .k{grid-row:1/3;width:44px;height:44px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:18px}
.pick b{font-family:var(--f-head);font-weight:800;font-size:17px}
.pick small{grid-column:2;color:var(--muted);font-size:13px}
.pick .go{grid-row:1/3;grid-column:3;color:var(--orange);font-size:20px}

/* Campi */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:13px;font-weight:600}
.f .h{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],input[type=date],textarea,select{width:100%;background:var(--surface);border:1px solid var(--field);padding:12px 13px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;min-height:48px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
::placeholder{color:var(--muted);opacity:.8}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0;margin-bottom:12px;width:100%}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--orange);padding-bottom:8px;margin-bottom:4px}
.sec-h h3{font-size:18px;font-weight:800}
.sec-h span{font-size:12.5px;color:var(--muted)}
.stps{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:480px){.stps{grid-template-columns:1fr}}
.stp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stp label{font-size:14px;font-weight:500}
.stp-c{display:flex;align-items:stretch;flex:none}
.stp-c button{width:40px;height:44px;border:1px solid var(--field);background:var(--surface);font-size:18px;line-height:1}
.stp-c input{width:62px!important;min-height:44px!important;height:44px;text-align:center;padding:0!important;border-left:0!important;border-right:0!important;font-weight:700;-moz-appearance:textfield}
.stp-c input::-webkit-outer-spin-button,.stp-c input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0}
details.more[open] summary{margin-bottom:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:8px;align-items:start}
.srow .del{height:48px;border:1px solid var(--field);background:var(--surface);color:var(--ko);font-size:20px}
.srow .earn{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}
@media (max-width:480px){.srow{grid-template-columns:minmax(0,1fr) 110px 44px}}
.addl{align-self:flex-start;background:none;border:1px dashed var(--field);padding:10px 14px;font-weight:600;font-size:14px}
.addl:hover{border-color:var(--orange);color:var(--orange)}
.warn{background:var(--orange-soft);border-left:0;padding:10px 12px;font-size:13px}
.sticky-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.conf{background:var(--ko-soft);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}

/* Sessione */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sess-top{position:sticky;top:0;z-index:2;background:var(--dark);color:var(--on-dark);padding-top:env(safe-area-inset-top,0px)}
.sess-top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.sess-top .eyebrow{color:var(--orange)}
.timer{font-family:var(--f-head);font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1}
.sess-top .t{display:flex;align-items:center;gap:14px}
.sess-top .pz{background:transparent;border:1px solid currentColor;color:inherit;padding:8px 12px;font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sess-top .end{background:var(--orange);color:#fff;border:0;padding:10px 16px;font-family:var(--f-label);font-weight:800;font-size:13px}
.sess-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;padding-block:18px 40px;align-items:start}
@media (max-width:860px){.sess-body{grid-template-columns:1fr}}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface)}
.cnt.three{grid-template-columns:repeat(3,1fr)}
.cnt.four{grid-template-columns:repeat(4,1fr)}
.cnt div{padding:12px 10px;text-align:center;border-right:1px solid var(--line);min-width:0}
.cnt div:last-child{border-right:0}
.cnt b{display:block;font-family:var(--f-head);font-weight:900;font-size:24px;line-height:1.1}
.cnt span{font-size:11.5px;color:var(--muted)}
.call{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:16px}
.call-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.call-h h2{font-size:24px;font-weight:900}
.call-h h2 span{color:var(--orange)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;background:var(--line);display:block}
.steps i.on{background:var(--orange)}
.q{font-family:var(--f-head);font-weight:800;font-size:18px}
.trail{display:flex;gap:6px;flex-wrap:wrap}
.back{align-self:flex-start;background:none;border:0;padding:0 0 3px;border-bottom:2px solid var(--orange);font-family:var(--f-label);font-weight:800;font-size:12px}
.log{background:var(--surface);padding:18px 20px}
.log h3{font-size:17px;font-weight:800;margin-bottom:6px}
.li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.li:last-child{border-bottom:0}
.li-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.li-h b{font-weight:600;overflow-wrap:anywhere}
.li-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.li p{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.sumbox{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.sumbox>div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumbox dt{color:var(--muted)} .sumbox dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (max-width:480px){.sumbox>div{grid-template-columns:1fr;gap:2px}}

.dl.up{color:var(--ok)} .dl.down{color:var(--ko)} .dl.flat{color:var(--muted);font-weight:600}
.tile .dl{margin-top:2px;white-space:normal}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;background:var(--ok-soft);color:var(--ok)}
.pill.down{background:var(--ko-soft);color:var(--ko)}
.band .pill{background:#FFFFFF;color:#1E7A46}
.band .pill.down{color:#B3321F}
.seg{display:inline-flex;border:1px solid var(--field)}
.seg button{background:var(--surface);border:0;padding:8px 12px;font-family:var(--f-label);font-weight:800;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.seg button+button{border-left:1px solid var(--field)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.seg.big{align-self:flex-start}.seg.big button{padding:11px 16px;font-size:13px}
.actsum{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px}
.actsum .s{color:var(--muted)}
.legend .sq{width:10px;height:10px;display:inline-block}
.chart .halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tiles.in{grid-template-columns:repeat(4,1fr)}
.tiles.in .tile{background:var(--bg)}
@media (max-width:820px){.tiles.in{grid-template-columns:repeat(2,1fr)}}
.card.sec-l{border-top:4px solid var(--orange)}
.card.sec-d{border-top:4px solid var(--ink)}
.card.sec-r{border-top:4px solid var(--ink)}
.card.sec-t{border-top:4px solid var(--muted)}
.tag-t{color:var(--muted);display:block;margin-bottom:4px}

.tag-r{color:var(--ink);display:block;margin-bottom:4px}
.seg.per{display:grid;grid-template-columns:1fr 1fr;width:100%}.seg.per button{padding:14px 12px;font-size:13px}
.tag-l{color:var(--orange);display:block;margin-bottom:4px}
.tag-d{color:var(--ink);display:block;margin-bottom:4px}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hist-top h1{font-size:26px;font-weight:900}
.hist-top .btn{min-height:44px;padding:10px 16px}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
td.hl{color:var(--ok);font-weight:800}
th:first-child,td:first-child{box-shadow:inset -1px 0 0 var(--line)}
.top-right{display:flex;align-items:center;gap:12px}
.th-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;display:grid;place-items:center;color:var(--ink)}

.alert p{margin:0 0 4px;font-size:13.5px;line-height:1.45}.alert p:last-child{margin:0}
.alert .fix b{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.who{overflow-wrap:anywhere}
.who .chip{vertical-align:middle;font-size:10px}
.match{border:1px solid var(--orange);border-left-width:4px;background:var(--orange-soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.match .mh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.match .mh small{color:var(--muted);font-size:12.5px}

.match .lnk{align-self:flex-start}
.sugg{display:flex;flex-direction:column;gap:6px}

.sugg button[data-pick]:hover{border-color:var(--orange)}
.sugg small{color:var(--muted);font-size:12.5px;text-align:right}
.sugg .lnk{align-self:flex-start;margin-top:4px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{background:var(--surface);border:1px solid var(--field);padding:10px 13px;font-weight:600;font-size:14px;min-height:44px}
.ch:hover{border-color:var(--ink)}
.ch[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}

.ch.ko[aria-pressed="true"]{background:var(--ko-btn);border-color:var(--ko-btn);color:#fff}
.hist-mini{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.hist-mini>div{display:flex;flex-direction:column;gap:5px}
.hist-mini small{color:var(--muted);font-size:12.5px}
.btns.three{grid-template-columns:1fr 1fr}.btns.three>:last-child{grid-column:1/-1}

.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:-4px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-family:var(--f-label);font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.subnav button span{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;background:var(--bg);color:var(--ink);font-size:11px;text-align:center}

.board-top input{flex:1 1 220px;min-width:0}
.board-top .btn{min-height:48px;padding:10px 18px}
.hint{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:0 0 220px;background:var(--surface);border-top:4px solid var(--c);display:flex;flex-direction:column;min-height:140px;scroll-snap-align:start;transition:box-shadow .12s}
.col header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:10px 12px 8px;border-bottom:1px solid var(--line)}

.kc{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;border:0;border-left:4px solid var(--c);padding:10px 11px;font-weight:600;font-size:14px;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:background .25s,border-color .25s}

.kc:hover{filter:brightness(.97)}
.kc.lifting{opacity:.35}

body.dragging{cursor:grabbing}
.more,.drop-hint{font-size:12px;color:var(--muted);padding:4px 2px}
.negbar{position:fixed;left:0;right:0;bottom:0;z-index:85;background:var(--dark);color:var(--on-dark);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .15s}
.negbar.on{transform:none}

.negbar>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;max-width:1080px;margin:0 auto}

.nz.over{background:#E0604B}

.li-h .sc,.who .sc{margin-left:6px}
.cd-now{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.okbox{background:var(--ok-soft);color:var(--ink);padding:10px 12px;font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.tl .hb2{color:var(--muted)}
.tl .hr{flex-basis:100%;color:var(--ink)}
.hb-list{display:flex;flex-direction:column;gap:10px}
.hbr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:10px;align-items:center;font-size:14px}
.hbr i{display:block;height:10px;background:var(--grid)}
.hbr u{display:block;height:100%;background:var(--ink)}
.hbr b{font-size:13px;white-space:nowrap}
.negt td{vertical-align:top}
.negt td.wrap{white-space:normal;min-width:180px}
.negt small{display:block;color:var(--muted);font-size:12.5px}
.stack{display:flex;height:16px;gap:2px;margin-bottom:12px}
.stack i{display:block;min-width:4px}
.idle{background:var(--orange-soft);border-left:4px solid var(--orange);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px}
.idle .btn{min-height:40px;padding:8px 16px}

.fixdur input{width:90px;min-height:38px;padding:6px 8px}
.ped{display:flex;flex-direction:column;gap:8px}
.pr{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1.2fr) auto auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line)}
.pr.neg{border-left:4px solid var(--ko)}
.pr input[type=color]{width:44px;height:44px;padding:2px;border:1px solid var(--field);background:var(--surface)}
.pr select{min-height:44px}
.pr .pbt{display:flex;gap:4px}
.pr .pbt button{width:36px;height:40px;border:1px solid var(--field);background:var(--surface)}
.pr .pbt button[disabled]{opacity:.3;cursor:not-allowed}
@media (max-width:700px){.pr{grid-template-columns:44px minmax(0,1fr)}.pr select,.pr .chk,.pr .pbt{grid-column:1/-1}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.howto p{margin:0 0 10px;max-width:75ch;font-size:14.5px}.howto p:last-child{margin:0}
select{background:var(--surface)}
.negf input{margin-top:6px}

<script>

(function(){
'use strict';
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['dom','lun','mar','mer','gio','ven','sab'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const ymOf=iso=>iso.slice(0,7);
const ymAdd=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const monthName=ym=>MESI[+ym.slice(5)-1];
const aM=m=>(/^a/.test(m)?'ad ':'a ')+m;
const monthLabel=ym=>cap(monthName(ym))+' '+ym.slice(0,4);
const dmy=iso=>iso.slice(8)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4);
const dayShort=iso=>{const d=new Date(iso+'T12:00');return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()].slice(0,3)};
const grp=n=>{const s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"'");return (n<0?'−':'')+s};
const chf=n=>'CHF '+grp(n);
const pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
const pl=(n,one,many)=>n===1?one:many;
const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dur=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x)};
const durWords=ms=>{const m=Math.round(ms/60000);if(m<1)return 'meno di un minuto';if(m<60)return m+' '+pl(m,'minuto','minuti');const h=Math.floor(m/60),r=m%60;return h+' '+pl(h,'ora','ore')+(r?' e '+r+' '+pl(r,'minuto','minuti'):'')};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- fasi delle pipeline ----------
   lvl: 0 prima della validazione · 1 valido · 2 ricerca · 3 offerta · 4 leasing · 5 chiusura.
   Una scheda che arriva a un livello conta anche i livelli prima (tranne il leasing, che conta solo se passa da una fase leasing). */
const NEG='#C23A26';
const STAGE_DEF={
 lead:[
  {id:'x1',name:'X1',color:'#C9C5BD',lvl:0,sys:'x1'},{id:'x2',name:'X2',color:'#B5B0A7',lvl:0,sys:'x2'},{id:'x3',name:'X3',color:'#A19B91',lvl:0,sys:'x3'},
  {id:'x4',name:'X4',color:'#8C867C',lvl:0,sys:'x4'},{id:'x5',name:'X5',color:'#787167',lvl:0,sys:'x5'},
  {id:'post',name:'Posticipato',color:'#D9A21B',lvl:0,sys:'post'},
  {id:'mai',name:'Mai risposto',color:'#55504A',lvl:0,sys:'mai'},
  {id:'nonint',name:'Non interessato',color:NEG,lvl:0,neg:true,sys:'nonint'},
  {id:'nonval',name:'Non valido',color:NEG,lvl:0,neg:true,sys:'nonval'},
  {id:'perm',name:'Valutazione permuta',color:'#EE7A3C',lvl:1,sys:'perm'},
  {id:'permko',name:'Permuta non valida',color:NEG,lvl:1,neg:true,sys:'permko'},
  {id:'ric',name:'Ricerca',color:'#7B5CD6',lvl:2,sys:'ric'},
  {id:'ricko',name:'Ricerca non possibile',color:NEG,lvl:2,neg:true},
  {id:'off',name:'Offerta',color:'#2F80ED',lvl:3},
  {id:'offko',name:'Offerta rifiutata',color:NEG,lvl:3,neg:true},
  {id:'lea',name:'Leasing',color:'#14998F',lvl:4},
  {id:'leako',name:'Leasing rifiutato',color:NEG,lvl:4,neg:true},
  {id:'chi',name:'Chiusura',color:'#1E7A46',lvl:5,sys:'chi'}],
 dir:[
  {id:'new',name:'Nuova richiesta',color:'#3B7DD8',lvl:0,sys:'new'},
  {id:'nonval',name:'Non valido',color:NEG,lvl:0,neg:true},
  {id:'perm',name:'Valutazione permuta',color:'#EE7A3C',lvl:1},
  {id:'permko',name:'Permuta non valida',color:NEG,lvl:1,neg:true},
  {id:'ric',name:'Ricerca',color:'#7B5CD6',lvl:2},
  {id:'ricko',name:'Ricerca non possibile',color:NEG,lvl:2,neg:true},
  {id:'off',name:'Proposta',color:'#2F80ED',lvl:3},
  {id:'offko',name:'Proposta rifiutata',color:NEG,lvl:3,neg:true},
  {id:'lea',name:'Leasing',color:'#14998F',lvl:4},
  {id:'leako',name:'Leasing rifiutato',color:NEG,lvl:4,neg:true},
  {id:'chi',name:'Chiusura',color:'#1E7A46',lvl:5,sys:'chi'}]};
const REASONS_DEF={
 nonint:['Non ricorda la richiesta','Cercava solo informazioni','Ha già comprato','Prezzi troppo alti','Non è il momento'],
 nonval:['Budget insufficiente','Non solvibile / non finanziabile','Auto che non trattiamo','Tempi troppo lunghi','Fuori zona'],
 permko:['Valutazione troppo bassa per il cliente','Debito residuo sull\'auto','Auto non ritirabile','Cliente non vuole cederla'],
 ricko:['Auto introvabile','Budget non realistico','Requisiti troppo specifici','Tempi di consegna troppo lunghi'],
 offko:['Prezzo troppo alto','Ha trovato altrove','Ci ha ripensato','Auto non convincente','Tempi di consegna'],
 leako:['Finanziamento non approvato','Rata troppo alta','Anticipo troppo alto','Durata non adatta']};
const LVL_LBL=['Prima della validazione','Valido','Ricerca','Offerta','Leasing','Chiusura'];
const KIND_LBL={lead:'Lead',dir:'Contatti diretti'};
const DEF_SET={pctOnline:18,pctDiretta:15,goal:0,sabato:false,callsDay:0};
const stagesOf=kind=>(S.settings.pipes&&S.settings.pipes[kind]&&S.settings.pipes[kind].length?S.settings.pipes[kind]:STAGE_DEF[kind]);
const stageOf=(kind,id)=>stagesOf(kind).find(s=>s.id===id)||null;
const sysStage=(kind,sys)=>stagesOf(kind).find(s=>s.sys===sys)||null;
const reasonsOf=(kind,id)=>{const r=S.settings.reasons&&S.settings.reasons[kind]&&S.settings.reasons[kind][id];return r&&r.length?r:(REASONS_DEF[id]||[])};
const LKEYS=[['contattati','Chiamate fatte'],['risposti','Risposte'],['interessati','Interessati'],['validi','Validi'],['ricerche','Ricerche'],['proposte','Offerte'],['trattative','Leasing']];

/* ---------- archivio dati ---------- */
const CACHE='ekk-kpi-cache-v1', DRAFT='ekk-kpi-session-v1', COLS=['days','sales','sessions','cards','moves'];
let S={days:{},sales:{},sessions:{},cards:{},moves:{},settings:{...DEF_SET}}, dirty=false;
const cached=lsGet(CACHE); if(cached){COLS.forEach(c=>S[c]=cached[c]||{});S.settings={...DEF_SET,...(cached.settings||{})};dirty=!!cached.dirty}
let db=null, mode='init';
const saveCache=()=>lsSet(CACHE,{...S,dirty});
const setStatus=()=>{const el=$('#status');el.className='status '+(mode==='db'?'ok':mode==='local'?'local':'');
  el.querySelector('span').innerHTML=mode==='db'?'<span class="long">Dati salvati online</span><span class="short">Salvato</span>':mode==='local'?'<span class="long">Dati salvati solo su questo dispositivo</span><span class="short">Solo locale</span>':'Caricamento…'};
let EC=null;
async function put(col,id,data){
  if(col==='settings')S.settings={...DEF_SET,...data};else S[col][id]=data;
  EC=null; if(!db)dirty=true; saveCache(); renderView();
  if(db){try{await db.collection(col).doc(id).set(data)}catch(e){toast('Salvataggio non riuscito. Controlla la connessione e riprova.')}}
}
async function del(col,id){
  delete S[col][id]; EC=null; if(!db)dirty=true; saveCache(); renderView();
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast('Eliminazione non riuscita. Riprova.')}}
}
async function initStore(){
  let tries=0; while(!(window.claude&&window.claude.use)&&tries<20){await new Promise(r=>setTimeout(r,150));tries++}
  if(window.claude&&window.claude.use){try{db=await window.claude.use('db')}catch(e){db=null}}
  if(!db){mode='local';setStatus();return}
  mode='db';setStatus();
  const first={};let firstCount=0;const doneFirst=()=>{if(++firstCount===COLS.length+1&&dirty){dirty=false;saveCache()}};
  const sub=col=>db.collection(col).limit(5000).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    if(!first[col]){first[col]=true;const up=dirty&&snap.empty&&Object.keys(S[col]).length;
      if(up)Object.entries(S[col]).forEach(([id,v])=>db.collection(col).doc(id).set(v).catch(()=>{}));
      doneFirst();if(up)return;
    }
    S[col]=o;EC=null;saveCache();renderView();
  },()=>{mode='local';setStatus()});
  COLS.forEach(sub);
  let setFirst=false;
  db.collection('settings').doc('main').onSnapshot(d=>{
    if(!setFirst){setFirst=true;doneFirst()}
    if(d.exists)S.settings={...DEF_SET,...d.data()};
    else if(dirty)db.collection('settings').doc('main').set(S.settings).catch(()=>{});
    EC=null;saveCache();renderView();
  },()=>{});
}

/* ---------- motore: schede ricostruite da chiamate, nuove schede e spostamenti ---------- */
const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const leadKey=it=>it.lid||(normName(it.name)?'n:'+normName(it.name):null);
const tidy=s=>String(s||'').trim().replace(/\s+/g,' ');
const tryNum=st=>st&&/^x\d$/.test(st.sys||'')?+st.sys.slice(1):0;
function callTarget(it,cur){ // fase a cui porta una chiamata, o null se la scheda resta dov'è
  const K='lead', st=cur?stageOf(K,cur):null, lv=st?st.lvl:0;
  if(!it.risposto){
    if(!cur||tryNum(st)){const n=(st?tryNum(st):0)+1;const x=sysStage(K,'x'+n);return x?x.id:(sysStage(K,'mai')||{}).id}
    return null;
  }
  let sys=null;
  if(it.esito==='posticipato'||it.esito==='da_validare'||it.esito==='remarketing')sys='post';
  else if(it.esito==='non_valido')sys='nonval';
  else if(it.interessato===false)sys='nonint';
  else if(it.esito==='valido')sys=it.permuta==='non_valida'?'permko':it.ricerca==='confermata'?'ric':'perm';
  else sys='post';
  const t=sysStage(K,sys);if(!t)return null;
  if(!cur||t.neg||(st&&st.neg)||t.lvl>lv||(t.sys==='post'&&lv===0))return t.id===cur?null:t.id;
  return null;
}
function engine(){
  if(EC)return EC;
  const cards={}, ev=[], calls={}, ans={};
  const card=(kind,key)=>cards[kind+'|'+key]=cards[kind+'|'+key]||{id:kind+'|'+key,kind,key,name:'',note:'',stage:null,stageT:0,stageDate:null,hist:[],reach:{},calls:[],created:null,neg:null,closure:null,maxLvl:-1};
  Object.entries(S.sessions).forEach(([sid,s])=>{if(s.type!=='lead'||!s.date)return;
    (s.items||[]).forEach((it,i)=>{const key=leadKey(it)||'a:'+sid+':'+i;ev.push({t:it.t||s.startedAt||0,date:s.date,kind:'lead',key,call:{sid,i,it}})})});
  Object.entries(S.cards).forEach(([id,c])=>{if(c.kind==='dir')ev.push({t:c.t||0,date:c.date,kind:'dir',key:id,create:c})});
  Object.entries(S.moves).forEach(([mid,m])=>ev.push({t:m.t||0,date:m.date,kind:m.kind,key:m.ref,move:{...m,mid}}));
  ev.sort((a,b)=>a.t-b.t||(b.create?1:0)-(a.create?1:0));
  const mark=(c,k,d)=>{if(!c.reach[k])c.reach[k]=d};
  const setStage=(c,to,e,info)=>{const st=stageOf(c.kind,to);if(!st)return;
    c.stage=to;c.stageT=e.t;c.stageDate=e.date;c.hist.push({t:e.t,date:e.date,to,...info});
    if(c.kind==='lead'&&!tryNum(st)&&st.sys!=='mai')mark(c,'risp',e.date);
    if(st.lvl>=1){mark(c,'int',e.date);mark(c,'valid',e.date)}
    if(st.lvl>=2)mark(c,'ric',e.date); if(st.lvl>=3)mark(c,'off',e.date); if(st.lvl===4)mark(c,'lea',e.date);
    c.maxLvl=Math.max(c.maxLvl,st.lvl);
    c.neg=st.neg?{stage:to,date:e.date,t:e.t,reason:info.reason||'',rnote:info.rnote||'',mid:info.mid||null}:null;
    c.closure=st.lvl===5&&!st.neg?{date:e.date,t:e.t,auto:info.auto||'',margine:+info.margine||0,mid:info.mid||null}:null;
  };
  ev.forEach(e=>{
    if(e.create){const c=card('dir',e.key);c.name=e.create.name||'';c.note=e.create.note||'';c.created=e.date;c.createdT=e.t;setStage(c,(sysStage('dir','new')||stagesOf('dir')[0]).id,e,{by:'nuova'});return}
    if(e.call){const {it}=e.call,c=card('lead',e.key);
      const nm=tidy(it.name);if(nm&&(!c.name||(/[A-Z]/.test(nm)&&!/[A-Z]/.test(c.name))))c.name=nm;
      if(!c.created){c.created=e.date;c.createdT=e.t}
      c.calls.push({...e.call,date:e.date,t:e.t});
      calls[e.date]=(calls[e.date]||0)+1;if(it.risposto)ans[e.date]=(ans[e.date]||0)+1;
      if(it.risposto)mark(c,'risp',e.date); if(it.interessato)mark(c,'int',e.date);
      const to=callTarget(it,c.stage);
      if(to)setStage(c,to,e,{by:'chiamata',reason:it.reason,rnote:it.rnote,sid:e.call.sid,i:e.call.i});
      else if(!c.stage){const x=sysStage('lead','post');if(x)setStage(c,x.id,e,{by:'chiamata'})}
      return}
    if(e.move){const c=cards[e.kind+'|'+e.key];if(!c)return;setStage(c,e.move.to,e,{by:'manuale',reason:e.move.reason,rnote:e.move.rnote,auto:e.move.auto,margine:e.move.margine,mid:e.move.mid})}
  });
  Object.entries(S.cards).forEach(([id,m])=>{if(m.kind!=='lead')return;const c=cards['lead|'+m.key];if(!c)return;if(m.name)c.name=m.name;if(m.note!=null)c.note=m.note;c.metaId=id});
  Object.values(cards).forEach(c=>{if(!c.name)c.name=c.kind==='lead'?'Lead senza nome':'Contatto senza nome'});
  EC={cards,calls,ans};return EC;
}
const cardsOf=kind=>Object.values(engine().cards).filter(c=>c.kind===kind);

/* ---------- correzioni manuali dei giorni (dati inseriti a mano prima della pipeline) ---------- */
const emptyL=()=>({contattati:0,risposti:0,interessati:0,validi:0,ricerche:0,proposte:0,trattative:0,min:0});
function partsOf(s){const a=s.applied||{};return ['L','D','R','T'].some(k=>a[k]&&typeof a[k]==='object')?a:{[{lead:'L',dir:'D',ric:'R',team:'T'}[s.type]||'D']:a}}
function adjOf(date){
  const day=S.days[date];if(!day)return {};
  if(day.v===2)return (day.adj&&day.adj.L)||{};
  if(!day.L)return {};
  const a={...day.L};
  Object.values(S.sessions).forEach(s=>{if(s.date!==date||!s.applied)return;const P=partsOf(s).L;if(P)for(const k in P)a[k]=(+a[k]||0)-(+P[k]||0)});
  return a;
}
async function ensureV2(date){const day=S.days[date];if(!day||day.v===2)return;await put('days',date,{date,v:2,adj:{L:adjOf(date)},updatedAt:Date.now()})}

/* ---------- numeri del mese ---------- */
const inM=(d,ym,cut)=>d&&ymOf(d)===ym&&!(cut&&d>cut);
function salesOf(ym,cut){
  const out=[];
  Object.entries(S.sales).forEach(([id,s])=>{if(inM(s.date,ym,cut))out.push({id,legacy:true,kind:s.channel==='diretta'?'dir':'lead',...s})});
  Object.values(engine().cards).forEach(c=>{if(c.closure&&inM(c.closure.date,ym,cut))out.push({id:c.id,cardId:c.id,kind:c.kind,channel:c.kind==='lead'?'online':'diretta',date:c.closure.date,auto:c.closure.auto,margine:c.closure.margine,name:c.name})});
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
const earn=s=>(+s.margine||0)*(s.channel==='diretta'?S.settings.pctDiretta:S.settings.pctOnline)/100;
function dayLead(date){ // numeri dei lead di un giorno: pipeline + correzioni manuali
  const E=engine(), o=emptyL(), a=adjOf(date);
  o.contattati=E.calls[date]||0;
  cardsOf('lead').forEach(c=>{const r=c.reach;if(r.risp===date)o.risposti++;if(r.int===date)o.interessati++;if(r.valid===date)o.validi++;if(r.ric===date)o.ricerche++;if(r.off===date)o.proposte++;if(r.lea===date)o.trattative++});
  Object.values(S.sessions).forEach(s=>{if(s.type==='lead'&&s.date===date)o.min+=Math.round((s.durationMs||0)/60000)});
  for(const k in o)o[k]=Math.max(0,o[k]+(+a[k]||0));
  return o;
}
function dayDir(date){const o={nuovi:0,valid:0,ric:0,off:0,lea:0};
  cardsOf('dir').forEach(c=>{if(c.created===date)o.nuovi++;const r=c.reach;if(r.valid===date)o.valid++;if(r.ric===date)o.ric++;if(r.off===date)o.off++;if(r.lea===date)o.lea++});return o}
function allDates(){const s=new Set();Object.keys(S.days).forEach(d=>s.add(d));Object.values(S.sessions).forEach(x=>x.date&&s.add(x.date));Object.values(S.sales).forEach(x=>x.date&&s.add(x.date));
  Object.values(S.moves).forEach(x=>x.date&&s.add(x.date));Object.values(S.cards).forEach(x=>x.date&&s.add(x.date));return [...s].filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)).sort()}
function stats(ym,cut){
  const L={...emptyL(),nuovi:0,chiusure:0}, D={nuovi:0,valid:0,ric:0,off:0,lea:0,chiusure:0};let active=0;
  allDates().forEach(d=>{if(!inM(d,ym,cut))return;const x=dayLead(d),y=dayDir(d);let any=0;
    for(const k in x){L[k]+=x[k];any+=x[k]} for(const k in y){D[k]+=y[k];any+=y[k]} if(any)active++});
  cardsOf('lead').forEach(c=>{if(inM(c.created,ym,cut))L.nuovi++});
  const sales=salesOf(ym,cut), sl=sales.filter(s=>s.kind==='lead'), sd=sales.filter(s=>s.kind==='dir');
  L.chiusure=sl.length;D.chiusure=sd.length;
  const mL=sl.reduce((a,s)=>a+(+s.margine||0),0), mD=sd.reduce((a,s)=>a+(+s.margine||0),0), gL=sl.reduce((a,s)=>a+earn(s),0), gD=sd.reduce((a,s)=>a+earn(s),0);
  return {ym,L,D,active,sales,mL,mD,gL,gD,m:mL+mD,g:gL+gD,n:sales.length,hasData:active>0||sales.length>0};
}
function callLog(from,to){const out=[];Object.values(S.sessions).forEach(s=>{if(s.type!=='lead'||!s.date||s.date<from||s.date>to)return;(s.items||[]).forEach(it=>{if(it.t)out.push({date:s.date,t:it.t,ok:!!it.risposto})})});return out}
function hourStats(calls){const h={};calls.forEach(c=>{const k=new Date(c.t).getHours();const o=h[k]=h[k]||{n:0,ok:0};o.n++;if(c.ok)o.ok++});return h}
function bestHours(calls,min){const h=hourStats(calls),tot=calls.length,okT=calls.filter(c=>c.ok).length;
  const list=Object.entries(h).filter(([,o])=>o.n>=(min||6)).map(([k,o])=>({h:+k,n:o.n,r:o.ok/o.n})).sort((a,b)=>b.r-a.r);
  return {list,avg:tot?okT/tot:0}}
const hLbl=h=>h+'–'+(h+1);
const isoAdd=(iso,k)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+k);return isoOf(d)};
const isWork=iso=>{const w=new Date(iso+'T12:00').getDay();return w>0&&(w<6||S.settings.sabato)};
function pastWorkdays(n){const out=[];let d=isoAdd(today(),-1),g=0;while(out.length<n&&g<60){if(isWork(d))out.push(d);d=isoAdd(d,-1);g++}return out}
function workdays(ym,uptoDay){
  const [y,m]=ym.split('-').map(Number), n=new Date(y,m,0).getDate(); let c=0;
  for(let d=1;d<=Math.min(n,uptoDay??n);d++){const w=new Date(y,m-1,d).getDay();if(w>0&&(w<6||S.settings.sabato))c++}
  return c;
}
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);
function projection(st){
  const cur=ymOf(today());
  if(st.ym!==cur)return null;
  const tot=workdays(st.ym), el=workdays(st.ym,+today().slice(8));
  if(!el)return null;
  return {g:st.g/el*tot,m:st.m/el*tot,n:st.n/el*tot,el,tot,rem:tot-el,pace:st.g/el};
}

const hm=min=>{min=Math.round(min||0);if(min<60)return min+' min';const h=Math.floor(min/60),r=min%60;return h+' h'+(r?' '+r+' min':'')};
const dec=n=>(Math.round(n*10)/10).toString().replace('.',',');
function nthWorkday(ym,n){
  const [y,m]=ym.split('-').map(Number),N=daysIn(ym);let c=0;
  for(let d=1;d<=N;d++){const w=new Date(y,m-1,d).getDay();if(w>0&&(w<6||S.settings.sabato)){c++;if(c>=n)return ym+'-'+pad(d)}}
  return ym+'-'+pad(N);
}
function prevComparable(st){
  const pv=ymAdd(st.ym,-1), p=projection(st);
  return p?{st:stats(pv,nthWorkday(pv,p.el)),same:true}:{st:stats(pv),same:false};
}
function delta(cur,prev,label,inverse){
  if(!(prev>0)||cur==null)return '';
  const r=(cur-prev)/prev, good=inverse?r<=0:r>=0, v=Math.round(Math.abs(r)*100);
  if(v===0)return '<span class="dl flat">= '+esc(label)+'</span>';
  return '<span class="dl '+(good?'up':'down')+'">'+(r>=0?'▲':'▼')+' '+v+'% '+esc(label)+'</span>';
}
function ptDelta(r,pr){
  if(r==null||pr==null)return '';
  const d=Math.round((r-pr)*100);
  if(d===0)return ' <span class="dl flat">= mese scorso</span>';
  return ' <span class="dl '+(d>0?'up':'down')+'">'+(d>0?'▲ +':'▼ ')+d+' pt</span>';
}

function weakest(steps,cur,prev){
  const c=steps.map(([to,from,label,tip])=>({label,tip,from:cur[from],to:cur[to],r:cur[from]?cur[to]/cur[from]:null,pr:prev&&prev[from]>=5?prev[to]/prev[from]:null})).filter(x=>x.from>=5);
  if(!c.length)return null;
  const wp=c.filter(x=>x.pr!=null).map(x=>({...x,d:x.r-x.pr})).sort((a,b)=>a.d-b.d);
  if(wp.length&&wp[0].d<=-0.05)return {...wp[0],kind:'drop'};
  return {...c.slice().sort((a,b)=>a.r-b.r)[0],kind:'low'};
}

function callGoal(){
  if(S.settings.callsDay>0)return {v:S.settings.callsDay,lbl:'il tuo obiettivo di'};
  const pv=ymAdd(ymOf(today()),-1);let n=0,t=0;allDates().forEach(d=>{if(ymOf(d)!==pv)return;const c=dayLead(d).contattati;if(c>0){n++;t+=c}});
  return n>=5?{v:Math.round(t/n),lbl:'la tua media di '+monthName(pv)+':'}:{v:0,lbl:''};
}
function alerts(kind,st){
  const out=[],set=S.settings;

  const p=projection(st);if(!p||!st.hasData)return out;
  if(set.goal>0&&p.el>=4){const pace=set.goal*p.el/p.tot,r=pace?st.g/pace:1;
    if(r<0.6)out.push({t:'Sei lontano dall\'obiettivo del mese',x:'Sei a '+chf(st.g)+' (lead e contatti diretti), il '+Math.round(r*100)+'% del ritmo che serve oggi ('+chf(pace)+'). Di questo passo chiudi a circa '+chf(p.g)+' su '+chf(set.goal)+'.',
      f:'parti dalle schede in offerta e leasing: sono le più vicine alla firma.'})}
  if(kind==='lead'){
    const recent=callLog(isoAdd(today(),-60),today()), best=bestHours(recent,8).list.slice(0,2).map(x=>'tra le '+hLbl(x.h));
    const bestTxt=best.length?best.join(' e '):'nelle stesse due fasce fisse ogni giorno (ad esempio 9–11 e 17–19)';
    const tg=callGoal(), wd=pastWorkdays(5);
    if(tg.v>0&&wd.length>=3){const avg=wd.reduce((a,d)=>a+dayLead(d).contattati,0)/wd.length;
      if(avg<tg.v*0.6)out.push({t:'Stai facendo troppe poche chiamate',x:'Negli ultimi '+wd.length+' giorni lavorativi la media è '+dec(avg)+' '+(avg===1?'chiamata':'chiamate')+' al giorno, contro '+tg.lbl+' '+tg.v+'.',f:'blocca in agenda le chiamate '+bestTxt+' e non chiudere la sessione prima di '+tg.v+'.'})}
    let idle=0;for(const d of pastWorkdays(10)){if(dayLead(d).contattati)break;idle++}
    if(idle>=2&&idle<10)out.push({t:'Nessuna chiamata da '+idle+' giorni lavorativi',x:'Negli ultimi '+idle+' giorni lavorativi non risultano chiamate: i lead si raffreddano.',f:'riparti oggi con una sessione corta, iniziando dai posticipati e dagli X1–X5.'});

  } else {

function niceStep(v){const e=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function drawActivity(kind){
  const box=$('#act');if(!box)return;

  const vals={};for(let d=1;d<=N;d++){const iso=ym+'-'+pad(d);vals[d]=kind==='lead'?dayLead(iso).contattati:dayDir(iso).nuovi}

  const W=Math.max(box.clientWidth,260), H=180, L=30,R=6,T=14,B=24;
  const vmax=Math.max(T0,...days.map(val),kind==='lead'?5:3)*1.18, step=Math.max(1,niceStep(vmax/3)), ymax=Math.ceil(vmax/step)*step;
  const bw=(W-L-R)/days.length, y=v=>T+(1-v/ymax)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+(kind==='lead'?'Chiamate':'Nuovi contatti')+' per giorno">';
  for(let v=0;v<=ymax+1e-6;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  let above=0,elapsed=0;

  segs.forEach(g=>{if(g.past&&isWd(g.d)){elapsed++;if(T0&&g.v>=T0)above++}});
  segs.forEach(g=>{if(g.past){const hg=Math.max(g.v?H-B-y(g.v):2,2);s+='<rect x="'+g.x0+'" y="'+(H-B-hg)+'" width="'+g.w+'" height="'+hg+'" fill="'+g.c+'"/>'}else s+='<rect x="'+g.x0+'" y="'+(H-B-2)+'" width="'+g.w+'" height="2" fill="var(--grid)"/>';
    const wd=new Date(yy,mm-1,g.d).getDay();if(g.d===1||wd===1)s+='<text class="ax" x="'+(g.x0+g.w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+g.d+'</text>'});
  if(T0)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(T0)+'" y2="'+y(T0)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  segs.forEach((g,i)=>{s+='<rect class="hb" data-i="'+i+'" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent"/>'});
  s+='</svg><div class="tip" hidden></div>';box.innerHTML=s;
  const what=v=>kind==='lead'?pl(v,'chiamata','chiamate'):pl(v,'nuovo contatto','nuovi contatti');

  const tot=segs.reduce((a,g)=>a+(g.past?g.v:0),0);

  $('#act-legend').innerHTML=T0?'<span><b class="sq" style="background:var(--ok)"></b>Sopra l\'obiettivo</span><span><b class="sq" style="background:var(--ko)"></b>Sotto</span><span><i class="g" style="border-top-color:var(--ink)"></i>'+tl+': '+T0+' al giorno</span>':'';

function drawChart(){
  const box=$('#chart');if(!box)return;
  const st=stats(ym), p=projection(st), N=daysIn(ym), goal=S.settings.goal, tot=workdays(ym);
  const lastDay=ym===ymOf(today())?+today().slice(8):(ym<ymOf(today())?N:0);
  const per=new Array(N+1).fill(0); st.sales.forEach(s=>{per[+s.date.slice(8)]+=earn(s)});
  const cum=[0];for(let d=1;d<=N;d++)cum[d]=cum[d-1]+per[d];
  const pace=d=>goal>0&&tot?goal*workdays(ym,d)/tot:null;
  const W=Math.max(box.clientWidth,280), H=Math.round(Math.min(280,Math.max(200,W*.34))), L=48,R=18,T=22,B=28;
  const top=Math.max(p?p.g:0,goal||0,cum[Math.max(lastDay,0)]||0,100)*1.12;
  const step=niceStep(top/4), ymax=Math.ceil(top/step)*step;
  const x=d=>L+(d-1)/(N-1)*(W-L-R), y=v=>T+(1-v/ymax)*(H-T-B);
  const ahead=goal>0&&lastDay>=1?cum[lastDay]>=pace(lastDay):null;
  const col=ahead==null?'var(--orange)':ahead?'var(--ok)':'var(--ko)';
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Guadagno cumulato di '+monthName(ym)+'">'
   +'<defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".32"/><stop offset="1" stop-color="'+col+'" stop-opacity=".02"/></linearGradient></defs>';
  for(let v=0;v<=ymax+1e-6;v+=step)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(v>=1000?dec(v/1000)+'k':grp(v))+'</text>';
  [1,8,15,22,N].forEach(d=>{s+='<text class="ax" x="'+x(d)+'" y="'+(H-8)+'" text-anchor="'+(d===1?'start':d===N?'end':'middle')+'">'+d+'</text>'});
  if(goal>0){let pd='M'+x(1)+' '+y(pace(1));for(let d=2;d<=N;d++)pd+=' L'+x(d)+' '+y(pace(d));
    s+='<path d="'+pd+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>';}
  if(lastDay>=1){
    let d='M'+x(1)+' '+y(cum[1]);for(let i=2;i<=lastDay;i++)d+=' L'+x(i)+' '+y(cum[i]);
    s+='<path d="'+d+' L'+x(lastDay)+' '+y(0)+' L'+x(1)+' '+y(0)+'Z" fill="url(#gfill)" stroke="none"/>';
    s+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    for(let i=1;i<=lastDay;i++)if(per[i]>0)s+='<circle cx="'+x(i)+'" cy="'+y(cum[i])+'" r="4" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';
    if(p&&lastDay<N)s+='<line x1="'+x(lastDay)+'" y1="'+y(cum[lastDay])+'" x2="'+x(N)+'" y2="'+y(p.g)+'" stroke="'+col+'" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/><circle cx="'+x(N)+'" cy="'+y(p.g)+'" r="4" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>';
    s+='<circle cx="'+x(lastDay)+'" cy="'+y(cum[lastDay])+'" r="6.5" fill="'+col+'" stroke="var(--surface)" stroke-width="2.5"/>';
    const lx=x(lastDay), anchor=lx>W-140?'end':'start', ly=y(cum[lastDay]);
    const near=false;
    s+='<text class="lbl" x="'+(lx+(anchor==='end'?-12:12))+'" y="'+(near||ly<T+16?ly+22:ly-12)+'" text-anchor="'+anchor+'">'+chf(cum[lastDay])+'</text>';
  }
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect class="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/></svg><div class="tip" hidden></div>';
  box.innerHTML=s;
  const xh=box.querySelector('.xh');
  setupHover(box,'.hit',(el,e)=>{const r=box.getBoundingClientRect();let d=Math.round((e.clientX-r.left-L)/(W-L-R)*(N-1))+1;d=Math.max(1,Math.min(N,d));
    xh.setAttribute('x1',x(d));xh.setAttribute('x2',x(d));xh.setAttribute('visibility','visible');
    const has=d<=lastDay, pc=pace(d);
    let t=dayShort(ym+'-'+pad(d))+' · '+(has?chf(cum[d])+(per[d]?' (+'+grp(per[d])+')':''):'giorno futuro');
    if(has&&pc!=null)t+=' · '+(cum[d]>=pc?'avanti di '+grp(cum[d]-pc):'indietro di '+grp(pc-cum[d]));
    return {text:t,x:Math.min(Math.max(x(d),90),W-90),y:has?y(cum[d]):y(0)}});
  $('#chart-legend').innerHTML='<span><i style="border-top-color:'+col+'"></i>Guadagno'+(ahead==null?'':ahead?' (avanti sul ritmo)':' (indietro sul ritmo)')+'</span>'
    +(p&&lastDay<N?'<span><i class="d" style="border-top-color:'+col+'"></i>Proiezione</span>':'')
    +(goal>0?'<span><i class="g"></i>Ritmo per l\'obiettivo di '+chf(goal)+'</span>':'');
}

/* ---------- pipeline ---------- */
let DRAG=null, pipeQ='';
const tint=c=>'color-mix(in srgb,'+c+' 13%,var(--surface))';
function boardCards(kind,stageId){

function renderBoard(kind){

      +(more?'<span class="more">+ '+more+' chiuse da più di 45 giorni</span>':'')+(!all?'<span class="drop-hint">Vuota</span>':'')+'</div></section>'});

function bindBoard(kind){
  const b=$('#board');if(!b)return;
  const q=$('#pipe-q');if(q)q.oninput=()=>{pipeQ=q.value;const p=q.selectionStart;renderView();const n=$('#pipe-q');if(n){n.focus();n.setSelectionRange(p,p)}};
  const nd=$('#new-dir');if(nd)nd.onclick=newDirect;
  const ns=$('#new-sess');if(ns)ns.onclick=()=>{lsGet(DRAFT)?resumeSession():startSession('lead')};
  let st=null, timer=null, suppress=false;
  const begin=(e,el)=>{DRAG={kind,id:el.dataset.card,el,x:e.clientX,y:e.clientY,target:null};
    const g=el.cloneNode(true);g.className='kc ghost';g.style.width=el.offsetWidth+'px';document.body.appendChild(g);DRAG.ghost=g;
    el.classList.add('lifting');document.body.classList.add('dragging');$('#negbar').classList.add('on');place(e.clientX,e.clientY);if(navigator.vibrate)navigator.vibrate(15)};
  const place=(x,y)=>{const g=DRAG.ghost;g.style.left=(x-g.offsetWidth/2)+'px';g.style.top=(y-22)+'px';
    const t=document.elementFromPoint(x,y),z=t&&t.closest('[data-drop]');document.querySelectorAll('.over').forEach(n=>n!==z&&n.classList.remove('over'));if(z)z.classList.add('over');DRAG.target=z?z.dataset.drop:null;
    const r=b.getBoundingClientRect();if(x<r.left+40)b.scrollLeft-=14;else if(x>r.right-40)b.scrollLeft+=14};
  const end=()=>{if(!DRAG)return;const d=DRAG;DRAG=null;d.ghost.remove();d.el.classList.remove('lifting');document.body.classList.remove('dragging');
    document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));const nb=$('#negbar');if(nb)nb.classList.remove('on');
    const c=engine().cards[d.id];if(c&&d.target&&d.target!==c.stage)moveCard(c,d.target);else renderView()};
  b.addEventListener('pointerdown',e=>{suppress=false;const el=e.target.closest('.kc');if(!el||el.classList.contains('ghost'))return;
    st={x:e.clientX,y:e.clientY,el,touch:e.pointerType!=='mouse'};
    if(st.touch)timer=setTimeout(()=>{if(st){begin({clientX:st.x,clientY:st.y},st.el);suppress=true}},280)});
  window.onpointermove=e=>{if(DRAG){place(e.clientX,e.clientY);return}
    if(!st)return;const dx=Math.abs(e.clientX-st.x),dy=Math.abs(e.clientY-st.y);
    if(st.touch){if(dx>8||dy>8){clearTimeout(timer);st=null}return}
    if(dx>5||dy>5){begin(e,st.el);suppress=true;st=null}};
  window.onpointerup=()=>{clearTimeout(timer);st=null;if(DRAG)end()};
  window.onpointercancel=()=>{clearTimeout(timer);st=null;if(DRAG)end()};
  if(!bindBoard.tm){bindBoard.tm=1;document.addEventListener('touchmove',e=>{if(DRAG)e.preventDefault()},{passive:false})}
  b.addEventListener('click',e=>{const el=e.target.closest('.kc');if(!el)return;if(suppress){suppress=false;return}openCard(el.dataset.card)});
  b.addEventListener('contextmenu',e=>{if(e.target.closest('.kc'))e.preventDefault()});
}

/* ---------- spostamenti ---------- */
async function moveCard(c,to,opts){
  const s=stageOf(c.kind,to);if(!s)return;
  const go=async extra=>{const id=uid('m'),m={kind:c.kind,ref:c.key,to,t:Date.now(),date:(opts&&opts.date)||today(),...extra};
    await put('moves',id,m);toast(c.name+' → '+s.name+(s.neg?': in Non conclusi.':'.'),()=>del('moves',id))};
  if(s.neg)return reasonSheet(c.kind,s,c.name,null,(reason,rnote)=>go({reason,rnote}),()=>renderView());

function drawWeek(){
  const box=$('#wk');if(!box)return;
  const ses=monthSessions(ym), names=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'], tot={};
  ses.forEach(s=>{const w=(new Date(s.date+'T12:00').getDay()+6)%7,k=s.type==='lead'?'lead':s.type==='team'?'team':'ric';const o=tot[w]=tot[w]||{lead:0,ric:0,team:0};o[k]+=(s.durationMs||0)/60000});
  const ws=[0,1,2,3,4].concat(S.settings.sabato||tot[5]?[5]:[]).concat(tot[6]?[6]:[]);
  const W=Math.max(box.clientWidth,280), L=44, R=70, row=30, T=4, H=T+ws.length*row;
  const max=Math.max(60,...ws.map(w=>{const o=tot[w]||{};return (o.lead||0)+(o.ric||0)+(o.team||0)}));
  const x=m=>L+m/max*(W-L-R);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Ore per giorno della settimana">';
  const segs=[];

    s+='<text class="ax" x="0" y="'+(y+row/2+4)+'">'+names[w]+'</text><rect x="'+L+'" y="'+(y+6)+'" width="'+(W-L-R)+'" height="'+(row-12)+'" fill="var(--grid)"/>';
    ['lead','ric','team'].forEach(k=>{if(!o[k])return;const wd=x(o[k])-L;s+='<rect x="'+cx+'" y="'+(y+6)+'" width="'+wd+'" height="'+(row-12)+'" fill="'+TCOL[k]+'"/>';cx+=wd});
    const t=o.lead+o.ric+o.team;s+='<text class="ax" x="'+(cx+8)+'" y="'+(y+row/2+4)+'">'+(t?hm(t):'—')+'</text>';

function sessionRates(ymX){

/* ---------- sessione di chiamate ---------- */
let SS=null, tick=null;
const IDLE_MS=30*60000;
const saveDraft=()=>lsSet(DRAFT,SS);
const elapsed=()=>SS?SS.acc+(SS.runFrom?Date.now()-SS.runFrom:0):0;
function startSession(){
  SS={type:'lead',date:today(),startedAt:Date.now(),acc:0,runFrom:Date.now(),lastAct:Date.now(),items:[],cur:newCall(),phase:'work'};
  saveDraft();openSession();
}
function resumeSession(){SS=lsGet(DRAFT);if(!SS)return;if(!SS.lastAct)SS.lastAct=Date.now();checkIdle();openSession()}
const newCall=()=>({step:'start',name:'',note:'',quando:'',lid:null});
function checkIdle(){ // stop automatico: il tempo inattivo non viene contato
  if(!SS||!SS.runFrom||SS.phase!=='work')return false;
  if(Date.now()-SS.lastAct<IDLE_MS)return false;
  SS.acc+=Math.max(0,SS.lastAct-SS.runFrom);SS.runFrom=null;SS.autoStop=SS.lastAct;saveDraft();return true;
}
let actSave=0;
function activity(){if(!SS)return;SS.lastAct=Date.now();if(Date.now()-actSave>20000){actSave=Date.now();saveDraft()}}
['pointerdown','keydown','input','wheel','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(SS)activity()},{capture:true,passive:true}));
function openSession(){
  let el=$('.sess');if(!el){el=document.createElement('div');el.className='sess';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.style.overflow='hidden';
  renderSession();
  clearInterval(tick);tick=setInterval(()=>{if(checkIdle()){renderSession();return}const t=$('#timer');if(t)t.textContent=dur(elapsed())},1000);
}
function closeSession(){clearInterval(tick);const el=$('.sess');if(el)el.remove();document.body.style.overflow='';SS=null;renderView()}
function leadCounts(items){const c={contattati:0,risposti:0,interessati:0,validi:0,ricerche:0,post:0,daValidare:0,neg:0};
  items.forEach(i=>{c.contattati++;if(i.risposto)c.risposti++;if(i.interessato)c.interessati++;if(i.esito==='valido')c.validi++;if(i.esito==='posticipato')c.post++;if(i.esito==='da_validare')c.daValidare++;
    if(negSysOf(i))c.neg++;if(i.ricerca==='confermata')c.ricerche++});return c}
const ESITO={valido:'Valido',non_valido:'Non valido',remarketing:'Remarketing',posticipato:'Posticipato',da_validare:'Da validare'};
function callTrail(c){const t=[];
  if(c.risposto===false)t.push(['Non risposto','ko']);
  if(c.risposto)t.push(['Risposto','ok']);
  if(c.interessato===true)t.push(['Interessato','ok']);if(c.interessato===false)t.push(['Non interessato','ko']);
  if(c.esito)t.push([ESITO[c.esito],c.esito==='valido'?'ok':c.esito==='non_valido'?'ko':'on']);
  if(c.permuta==='nessuna')t.push(['Nessuna permuta','']);if(c.permuta==='valida')t.push(['Permuta valida','ok']);if(c.permuta==='non_valida')t.push(['Permuta non valida','ko']);if(c.permuta==='da_valutare')t.push(['Permuta da valutare','on']);
  if(c.ricerca==='confermata')t.push(['Ricerca confermata','ok']);if(c.ricerca==='risentire')t.push(['No ricerca, da risentire','on']);
  return t}
const chips=t=>'<div class="trail">'+t.map(([x,k])=>'<span class="chip '+k+'">'+esc(x)+'</span>').join('')+'</div>';
function crmText(c,n,date){const t=callTrail(c).map(x=>x[0]).join(' · ');
  return 'Lead: '+(c.name||'Chiamata '+n)+'\nData: '+dmy(date||(SS?SS.date:today()))+(c.t?' '+hhmm(c.t):'')+'\nEsito: '+t+(c.reason?'\nMotivo: '+c.reason+(c.rnote?' ('+c.rnote+')':''):'')+(c.quando?'\nRichiamare: '+c.quando:'')+(c.note?'\nNote: '+c.note:'')}

function liveStage(key,upto){
  const c=engine().cards['lead|'+key];let st=c?c.stage:null;
  if(SS)SS.items.forEach((it,i)=>{if(upto!=null&&i>=upto)return;if(leadKey(it)===key){const to=callTarget(it,st);if(to)st=to}});
  return st;
}

function matchHTML(c){

const callItem=c=>({name:tidy(c.name),lid:c.lid||null,risposto:c.risposto,interessato:c.interessato??null,esito:c.esito||null,quando:(c.quando||'').trim(),permuta:c.permuta||null,ricerca:c.ricerca||null,reason:c.reason||'',rnote:c.rnote||'',note:(c.note||'').trim(),t:c.t||Date.now()});
function askReason(c,sys,then){const st=sysStage('lead',sys);if(!st){then();return}
  reasonSheet('lead',st,c.name,null,(reason,rnote)=>{c.reason=reason;c.rnote=rnote;then();saveDraft();renderSession()})}
function act(a){
  const c=SS.cur;
  const finishCall=()=>{c.t=c.t||Date.now();const item=callItem(c);if(c.idx!=null)SS.items[c.idx]=item;else{SS.items.push(item);c.idx=SS.items.length-1}};
  const nt=$('#c-note');if(nt)c.note=nt.value;
  const nm=$('#c-name');if(nm)c.name=nm.value;
  if((a==='risposto'||a==='nonrisposto')&&!tidy(c.name)){toast('Scrivi il nome del lead: serve per riconoscerlo quando lo richiami.');nm&&nm.focus();return}
  switch(a){
    case 'risposto':c.name=tidy(c.name);c.risposto=true;c.t=Date.now();c.step='answered';break;
    case 'nonrisposto':{c.name=tidy(c.name);c.risposto=false;c.t=Date.now();finishCall();const k=leadKey(SS.items[c.idx]),st=stageOf('lead',liveStage(k));SS.cur=newCall();
      toast('Non risposto: '+c.name+(st?' → '+st.name:'')+'.',()=>{SS.items.pop();saveDraft();renderSession()});break}
    case 'newlead':c.lid='u:'+uid('');break;
    case 'unlink':c.lid=null;break;
    case 'int':c.interessato=true;c.askWhen=false;c.step='interested';break;
    case 'noint':askReason(c,'nonint',()=>{c.interessato=false;c.askWhen=false;c.step='done';finishCall()});return;
    case 'valido':c.esito='valido';c.askWhen=false;c.step='perm';break;
    case 'permno':c.permuta='nessuna';c.step='valid';break;
    case 'permok':c.permuta='valida';c.step='valid';break;
    case 'permval':c.permuta='da_valutare';c.step='valid';break;
    case 'permko':askReason(c,'permko',()=>{c.permuta='non_valida';c.step='done';finishCall()});return;
    case 'nonvalido':askReason(c,'nonval',()=>{c.esito='non_valido';c.askWhen=false;c.step='done';finishCall()});return;
    case 'davalid':c.esito='da_validare';c.askWhen=false;c.step='done';finishCall();break;
    case 'post':c.askWhen=true;break;
    case 'postok':{const w=$('#c-when');c.quando=(w?w.value:c.quando||'').trim();if(!c.quando){toast('Scrivi quando va ricontattato.');w&&w.focus();return}c.esito='posticipato';c.askWhen=false;c.step='done';finishCall();break}
    case 'ric':c.ricerca='confermata';c.step='done';finishCall();break;
    case 'noric':c.ricerca='risentire';c.step='done';finishCall();break;
    case 'copy':copy(crmText(SS.items[c.idx],c.idx+1));return;
    case 'editcur':editSessionItem(c.idx);return;
    case 'next':SS.cur=newCall();break;
    case 'end':SS.cur=newCall();endSession();return;
    case 'back':
      if(c.step==='answered'){if(c.askWhen){c.askWhen=false}else{c.step='start';delete c.risposto}}
      else if(c.step==='interested'){if(c.askWhen){c.askWhen=false}else{c.step='answered';delete c.interessato}}
      else if(c.step==='perm'){c.step='interested';delete c.esito}
      else if(c.step==='valid'){c.step='perm';delete c.permuta}
      break;
  }
  saveDraft();renderSession();
  const f=$('.sess #c-name');if(f&&(a==='next'||a==='nonrisposto'))f.focus();
}
function endSession(){
  const c=SS.cur;
  if(c.step!=='start'&&c.step!=='done'&&c.idx==null)SS.items.push(callItem(c)); // chiamata lasciata a metà: la registro con gli esiti scelti
  SS.cur=newCall();
  SS.wasRunning=!!SS.runFrom; if(SS.runFrom){SS.acc+=Date.now()-SS.runFrom;SS.runFrom=null}
  SS.endedAt=SS.autoStop||Date.now();
  SS.phase='summary';saveDraft();renderSession();$('.sess').scrollTo(0,0);
}

  s.items.forEach(it=>{const k=leadKey(it);if(!k)return;if(saved.has(k)||seen.has(k))n++;seen.add(k)});return n}

}
async function saveSession(){
  const s=SS;
  if(!s.items.length){lsSet(DRAFT,null);closeSession();toast('Sessione vuota: niente da salvare.');return}
  const id=uid('x'), doc={type:'lead',date:s.date,startedAt:s.startedAt,endedAt:Math.max(s.endedAt||Date.now(),s.startedAt+s.acc),durationMs:s.acc,items:s.items};
  lsSet(DRAFT,null);closeSession();
  if(ymOf(s.date)!==ym)ym=ymOf(s.date);
  await put('sessions',id,doc);
  goTo('lead','pipe');
  toast('Sessione salvata: pipeline e dashboard aggiornate.');
}
async function deleteSession(id){
  const s=S.sessions[id];if(!s)return;
  await ensureV2(s.date);
  await del('sessions',id);toast('Sessione eliminata.');
}
async function updateSession(id,items){
  const s=S.sessions[id];if(!s)return;
  if(!items.length){await deleteSession(id);return}
  await put('sessions',id,{...s,items});
}
function viewSession(id){
  const s=S.sessions[id];if(!s)return;
  sheet('<div class="sheet-h"><h2>Chiamate lead <span>'+dmy(s.date)+'</span></h2><button class="x" data-close aria-label="Chiudi">×</button></div>'+sessionSummary(s,false)
    +'<div class="row-end"><button class="btn ghost" id="vs-copy">Copia tutte le note</button></div>',
    ov=>{const b=ov.querySelector('#vs-copy');if(b)b.onclick=()=>copy(s.items.map((c,i)=>({c,i})).filter(x=>x.c.risposto).map(x=>crmText(x.c,x.i+1,s.date)).join('\n\n'))});
}
function copy(text){
  const done=()=>toast('Copiato: incollalo nel CRM.');
  const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();ok?done():toast('Copia non riuscita: seleziona il testo a mano.')};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}

/* ---------- avvio ---------- */
if(lsGet(DRAFT)&&lsGet(DRAFT).type!=='lead')lsSet(DRAFT,null);
renderView();setStatus();initStore();
})();

</script>
