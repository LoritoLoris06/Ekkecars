<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>EKKECARS Import Calc</title>
<meta name="description" content="Calcolatore costo importazione veicoli DE/IT verso Svizzera con margine">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f4f3f1; --surface:#ffffff; --surface-2:#faf8f5; --surface-3:#f0ede8;
    --border:#e7e2da; --border-strong:#d6cfc4;
    --ink:#1c1a17; --ink-2:#544e46; --ink-3:#8b8377;
    --accent:#ed7133; --accent-2:#d75f22; --accent-ink:#ffffff; --accent-ghost:rgba(237,113,51,.10); --accent-soft:rgba(237,113,51,.16);
    --good:#2c8a5b; --good-ghost:rgba(44,138,91,.12);
    --bad:#cf4436; --bad-ghost:rgba(207,68,54,.12);
    --shadow-sm:0 1px 2px rgba(28,26,23,.05);
    --shadow:0 1px 2px rgba(28,26,23,.06), 0 12px 30px -14px rgba(28,26,23,.20);
    --radius:16px; --radius-sm:10px;
    --font-display:"Poppins","Segoe UI",system-ui,sans-serif;
    --font-ui:"Manrope","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#14110e; --surface:#1d1915; --surface-2:#241f1a; --surface-3:#2e2823;
      --border:#352e28; --border-strong:#493f37;
      --ink:#f3efe9; --ink-2:#c5bcb0; --ink-3:#8f867a;
      --accent:#f2854a; --accent-2:#ed7133; --accent-ink:#241206; --accent-ghost:rgba(242,133,74,.14); --accent-soft:rgba(242,133,74,.22);
      --good:#4bbd85; --good-ghost:rgba(75,189,133,.16);
      --bad:#e5766c; --bad-ghost:rgba(229,118,108,.16);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#14110e; --surface:#1d1915; --surface-2:#241f1a; --surface-3:#2e2823;
    --border:#352e28; --border-strong:#493f37;
    --ink:#f3efe9; --ink-2:#c5bcb0; --ink-3:#8f867a;
    --accent:#f2854a; --accent-2:#ed7133; --accent-ink:#241206; --accent-ghost:rgba(242,133,74,.14); --accent-soft:rgba(242,133,74,.22);
    --good:#4bbd85; --good-ghost:rgba(75,189,133,.16);
    --bad:#e5766c; --bad-ghost:rgba(229,118,108,.16);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 16px 36px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
  ::selection{background:var(--accent-soft)}
  a{color:var(--accent)}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
    padding:14px 22px;background:color-mix(in srgb,var(--surface) 90%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);
    font-weight:800;font-size:20px;letter-spacing:-.02em}
  .brand .mark{width:34px;height:34px;flex:none}
  .brand .cars{color:var(--accent)}
  .topbar .spacer{flex:1}
  .rate-chip{display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--ink-2)}
  .rate-chip b{color:var(--ink);font-variant-numeric:tabular-nums}
  .rate-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
  .icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2)}
  .icon-btn:hover{color:var(--accent);border-color:var(--border-strong)}

  .wrap{max-width:1160px;margin:0 auto;padding:28px 22px 90px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:12px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
    font-weight:700;font-size:14.5px;transition:.14s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink)}
  .btn-danger{color:var(--ink-2)}
  .btn-danger:hover{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn svg{width:17px;height:17px}

  /* ---------- dashboard ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .page-head p{margin:6px 0 0;color:var(--ink-3);font-size:14px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:17px 19px;box-shadow:var(--shadow-sm)}
  .stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
  .stat .v{font-family:var(--font-display);font-weight:700;font-size:25px;margin-top:9px;font-variant-numeric:tabular-nums}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .panel-head h2{font-size:16px;font-weight:700}
  .panel-head .count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .grid-2{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}

  /* table */
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-3);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  td.cli{font-weight:700;white-space:nowrap}
  td.auto{color:var(--ink-2);white-space:nowrap}
  td.money{font-variant-numeric:tabular-nums;white-space:nowrap}
  .flag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.03em;
    padding:3px 8px;border-radius:6px;margin-right:9px;background:var(--surface-3);color:var(--ink-2)}
  .mtag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mtag.pos{background:var(--good-ghost);color:var(--good)}
  .mtag.neg{background:var(--bad-ghost);color:var(--bad)}
  .mtag.na{background:var(--surface-3);color:var(--ink-3)}
  .rowdel{opacity:0;border:none;background:transparent;color:var(--ink-3);padding:5px;border-radius:7px;display:grid;place-items:center}
  tr:hover .rowdel{opacity:1}
  .rowdel:hover{color:var(--bad);background:var(--bad-ghost)}

  .clientlist{padding:8px}
  .clientrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer}
  .clientrow:hover{background:var(--surface-2)}
  .avatar{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    background:var(--accent-ghost);color:var(--accent);font-weight:800;font-size:13px;font-family:var(--font-display)}
  .clientrow .nm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clientrow .cc{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .empty{padding:46px 20px;text-align:center;color:var(--ink-3)}
  .empty svg{width:40px;height:40px;opacity:.5;margin-bottom:10px}

  /* ---------- calculator ---------- */
  .calc-wrap{max-width:960px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:700;font-size:14px;background:none;border:none;padding:6px 0;margin-bottom:14px}
  .back:hover{color:var(--accent)}
  .stack{display:flex;flex-direction:column;gap:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .card.of{overflow:visible}
  .card.locked{opacity:.45;pointer-events:none;filter:saturate(.4)}
  .card-h{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--border)}
  .step{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    font-family:var(--font-display);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
  .card-h h3{font-size:16px;font-weight:700}
  .card-h .sub{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .card-b{padding:18px 20px}

  label.fl{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
  .field+.field{margin-top:16px}
  .two{align-items:start}
  .two .field+.field{margin-top:0}
  .inp{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border-strong);
    background:var(--surface-2);color:var(--ink);font-size:15px;transition:.14s;font-weight:600}
  .inp:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-ghost)}
  .inp::placeholder{color:var(--ink-3);font-weight:500}
  .inp.money{font-variant-numeric:tabular-nums;text-align:right}
  .inp-affix{position:relative}
  .inp-affix .cur{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:700;font-size:13px;pointer-events:none}
  .inp-affix .inp{padding-left:42px;text-align:right}
  .inp-affix.chf .inp{padding-left:50px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* client search */
  .cs-wrap{position:relative}
  .cs-panel{position:absolute;left:0;right:0;bottom:calc(100% + 8px);top:auto;z-index:80;background:var(--surface);
    border:1px solid var(--border-strong);border-radius:13px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:6px;display:none}
  .cs-panel.open{display:block}
  .cs-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border:none;background:none;border-radius:9px;color:var(--ink);font-size:14px;font-weight:600}
  .cs-opt:hover{background:var(--surface-2)}
  .cs-opt.create{color:var(--accent);font-weight:700}
  .cs-opt .avatar{width:28px;height:28px;font-size:12px}
  .selected-client{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-ghost);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .selected-client .avatar{background:var(--accent);color:var(--accent-ink)}
  .selected-client .nm{font-weight:800;flex:1}
  .selected-client .chg{font-size:12.5px;color:var(--accent);background:none;border:none;font-weight:700}

  /* country toggle */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg button{padding:14px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface-2);
    color:var(--ink-2);font-weight:700;display:flex;flex-direction:column;gap:3px;align-items:flex-start;transition:.14s}
  .seg button .ssub{font-size:11.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .seg button.on{border-color:var(--accent);background:var(--accent-ghost);color:var(--ink)}
  .seg button.on .ssub{color:var(--accent)}

  .rate-view{margin-top:16px;padding:13px 15px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
  .rv-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rv-k{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .rv-vals{display:flex;align-items:center;gap:9px}
  .rv-raw{color:var(--ink-3);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .rv-vals svg{color:var(--ink-3)}
  .rv-app{color:var(--accent);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .rv-note{margin-top:8px;font-size:11.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
  .rv-note svg{width:12px;height:12px;flex:none}

  /* receipt */
  .success-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--good);background:var(--good-ghost);padding:5px 12px;border-radius:999px;margin-bottom:14px}
  .success-badge svg{width:14px;height:14px}
  .rline{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;padding:8px 0;font-size:14px}
  .rline .lab{color:var(--ink-2);font-weight:600}
  .rline .lab .op{display:inline-block;width:14px;color:var(--ink-3);font-weight:700}
  .rline .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
  .rline.add .val{color:var(--good)}
  .rline.muted{font-size:12.5px;padding:3px 0 3px 14px}
  .rline.muted .lab,.rline.muted .val{color:var(--ink-3);font-weight:500}
  .rline.sub{border-top:1px solid var(--border);margin-top:6px;padding-top:12px}
  .rline.sub .lab{font-weight:800;color:var(--ink);font-family:var(--font-display)}
  .rline.sub .val{font-weight:800}

  /* imprevisti */
  .imp-row{display:grid;grid-template-columns:22px 1fr 118px;gap:12px;align-items:center;padding:9px 0}
  .imp-row+.imp-row{border-top:1px solid var(--border)}
  .chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;transition:.12s;padding:0}
  .chk svg{width:13px;height:13px;opacity:0;color:var(--accent-ink)}
  .imp-row.on .chk{background:var(--accent);border-color:var(--accent)}
  .imp-row.on .chk svg{opacity:1}
  .imp-row .inm{font-size:14px;font-weight:600;user-select:none}
  .imp-row .imp-amt input{padding:8px 11px;font-size:13.5px}
  .imp-row:not(.on) .imp-amt{opacity:.4}

  /* costi aggiuntivi */
  .costgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
  @media(max-width:640px){.costgrid{grid-template-columns:1fr}}
  .cost-row{display:grid;grid-template-columns:1fr 132px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
  .cost-row .clab{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .cost-row .tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
  .cost-row .tag.fisso{background:var(--surface-3);color:var(--ink-3)}
  .cost-row .tag.auto{background:var(--accent-ghost);color:var(--accent)}
  .cost-row .cval{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
  .cost-row .inp{padding:8px 11px;font-size:13.5px}
  .costsub{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;margin-top:14px;padding-top:14px;border-top:2px solid var(--border-strong)}
  .costsub .lab{font-family:var(--font-display);font-weight:800;font-size:15px}
  .costsub .val{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}

  /* totale + margine */
  .final-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media(max-width:760px){.final-grid{grid-template-columns:1fr}}
  .final-left{padding:20px 22px;border-right:1px solid var(--border)}
  @media(max-width:760px){.final-left{border-right:none;border-bottom:1px solid var(--border)}}
  .final-right{padding:20px 22px;background:var(--surface-2)}
  .grand{margin-top:12px;padding-top:14px;border-top:2px solid var(--ink)}
  .grand .lab{font-family:var(--font-display);font-weight:800;font-size:16px}
  .grand .val{font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;margin-top:2px}
  .final-right h4{font-family:var(--font-display);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin:0 0 12px}
  .mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:7px 0;font-size:14px}
  .mrow .lab{color:var(--ink-2);font-weight:600}
  .mrow .val{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .margin-final{margin-top:14px;padding:15px 17px;border-radius:13px;background:var(--surface);border:1px solid var(--border)}
  .margin-final .mlab{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
  .margin-final .mval{font-family:var(--font-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
  .margin-final .mpct{font-weight:700;font-size:13.5px;margin-top:2px;font-variant-numeric:tabular-nums}
  .margin-final.pos{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-ghost)}
  .margin-final.pos .mval,.margin-final.pos .mpct{color:var(--good)}
  .margin-final.neg{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-ghost)}
  .margin-final.neg .mval,.margin-final.neg .mpct{color:var(--bad)}

  .save-bar{display:flex;justify-content:flex-end;gap:12px}
  .placeholder{color:var(--ink-3);font-size:14px;padding:10px 0}

  /* client detail */
  .cd-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .cd-head .avatar{width:54px;height:54px;font-size:21px;border-radius:14px}
  .cd-head h1{font-size:27px;font-weight:800;letter-spacing:-.02em}
  .cd-head .csub{color:var(--ink-3);font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
  .deal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
  .deal-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .deal-h .title{font-family:var(--font-display);font-weight:700;font-size:15.5px}
  .deal-h .date{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .deal-h .sp{flex:1}
  .deal-b{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
  .deal-cell{background:var(--surface);padding:14px 16px}
  .deal-cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
  .deal-cell .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;margin-top:6px;white-space:nowrap}
  .chips-block{padding:14px 18px;border-top:1px solid var(--border)}
  .chips-block .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px}
  .chip b{font-variant-numeric:tabular-nums;font-weight:700}
  .chip .lbl{color:var(--ink-2);font-weight:600}

  /* liste */
  .dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface-2);padding:44px 24px;text-align:center;transition:.16s;cursor:pointer}

  .stp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px}
  .stp .n{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);font-weight:800;font-size:12px;display:grid;place-items:center;margin-bottom:10px;font-family:var(--font-display)}
  .stp .t{font-weight:700;font-size:14px}

  .colchips{display:flex;flex-wrap:wrap;gap:8px}
  .colchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid var(--border-strong);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none;transition:.12s}
  .colchip input{display:none}
  .colchip.on{border-color:var(--accent);background:var(--accent-ghost);color:var(--ink)}
  .colchip:hover{border-color:var(--accent)}
  .info-box{background:var(--accent-ghost);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:var(--radius-sm);padding:15px 17px;font-size:13.5px;color:var(--ink-2);margin-top:20px;line-height:1.5}

  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}.deal-b{grid-template-columns:1fr 1fr}}

<script>
"use strict";

/* ============ CONFIG ============ */
var DEFAULT_RAW_RATE = 0.9394;
var RATE_DATE = "01/09/2026";
var IVA = { DE: 1.19, IT: 1.22 };
var DUTY = 1.04, CH_VAT = 1.081, RISK = 500, CH_VAT_PCT = 0.081;

var IMPREVISTI = [
  {key:"riparazioni", label:"Riparazioni"},
  {key:"coc", label:"COC"},
  {key:"co2", label:"Tassa CO2"},
  {key:"altro", label:"Altro"}
];

/* additional costs, always applied, per category. type: edit | fixed | calc */
var COSTI_DEF = {
  b2c: {
    fissi:{burocratiche:300,collaudo:350,immatricolazione:100,carburante:100,vignetta:40,preparazione:150},
    interesse:true,
    rows:[
      {key:"trasportoKK",     label:"Trasporto a KK",        type:"edit"},
      {key:"burocratiche",    label:"Spese burocratiche",    type:"fixed"},
      {key:"collaudo",        label:"Spese collaudo",        type:"fixed"},
      {key:"immatricolazione",label:"Immatricolazione",      type:"fixed"},
      {key:"carburante",      label:"Carburante",            type:"fixed"},
      {key:"vignetta",        label:"Vignetta",              type:"fixed"},
      {key:"interesse",       label:"Interesse finanziatore",type:"calc"},
      {key:"preparazione",    label:"Preparazione",          type:"fixed"},
      {key:"garanzia",        label:"Garanzia",              type:"edit"},
      {key:"pneumatici",      label:"Pneumatici",            type:"edit"},
      {key:"permuta",         label:"Permuta",               type:"edit"},
      {key:"varie",           label:"Varie",                 type:"edit"},
      {key:"trasportoCliente",label:"Trasporto al cliente",  type:"edit"}
    ],
    edit:["trasportoKK","garanzia","pneumatici","permuta","varie","trasportoCliente"]
  },
  b2b: {
    fissi:{burocratiche:300,collaudo:350,immatricolazione:100,preparazione:100},
    interesse:false,
    rows:[
      {key:"trasportoKK",     label:"Trasporto a KK",        type:"edit"},
      {key:"burocratiche",    label:"Spese burocratiche",    type:"fixed"},
      {key:"collaudo",        label:"Spese collaudo",        type:"fixed"},
      {key:"immatricolazione",label:"Immatricolazione",      type:"fixed"},
      {key:"preparazione",    label:"Preparazione",          type:"fixed"},
      {key:"pneumatici",      label:"Pneumatici",            type:"edit"},
      {key:"varie",           label:"Varie",                 type:"edit"},
      {key:"trasportoCliente",label:"Trasporto al cliente",  type:"edit"}
    ],
    edit:["trasportoKK","pneumatici","varie","trasportoCliente"]
  }
};
function getDef(mode){ return COSTI_DEF[mode]||COSTI_DEF.b2c; }
function calcMode(c){ return c.mode||"b2c"; }
var MODE_LABEL = { b2c:"B2C — Clienti privati", b2b:"B2B — Rivenditori" };

/* ============ HELPERS ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function ls_get(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function ls_set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var nf = new Intl.NumberFormat("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtCHF(n){ if(n==null||isNaN(n)) return "–"; return "CHF " + nf.format(n); }
function fmtEUR(n){ if(n==null||isNaN(n)) return "–"; return "€ " + nf.format(n); }
function fmtPct(n){ if(n==null||isNaN(n)) return "–"; return (n>=0?"+":"") + n.toFixed(1).replace(".",",") + " %"; }
function parseNum(s){
  if(s==null) return NaN;
  s = String(s).replace(/['\s ]/g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
  if(s==="") return NaN;
  return parseFloat(s);
}
function num2str(n){ return (n==null||isNaN(n))?"":String(n).replace(".",","); }
var BANK_MARGIN = 0.005;   // margine banca (unico margine, nessun arrotondamento)
function appliedRate(raw){
  return Math.round((raw + BANK_MARGIN)*100000)/100000;
}

/* ============ CORE COMPUTE ============ */
function compute(d){
  var iva = IVA[d.country] || IVA.DE;
  var raw = (d.rawRate>0)? d.rawRate : DEFAULT_RAW_RATE;
  var app = appliedRate(raw);
  var gross = (d.gross>0)? d.gross : 0;
  var netto = gross / iva;
  var nettoCH = netto * app;
  var nettoDazio = nettoCH * DUTY;
  var lordoCH = nettoDazio * CH_VAT;
  var costoAuto = lordoCH + RISK;
  var dazioAmt = nettoDazio - nettoCH;
  var vatAmt = lordoCH - nettoDazio;

  var impTot = 0;
  (d.imprevisti||[]).forEach(function(i){ if(i.on && i.amount>0) impTot += i.amount; });

  var def = getDef(d.mode);
  var extra = d.extra||{};
  var editTot = 0; def.edit.forEach(function(k){ var v=parseFloat(extra[k]); if(v>0) editTot+=v; });
  var fixedTot = 0; for(var k in def.fissi) fixedTot += def.fissi[k];
  // Interesse finanziatore = (prezzo lordo EUR + IVA CH + Dazio CH) / 100 (solo B2C)
  var interesse = (def.interesse && gross>0)? (gross + vatAmt + dazioAmt) / 100 : 0;
  var costiAgg = fixedTot + editTot + interesse;

  var costoTotale = costoAuto + impTot + costiAgg;

  var sale = (d.sale>0)? d.sale : 0;
  var margineLordo = sale>0 ? (sale - costoTotale) : null;
  var ivaMargine = (margineLordo!=null) ? (margineLordo * CH_VAT_PCT / CH_VAT) : null;
  var margineNetto = (margineLordo!=null) ? (margineLordo - ivaMargine) : null;
  var marginePct = (sale>0) ? (margineNetto/sale*100) : null;

  return {
    iva:iva, raw:raw, app:app, gross:gross,
    netto:netto, nettoCH:nettoCH, dazioAmt:dazioAmt, nettoDazio:nettoDazio,
    vatAmt:vatAmt, lordoCH:lordoCH, risk:RISK, costoAuto:costoAuto,
    impTot:impTot, interesse:interesse, fixedTot:fixedTot, editTot:editTot, costiAgg:costiAgg,
    costoTotale:costoTotale,
    sale:sale, margineLordo:margineLordo, ivaMargine:ivaMargine, margineNetto:margineNetto, marginePct:marginePct
  };
}
function costAmount(row, r, extra, mode){
  if(row.type==="fixed") return getDef(mode).fissi[row.key];
  if(row.type==="calc") return r.interesse;
  var v=parseFloat((extra||{})[row.key]); return v>0?v:0;
}

/* ============ STORE (db + localStorage fallback) ============ */
var store = {
  db:null, useDb:false, ready:false, clients:[], calcs:[], subs:[],
  onChange:function(fn){ this.subs.push(fn); },
  emit:function(){ for(var i=0;i<this.subs.length;i++) this.subs[i](); },
  loadLocal:function(){
    try{ this.clients=JSON.parse(ls_get("ekke_clients","[]")); }catch(e){ this.clients=[]; }
    try{ this.calcs=JSON.parse(ls_get("ekke_calcs","[]")); }catch(e){ this.calcs=[]; }
  },
  mirror:function(){ ls_set("ekke_clients",JSON.stringify(this.clients)); ls_set("ekke_calcs",JSON.stringify(this.calcs)); },
  init:function(){
    var self=this;
    self.loadLocal();
    self.ready=true;                 // local-first: never block the UI on the shared DB
    var localClients=self.clients.slice(), localCalcs=self.calcs.slice(), migrated=false;
    var p=(window.claude&&window.claude.use)? window.claude.use("db") : Promise.resolve(null);
    p.then(function(db){
      if(!db) return;                // no shared DB on this view → stay local-only, still fully working
      self.db=db; self.useDb=true;
      db.collection("clients").onSnapshot(function(s){
        self.clients=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
        if(!migrated && s.empty && !(s.metadata&&s.metadata.fromCache) && localClients.length){ migrated=true;
          localClients.forEach(function(c){var b=Object.assign({},c);delete b.id;db.collection("clients").doc(c.id).set(b).catch(function(){});});
          localCalcs.forEach(function(c){var b=Object.assign({},c);delete b.id;db.collection("calculations").doc(c.id).set(b).catch(function(){});});
        }
        self.mirror(); self.emit();
      }, function(){});
      db.collection("calculations").onSnapshot(function(s){
        self.calcs=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
        self.mirror(); self.emit();
      }, function(){});
      db.doc("config/rate").onSnapshot(function(s){
        if(s.exists){ var d=s.data()||{}; if(d.raw>0){ state.rate={raw:d.raw, date:d.date||"", updatedAt:d.updatedAt||null}; onRateChange(); } }
      }, function(){});
      db.doc("config/liste").onSnapshot(function(s){
        if(!s.exists) return; var d=s.data()||{}, ch=false;
        ["margin","transport"].forEach(function(k){ if(typeof d[k]==="number"&&isFinite(d[k])&&d[k]>=0&&d[k]!==listeCfg[k]){ listeCfg[k]=d[k]; ch=true; } });
        if(!ch) return; ls_set("ekke_liste_cfg",JSON.stringify(listeCfg));
        if(state.view.name==="liste"){ var ae=document.activeElement&&document.activeElement.id; if(listeState.step==="upload"||(listeState.step==="map"&&!/^p(Margin|Transport)$/.test(ae||""))) renderListe(); }
      }, function(){});
    }).catch(function(){});
    return Promise.resolve();
  },
  addClient:function(name){
    var self=this,id=uid(),obj={id:id,name:(name||"").trim(),createdAt:Date.now()};
    self.clients.push(obj); self.mirror(); self.emit();
    if(self.useDb) self.db.collection("clients").doc(id).set({name:obj.name,createdAt:obj.createdAt}).catch(function(){});
    return Promise.resolve(obj);
  },
  saveCalc:function(calc){
    var self=this; if(!calc.id) calc.id=uid();
    var i=-1; for(var k=0;k<self.calcs.length;k++) if(self.calcs[k].id===calc.id){i=k;break;}
    if(i>=0) self.calcs[i]=calc; else self.calcs.push(calc);
    self.mirror(); self.emit();
    if(self.useDb){ var b=Object.assign({},calc); delete b.id; self.db.collection("calculations").doc(calc.id).set(b).catch(function(){}); }
    return Promise.resolve(calc);
  },
  deleteCalc:function(id){
    var self=this;
    self.calcs=self.calcs.filter(function(c){return c.id!==id;}); self.mirror(); self.emit();
    if(self.useDb) self.db.collection("calculations").doc(id).delete().catch(function(){});
    return Promise.resolve();
  },
  deleteClient:function(id){
    var self=this, theirs=self.calcs.filter(function(c){return c.clientId===id;});
    self.clients=self.clients.filter(function(c){return c.id!==id;});
    self.calcs=self.calcs.filter(function(c){return c.clientId!==id;});
    self.mirror(); self.emit();
    if(self.useDb){ self.db.collection("clients").doc(id).delete().catch(function(){});
      theirs.forEach(function(c){self.db.collection("calculations").doc(c.id).delete().catch(function(){});}); }
    return Promise.resolve();
  },
  clientById:function(id){ for(var i=0;i<this.clients.length;i++) if(this.clients[i].id===id) return this.clients[i]; return null; },
  calcsForClient:function(id){ return this.calcs.filter(function(c){return c.clientId===id;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);}); }
};

/* ============ APP ============ */
var state={view:{name:"home"}, mode:"b2c", rate:{raw:DEFAULT_RAW_RATE, date:RATE_DATE, updatedAt:null}}, draft=null, app=document.getElementById("app");

function confirmDialog(msg, onOk, label){
  var m=document.getElementById("modal");
  document.getElementById("modalMsg").textContent=msg;
  m.hidden=false;
  var ok=document.getElementById("modalOk"), cancel=document.getElementById("modalCancel");
  ok.textContent=label||"Elimina"; ok.className=label?"btn btn-primary":"btn btn-del";
  function close(){ m.hidden=true; ok.onclick=null; cancel.onclick=null; m.onclick=null; }
  ok.onclick=function(){ close(); onOk(); };
  cancel.onclick=function(){ close(); };
  m.onclick=function(e){ if(e.target===m) close(); };
}

function toast(msg){
  var t=document.getElementById("toast");
  t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg);
  t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2200);
}
function initials(name){ var p=(name||"").trim().split(/\s+/); return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function findCalc(id){ for(var i=0;i<store.calcs.length;i++) if(store.calcs[i].id===id) return store.calcs[i]; return null; }
function fmtDate(ts){ if(!ts) return ""; var d=new Date(ts); return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }

function go(v){ state.view=v; renderMain(); }
function renderMain(){
  if(!store.ready){ app.innerHTML='<div class="loading"><div class="spin"></div><div>Carico i tuoi dati…</div></div>'; return; }
  var v=state.view;
  if(v.name==="home") renderHome();
  else if(v.name==="liste") renderListe();
  else if(v.name==="calc") buildCalc();
  else if(v.name==="client") renderClient(v.id);
  else renderDashboard();
  updateRateChip();
}
store.onChange(function(){
  if(!store.ready) return;
  var n=state.view.name;
  if(n==="dashboard") renderDashboard();
  else if(n==="client") renderClient(state.view.id);
  else if(n==="calc") calcRefreshClients();
  else if(n==="home") renderHome();
  updateRateChip();
});

/* ============ HOME (categorie) ============ */
function renderHome(){
  var b2c=store.calcs.filter(function(c){return calcMode(c)==="b2c";}).length;
  var b2b=store.calcs.filter(function(c){return calcMode(c)==="b2b";}).length;
  app.innerHTML='<div class="wrap">'+
    '<div class="page-head"><div><h1>EKKECARS</h1><p>Scegli come vuoi lavorare</p></div></div>'+
    '<div class="cats">'+
      cat("b2c","B2C","Clienti privati","Calcolo completo di importazione con imprevisti, costi aggiuntivi e margine.",b2c+" calcoli",
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>')+
      cat("b2b","B2B","Rivenditori","Stesso calcolo, costi ridotti: senza carburante, vignetta, interesse, garanzia e permuta.",b2b+" calcoli",
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/><path d="M9 9v0M9 12v0M9 15v0"/></svg>')+

var EN_HEAD={ "marca":"Brand","make":"Brand","brand":"Brand","modello":"Model","model":"Model","model line":"Trim","allestimento":"Trim","version":"Trim","versione":"Trim","anno":"Year","year":"Year","1. reg":"First reg.","1.reg":"First reg.","first reg":"First reg.","prima immatricolazione":"First reg.","immatricolazione":"First reg.","km":"Mileage (km)","chilometri":"Mileage (km)","mileage":"Mileage (km)","carburante":"Fuel","alimentazione":"Fuel","fuel":"Fuel","kw":"Power (kW)","potenza":"Power (kW)","power":"Power (kW)","cv":"Power (hp)","hp":"Power (hp)","cambio":"Gearbox","gearbox":"Gearbox","trasmissione":"Gearbox","carrozzeria":"Body","body":"Body","colore":"Colour","color":"Colour","colour":"Colour","drive":"Drivetrain","trazione":"Drivetrain","engine":"Engine","motore":"Engine","location":"Location","metallic":"Metallic" };
function enHead(h){ var k=String(h==null?"":h).trim().toLowerCase(); return EN_HEAD[k]||String(h==null?"":h).trim(); }
function isDefaultCol(h){ return /^(make|brand|marca|model|modello|model\s*line|trim|version|versione|allestimento|year|anno|1\.?\s*reg|km|mileage|chilometri|fuel|carburante|alimentazione|kw|power|potenza|gearbox|cambio)$/i.test(String(h==null?"":h).trim()); }
function guessPriceCol(headers){
  var special=-1,car=-1,generic=-1;
  headers.forEach(function(h,i){ var s=String(h==null?"":h).toLowerCase();
    if(special<0 && /(special.*price|prezzo.*offert|net.*price|prezzo.*netto|offer.*price)/.test(s)) special=i;
    else if(car<0 && /(car price|prezzo|price|listino)/.test(s)) car=i;
    else if(generic<0 && /(eur|€|netto|lordo)/.test(s)) generic=i;
  });
  return special>=0?special:(car>=0?car:generic);
}
function detectVat(headers, rows){
  var vi=-1; headers.forEach(function(h,i){ if(vi<0 && /(vat|iva|mwst|tax)/i.test(String(h==null?"":h))) vi=i; });
  if(vi<0) return {vatCol:-1, isNet:false};
  var net=0,tot=0; rows.forEach(function(r){ var v=String(r[vi]==null?"":r[vi]).toLowerCase().trim(); if(!v) return; tot++; if(/(net|margin|marg|diff)/.test(v)) net++; });
  return {vatCol:vi, isNet: tot>0 && net/tot>=0.5};
}
function fmtCell(v){
  if(v==null) return "";
  if(v instanceof Date){ return String(v.getFullYear()); } // solo anno (es. prima immatricolazione)
  return String(v).trim();
}
var PDF_SHORT={ "mileage (km)":"Km", "power (kw)":"kW", "power (hp)":"HP", "drivetrain":"Drive", "first reg.":"1st reg.", "first registration":"1st reg.", "first reg":"1st reg." };
function pdfHead(h){ var e=enHead(h); return PDF_SHORT[e.toLowerCase()]||e; }
function listeGo(step){ listeState.step=step; renderListe(); }

function loadScript(src){ return new Promise(function(res,rej){
  if(document.querySelector('script[data-lib="'+src+'"]')){ res(); return; }
  var s=document.createElement("script"); s.src=src; s.setAttribute("data-lib",src);
  s.onload=function(){res();}; s.onerror=function(){rej(new Error("Impossibile caricare "+src));};
  document.head.appendChild(s);
}); }

function parsePrice(v){
  if(typeof v==="number") return v;
  if(v==null) return NaN;
  var s=String(v).trim().replace(/[^0-9.,\-]/g,""); if(s==="") return NaN;
  if(s.indexOf(".")>=0 && s.indexOf(",")>=0){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,"");
  } else if(s.indexOf(",")>=0){
    var p=s.split(","); if(p.length===2 && p[1].length<=2) s=s.replace(",","."); else s=s.replace(/,/g,"");
  } else if(s.indexOf(".")>=0){
    var p2=s.split("."); if(!(p2.length===2 && p2[p2.length-1].length<=2)) s=s.replace(/\./g,"");
  }
  var n=parseFloat(s); return isNaN(n)?NaN:n;
}
function listeNetEUR(price,country,isNet){ return isNet ? price : price/(IVA[country]||IVA.DE); }
function listeExact(price,country,isNet){
  var app=appliedRate(curRaw());
  var costoAuto = listeNetEUR(price,country,isNet)*app*DUTY*CH_VAT + RISK;
  return costoAuto + LISTE_FISSI + listeCfg.transport + listeCfg.margin;
}
/* prezzo finale al cliente: arrotondato ai 100 CHF più vicini */
function listeFinal(price,country,isNet){ return Math.round(listeExact(price,country,isNet)/100)*100; }

function handleListeFile(file){
  var nm=(file.name||"").toLowerCase();
  if(/\.pdf$/.test(nm)){ listeState.error="Per i listini in PDF, inviami il file qui in chat: la lettura automatica dei PDF non è affidabile nel browser."; renderListe(); return; }
  listeState.error=""; listeState.fileName=file.name;
  listeState.step="processing"; listeState.phase="reading"; renderListe();
  loadScript(XLSX_URL).then(function(){ return file.arrayBuffer(); }).then(function(buf){
    var wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});
    // header row = the row with the MOST non-empty cells among the first 20
    var hi=0,best=-1; for(var i=0;i<Math.min(aoa.length,20);i++){ var ne=(aoa[i]||[]).filter(function(x){return String(x).trim()!=="";}).length; if(ne>best){ best=ne; hi=i; } }
    var headers=(aoa[hi]||[]).map(function(h){ return String(h==null?"":h).trim(); });
    var rows=aoa.slice(hi+1).filter(function(r){ return r.some(function(x){return String(x).trim()!=="";}); });
    if(!headers.length || !rows.length){ listeState.error="Non riesco a leggere righe valide da questo file."; listeState.step="upload"; renderListe(); return; }
    var colIdx=[]; headers.forEach(function(h,i){ if(h!=="") colIdx.push(i); });
    var vat=detectVat(headers,rows);
    listeState.headers=headers; listeState.rows=rows; listeState.headerIdx=hi; listeState.colIdx=colIdx; listeState.vatCol=vat.vatCol;
    var price=guessPriceCol(headers);
    var cols=colIdx.filter(function(i){ return i!==price && i!==vat.vatCol && isDefaultCol(headers[i]); });
    if(!cols.length){ cols=colIdx.filter(function(i){return i!==price;}).slice(0,4); }
    listeState.mapping={ price:price, cols:cols, priceType: vat.isNet?"net":"gross" };
    listeGo("map");
  }).catch(function(err){ listeState.error="Errore nella lettura del file. Assicurati che sia un Excel o CSV valido."; listeState.step="upload"; renderListe(); });
}

function runListe(){
  try{
    var m=listeState.mapping, country=listeState.country, isNet=(m.priceType==="net"), H=listeState.headers, rows=listeState.rows, cols=m.cols.slice();
    var app=appliedRate(curRaw());
    var out=[];
    rows.forEach(function(r){
      var g=parsePrice(r[m.price]); if(!(g>0)) return;
      var fin=listeFinal(g,country,isNet);
      out.push({ raw:r, cells: cols.map(function(i){return fmtCell(r[i]);}), gross:g, exact:listeExact(g,country,isNet), final:fin });
    });
    if(!out.length){ listeState.error="Nessun prezzo valido trovato nella colonna scelta."; listeGo("upload"); return; }
    var pdfCols=cols.map(function(i){return pdfHead(H[i]);});
    // internal CSV = full original list + full calc (sheet 1 for the user)
    var csvHead=H.map(function(h,i){return h||("Col "+(i+1));}).concat(["Tipo prezzo","Netto EUR","Cambio","Costo auto CHF","Burocratiche","Collaudo","Immatricolazione","Rischio","Trasporto","Margine EKKECARS","Prezzo calcolato CHF","Prezzo finale CHF (arrot. 100)"]);
    var csvRows=out.map(function(o){
      var netto=listeNetEUR(o.gross,country,isNet), costoAuto=netto*app*DUTY*CH_VAT+RISK;
      return o.raw.map(fmtCsvVal).concat([ isNet?"Netto":"Lordo", r2(netto), String(app).replace(".",","), r2(costoAuto), "300","350","100","500", String(listeCfg.transport), String(listeCfg.margin), r2(o.exact), String(o.final) ]);
    });
    var csv=[csvHead].concat(csvRows).map(function(row){ return row.map(csvCell).join(";"); }).join("\r\n");
    listeState.result={ count:out.length, out:out, pdfCols:pdfCols, csv:"﻿"+csv };
    loadScript(JSPDF_URL).then(function(){
      try{ listeState.result.pdf=buildListePDF(out, pdfCols); }catch(e){ listeState.result.pdfErr=String(e&&e.message||e); }
      listeGo("done");
    }).catch(function(){ listeState.result.pdfErr="PDF non disponibile"; listeGo("done"); });
  }catch(e){ listeState.error="Errore in elaborazione: "+(e&&e.message||e); listeGo("upload"); }
}
function fmtCsvVal(v){ if(v==null) return ""; if(v instanceof Date){ return ("0"+v.getDate()).slice(-2)+"/"+("0"+(v.getMonth()+1)).slice(-2)+"/"+v.getFullYear(); } return String(v); }

function buildListePDF(out, pdfCols){
  var JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; var doc=new JS({unit:"pt",format:"a4",orientation:"landscape"});
  var PW=842, PH=595, MX=24, top=58, bottom=40;
  var ORANGE=[237,113,51], INK=[28,26,23], GREY=[140,132,122], ZEB=[248,246,243];
  var today=new Date(); var ds=("0"+today.getDate()).slice(-2)+"/"+("0"+(today.getMonth()+1)).slice(-2)+"/"+today.getFullYear();
  var tblW=PW-2*MX, PADX=5, MINFS=5.5;
  // colonne: dati scelti + prezzo
  var cols=pdfCols.map(function(h,k){ return {h:String(h), right:false, bold:false, txt:function(o){ return String(o.cells[k]==null?"":o.cells[k]); }}; });
  cols.push({h:"Price (CHF)", right:true, bold:true, txt:function(o){ return "CHF "+nf0.format(o.final); }});
  var rowsTxt=out.map(function(o){ return cols.map(function(c){ return c.txt(o); }); });
  // larghezza che serve a ogni colonna (intestazione in grassetto o valore più lungo), su una sola riga
  function natural(fs){
    doc.setFontSize(fs);
    return cols.map(function(c,k){
      doc.setFont("helvetica","bold"); var w=doc.getTextWidth(c.h);
      doc.setFont("helvetica", c.bold?"bold":"normal");
      for(var i=0;i<rowsTxt.length;i++){ var tw=doc.getTextWidth(rowsTxt[i][k]); if(tw>w) w=tw; }
      return w+2*PADX;
    });
  }
  // auto-fit: il carattere più grande (≤8.5pt) con cui tutte le colonne stanno su una riga
  var FS=8.5, widths=natural(FS), sum=widths.reduce(function(a,b){return a+b;},0);
  while(sum>tblW && FS>MINFS){ FS=Math.round((FS-0.25)*100)/100; widths=natural(FS); sum=widths.reduce(function(a,b){return a+b;},0); }
  var fits = sum<=tblW;
  if(fits){ var extra=(tblW-sum)/widths.length; widths=widths.map(function(w){return w+extra;}); }
  else { widths=widths.map(function(w){return w*tblW/sum;}); } // estremo: scala proporzionale (tronca solo se proprio necessario)
  var rh=Math.max(13, FS*1.9), y;
  function drawHead(){
    doc.setTextColor(ORANGE[0],ORANGE[1],ORANGE[2]); doc.setFont("helvetica","bold"); doc.setFontSize(17);
    doc.text("EKKECARS", MX, 34);
    doc.setTextColor(GREY[0],GREY[1],GREY[2]); doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.text("Price list — "+ds, PW-MX, 34, {align:"right"});
    y=top;
    doc.setFillColor(ZEB[0],ZEB[1],ZEB[2]); doc.rect(MX,y,tblW,rh+4,"F");
    doc.setTextColor(INK[0],INK[1],INK[2]); doc.setFont("helvetica","bold"); doc.setFontSize(FS);
    var x=MX; cols.forEach(function(c,k){ var t=fits?c.h:clip(doc,c.h,widths[k]-2*PADX);
      doc.text(t, c.right?(x+widths[k]-PADX):(x+PADX), y+(rh+4)/2+FS*0.35, c.right?{align:"right"}:undefined); x+=widths[k]; });
    y+=rh+4;
  }
  drawHead();
  rowsTxt.forEach(function(vals,idx){
    if(y+rh>PH-bottom){ doc.addPage(); drawHead(); }
    if(idx%2===1){ doc.setFillColor(ZEB[0],ZEB[1],ZEB[2]); doc.rect(MX,y,tblW,rh,"F"); }
    doc.setFontSize(FS);
    var x=MX;
    cols.forEach(function(c,k){
      doc.setTextColor(INK[0],INK[1],INK[2]);
      doc.setFont("helvetica", c.bold?"bold":"normal");
      var txt=vals[k]; if(!fits) txt=clip(doc,txt,widths[k]-2*PADX);
      doc.text(txt, c.right?(x+widths[k]-PADX):(x+PADX), y+rh/2+FS*0.35, c.right?{align:"right"}:undefined); x+=widths[k]; });
    y+=rh;
  });
  return doc.output("arraybuffer");
}
function clip(doc,txt,w){ if(w<=0) return ""; if(doc.getTextWidth(txt)<=w) return txt; while(txt.length>1 && doc.getTextWidth(txt+"…")>w) txt=txt.slice(0,-1); return txt+"…"; }

function dlSave(filename, data){
  if(!(window.claude&&window.claude.use)){ // fuori da Claude (es. GitHub Pages): download diretto dal browser
    try{ var mime=/\.pdf$/i.test(filename)?"application/pdf":"text/csv;charset=utf-8";
      var url=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement("a");
      a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },4000); toast("File pronto: "+filename);
    }catch(e){ toast("Download non riuscito"); }
    return; }
  window.claude.use("downloads").then(function(dl){
    if(!dl){ toast("Download non disponibile su questa vista"); return; }
    dl.save({filename:filename, data:data}).then(function(){ toast("File pronto: "+filename); }).catch(function(e){ if(e&&e.code==="declined") return; toast("Download non riuscito"); });
  }).catch(function(){ toast("Download non disponibile"); });
}

        '<div class="card of"><div class="card-h"><span class="step">1</span><h3>Cliente</h3></div><div class="card-b"><div id="clientSlot"></div></div></div>'+
        '<div class="card" id="cardVeh"><div class="card-h"><span class="step">2</span><h3>Veicolo</h3></div><div class="card-b"><div class="two">'+
          '<div class="field"><label class="fl">Marca</label><input class="inp" id="brand" placeholder="es. Porsche" autocomplete="off"></div>'+
          '<div class="field"><label class="fl">Modello</label><input class="inp" id="model" placeholder="es. Macan S" autocomplete="off"></div>'+
        '</div></div></div>'+
      '</div>'+

      '<div class="card" id="cardPrice"><div class="card-h"><span class="step">3</span><h3>Origine e prezzo</h3></div><div class="card-b">'+
        '<div class="field"><label class="fl">Paese di origine</label><div class="seg" id="seg">'+
          '<button data-c="DE" class="on">🇩🇪 Germania<span class="ssub">IVA 19% · ÷ 1,19</span></button>'+
          '<button data-c="IT">🇮🇹 Italia<span class="ssub">IVA 22% · ÷ 1,22</span></button>'+
        '</div></div>'+
        '<div class="field"><label class="fl">Prezzo lordo del veicolo (EUR)</label><div class="inp-affix"><span class="cur">€</span><input class="inp money" id="gross" inputmode="decimal" placeholder="50’000" autocomplete="off"></div></div>'+
        '<div id="rateInfo"></div>'+
      '</div></div>'+

      '<div class="card" id="cardAuto"><div class="card-h"><span class="step">4</span><h3>Costo auto (importazione)</h3><span class="sub" id="autoSub"></span></div><div class="card-b"><div id="receiptBody"></div></div></div>'+

      '<div class="card" id="cardImp"><div class="card-h"><span class="step">5</span><h3>Imprevisti</h3><span class="sub">opzionali · da spuntare</span></div><div class="card-b"><div id="impList">'+impHtml+'</div></div></div>'+

      '<div class="card" id="cardCosti"><div class="card-h"><span class="step">6</span><h3>Costi aggiuntivi EKKECARS</h3><span class="sub">sempre inclusi</span></div><div class="card-b">'+
        '<div class="costgrid">'+costRowsHtml+'</div>'+
        '<div class="costsub"><span class="lab">Totale costi aggiuntivi</span><span class="val" id="costiSub">–</span></div>'+
      '</div></div>'+

      '<div class="card" id="cardFinal"><div class="final-grid">'+
        '<div class="final-left">'+
          '<div class="success-badge" id="succBadge" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Calcolo completato</div>'+
          '<div id="totalBody"></div>'+
        '</div>'+
        '<div class="final-right">'+
          '<h4>Vendita e margine</h4>'+
          '<div class="field" style="margin-bottom:4px"><label class="fl">Prezzo di vendita (CHF)</label><div class="inp-affix chf"><span class="cur">CHF</span><input class="inp money" id="sale" inputmode="decimal" placeholder="0" autocomplete="off"></div></div>'+
          '<div id="marginBody"></div>'+
        '</div>'+
      '</div></div>'+

      '<div class="save-bar"><button class="btn" id="cancelBtn">Annulla</button><button class="btn btn-primary" id="saveBtn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Salva calcolo</button></div>'+
    '</div></div>';

  document.getElementById("backBtn").onclick=function(){ go({name:"dashboard"}); };
  document.getElementById("cancelBtn").onclick=function(){ go({name:"dashboard"}); };
  buildClientWidget();

  var brand=document.getElementById("brand"), model=document.getElementById("model");
  brand.value=draft.brand; model.value=draft.model;
  brand.oninput=function(){ draft.brand=brand.value; };
  model.oninput=function(){ draft.model=model.value; };

  document.querySelectorAll("#seg button").forEach(function(b){
    b.onclick=function(){ draft.country=b.getAttribute("data-c");
      document.querySelectorAll("#seg button").forEach(function(x){x.classList.toggle("on",x===b);}); recompute(); };
  });

  var gross=document.getElementById("gross");
  gross.value=draft.gross!=null?num2str(draft.gross):"";
  gross.oninput=function(){ draft.gross=parseNum(gross.value); recompute(); };
  refreshRateInfo();

  // imprevisti
  var impList=document.getElementById("impList");
  impList.querySelectorAll("[data-chk]").forEach(function(b){
    b.onclick=function(){ var idx=+b.getAttribute("data-chk"), it=draft.imprevisti[idx]; it.on=!it.on;
      impList.querySelector('.imp-row[data-idx="'+idx+'"]').classList.toggle("on",it.on);
      var amt=impList.querySelector('[data-amt="'+idx+'"]'); amt.disabled=!it.on; if(it.on) amt.focus(); recompute(); };
  });
  impList.querySelectorAll("[data-amt]").forEach(function(inp){
    inp.oninput=function(){ var idx=+inp.getAttribute("data-amt"); draft.imprevisti[idx].amount=parseNum(inp.value)||0; recompute(); };
  });

  // costi editabili
  app.querySelectorAll("[data-cost]").forEach(function(inp){
    inp.oninput=function(){ draft.extra[inp.getAttribute("data-cost")]=inp.value; recompute(); };
  });

  var sale=document.getElementById("sale");
  sale.value=draft.sale!=null?num2str(draft.sale):"";
  sale.oninput=function(){ draft.sale=parseNum(sale.value); recompute(); };

  document.getElementById("saveBtn").onclick=doSave;
  applyGates(); recompute();
}

function buildClientWidget(){
  var slot=document.getElementById("clientSlot");
  if(draft.clientId){
    var name=draft.clientName||(store.clientById(draft.clientId)||{}).name||"Cliente";
    slot.innerHTML='<div class="selected-client"><div class="avatar">'+esc(initials(name))+'</div><div class="nm">'+esc(name)+'</div><button class="chg" id="chgClient">Cambia</button></div>';
    document.getElementById("chgClient").onclick=function(){ draft.clientId=null; draft.clientName=null; buildClientWidget(); applyGates(); recompute(); };
    return;
  }
  slot.innerHTML='<div class="cs-wrap"><label class="fl">Cerca o crea un cliente</label><input class="inp" id="clientSearch" placeholder="Digita un nome…" autocomplete="off"><div class="cs-panel" id="csPanel"></div></div>';
  var input=document.getElementById("clientSearch"), panel=document.getElementById("csPanel");
  function renderOpts(){
    var q=input.value.trim().toLowerCase();
    var list=store.clients.filter(function(c){return !q||(c.name||"").toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return (a.name||"").localeCompare(b.name||"");});
    var html=list.map(function(c){return '<button class="cs-opt" data-id="'+esc(c.id)+'"><span class="avatar">'+esc(initials(c.name))+'</span>'+esc(c.name)+'</button>';}).join("");
    var exact=store.clients.some(function(c){return (c.name||"").toLowerCase()===q;});
    if(q&&!exact) html+='<button class="cs-opt create" data-create="1"><span class="avatar" style="background:var(--accent);color:var(--accent-ink)">+</span>Crea «'+esc(input.value.trim())+'»</button>';
    if(!html) html='<div style="padding:12px;color:var(--ink-3);font-size:13px">Digita un nome per creare un cliente</div>';
    panel.innerHTML=html;
    panel.querySelectorAll("[data-id]").forEach(function(b){ b.onclick=function(){ selectClient(b.getAttribute("data-id")); }; });
    var cr=panel.querySelector("[data-create]"); if(cr) cr.onclick=function(){ createAndSelect(input.value.trim()); };
  }
  input.onfocus=function(){ panel.classList.add("open"); renderOpts(); };
  input.oninput=function(){ panel.classList.add("open"); renderOpts(); };
  if(!buildClientWidget._bound){
    document.addEventListener("click",function(e){ var p=document.getElementById("csPanel"); if(p&&!e.target.closest("#clientSlot")) p.classList.remove("open"); });
    buildClientWidget._bound=true;
  }
}
function selectClient(id){ var c=store.clientById(id); if(!c)return; draft.clientId=c.id; draft.clientName=c.name; buildClientWidget(); applyGates(); recompute(); }
function createAndSelect(name){ if(!name)return; store.addClient(name).then(function(o){ draft.clientId=o.id; draft.clientName=o.name; buildClientWidget(); applyGates(); recompute(); toast("Cliente «"+o.name+"» creato"); }); }
function calcRefreshClients(){ var input=document.getElementById("clientSearch"); var p=document.getElementById("csPanel"); if(input&&p&&p.classList.contains("open")) input.dispatchEvent(new Event("input")); }

function applyGates(){
  var hasClient=!!draft.clientId;
  ["cardVeh","cardPrice"].forEach(function(id){ document.getElementById(id).classList.toggle("locked",!hasClient); });
}

function recompute(){
  var r=compute(draft);
  updateRateChip();

  var valid=!!draft.clientId && r.gross>0;
  ["cardAuto","cardImp","cardCosti","cardFinal"].forEach(function(id){ document.getElementById(id).classList.toggle("locked",!valid); });
  document.getElementById("succBadge").style.display=valid?"inline-flex":"none";
  document.getElementById("autoSub").textContent=valid?fmtCHF(r.costoAuto):"";

  var body=document.getElementById("receiptBody");
  if(!valid){ body.innerHTML='<div class="placeholder">Seleziona un cliente e inserisci il prezzo lordo per vedere il costo.</div>'; }
  else{
    var ivaLbl=draft.country==="DE"?"19%":"22%";
    body.innerHTML=
      line("Prezzo lordo (EUR)","",fmtEUR(r.gross))+
      line("Prezzo netto ÷ IVA "+ivaLbl,"",fmtEUR(r.netto),"muted")+
      line("Prezzo netto × cambio "+r.app.toFixed(4).replace(".",",")+" (CHF)","",fmtCHF(r.nettoCH))+
      line("Dazio Svizzera (4%)","+",fmtCHF(r.dazioAmt),"add")+
      line("IVA Svizzera (8,1%)","+",fmtCHF(r.vatAmt),"add")+
      line("Rischio","+",fmtCHF(r.risk),"add")+
      line("Costo auto","",fmtCHF(r.costoAuto),"sub");
  }

  // costi aggiuntivi live values
  getDef(draft.mode).rows.forEach(function(row){
    if(row.type==="edit") return;
    var elv=document.querySelector('[data-costval="'+row.key+'"]'); if(elv) elv.textContent=valid?fmtCHF(costAmount(row,r,draft.extra,draft.mode)):"–";
  });
  document.getElementById("costiSub").textContent=valid?fmtCHF(r.costiAgg):"–";

  // total recap
  var tb=document.getElementById("totalBody");
  if(!valid){ tb.innerHTML='<div class="placeholder">Il costo totale comparirà qui.</div>'; }
  else{
    tb.innerHTML=
      line("Costo auto","",fmtCHF(r.costoAuto))+
      (r.impTot>0?line("Imprevisti","+",fmtCHF(r.impTot),"add"):"")+
      line("Costi aggiuntivi","+",fmtCHF(r.costiAgg),"add")+
      '<div class="grand"><span class="lab">Costo totale finito</span><span class="val num">'+fmtCHF(r.costoTotale)+'</span></div>';
  }

  // margin
  var mb=document.getElementById("marginBody");
  if(valid && r.sale>0){
    var pos=r.margineNetto>=0;
    mb.innerHTML=
      mrow("Margine lordo",fmtCHF(r.margineLordo))+
      mrow("IVA sul margine (8,1%)","− "+fmtCHF(r.ivaMargine))+
      '<div class="margin-final '+(pos?"pos":"neg")+'"><div class="mlab">Margine netto</div><div class="mval num">'+fmtCHF(r.margineNetto)+'</div><div class="mpct num">'+fmtPct(r.marginePct)+' sul prezzo di vendita</div></div>';
  } else {
    mb.innerHTML='<div class="placeholder">Inserisci il prezzo di vendita per calcolare il margine.</div>';
  }

  document.getElementById("saveBtn").disabled=!valid;
}
function line(lab,op,val,cls){ return '<div class="rline '+(cls||"")+'"><span class="lab"><span class="op">'+(op||"")+'</span>'+esc(lab)+'</span><span class="val">'+val+'</span></div>'; }
function mrow(lab,val){ return '<div class="mrow"><span class="lab">'+esc(lab)+'</span><span class="val">'+val+'</span></div>'; }

function doSave(){
  var r=compute(draft);
  if(!draft.clientId||!(r.gross>0)) return;
  var costiList=getDef(draft.mode).rows.map(function(row){ return {key:row.key,label:row.label,type:row.type,amount:costAmount(row,r,draft.extra,draft.mode)}; });
  var calc={
    id:draft.id||uid(), createdAt:Date.now(), mode:draft.mode,
    clientId:draft.clientId, clientName:draft.clientName,
    brand:(draft.brand||"").trim(), model:(draft.model||"").trim(),
    country:draft.country, gross:r.gross, iva:r.iva, rawRate:r.raw, appliedRate:r.app,
    netto:r.netto, nettoCH:r.nettoCH, dazioAmt:r.dazioAmt, nettoDazio:r.nettoDazio,
    vatAmt:r.vatAmt, lordoCH:r.lordoCH, risk:r.risk, costoAuto:r.costoAuto,
    imprevisti:draft.imprevisti.filter(function(i){return i.on&&i.amount>0;}).map(function(i){return {key:i.key,label:i.label,amount:i.amount};}),
    impTot:r.impTot,
    costi:costiList, interesse:r.interesse, costiAgg:r.costiAgg,
    costoTotale:r.costoTotale,
    sale:(r.sale>0?r.sale:null), margineLordo:r.margineLordo, ivaMargine:r.ivaMargine, margineNetto:r.margineNetto, marginePct:r.marginePct
  };
  document.getElementById("saveBtn").disabled=true;
  store.saveCalc(calc).then(function(){ toast("Calcolo salvato"); go({name:"client",id:calc.clientId}); });
}

/* ============ CLIENT DETAIL ============ */
function renderClient(id){
  var cl=store.clientById(id); if(!cl){ go({name:"dashboard"}); return; }
  var mode=state.mode;
  var calcs=store.calcsForClient(id).filter(function(c){return calcMode(c)===mode;});
  var withSale=calcs.filter(function(c){return c.sale>0;});
  var totMargin=withSale.reduce(function(s,c){return s+(c.margineNetto||0);},0);

  var deals=calcs.map(function(c){
    var pos=c.margineNetto!=null&&c.margineNetto>=0;
    var impChips=(c.imprevisti||[]).length? '<div class="chips-block"><div class="k">Imprevisti</div><div class="chips">'+(c.imprevisti||[]).map(function(i){return '<span class="chip"><span class="lbl">'+esc(i.label)+'</span><b>'+fmtCHF(i.amount)+'</b></span>';}).join("")+'</div></div>':'';
    var costChips=(c.costi||[]).length? '<div class="chips-block"><div class="k">Costi aggiuntivi</div><div class="chips">'+(c.costi||[]).filter(function(x){return x.amount>0;}).map(function(x){return '<span class="chip"><span class="lbl">'+esc(x.label)+'</span><b>'+fmtCHF(x.amount)+'</b></span>';}).join("")+'</div></div>':'';
    return '<div class="deal">'+
      '<div class="deal-h"><span class="flag">'+esc(c.country)+'</span><span class="title">'+esc(((c.brand||"")+" "+(c.model||"")).trim()||"Veicolo")+'</span><span class="sp"></span><span class="date">'+fmtDate(c.createdAt)+'</span>'+
        '<button class="btn btn-danger" data-del="'+esc(c.id)+'" style="padding:7px 10px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div>'+
      '<div class="deal-b">'+
        dcell("Costo auto",fmtCHF(c.costoAuto))+
        dcell("Costo totale",fmtCHF(c.costoTotale))+
        dcell("Vendita",c.sale>0?fmtCHF(c.sale):"—")+
        dcell("Margine netto",c.sale>0?(fmtCHF(c.margineNetto)+" · "+fmtPct(c.marginePct)):"—",c.sale>0?(pos?"good":"bad"):"")+
      '</div>'+impChips+costChips+
    '</div>';
  }).join("");
  if(!calcs.length) deals='<div class="empty"><div>Nessun calcolo per questo cliente.</div></div>';

  app.innerHTML='<div class="wrap">'+
    '<button class="back" id="backBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Dashboard '+esc(mode.toUpperCase())+'</button>'+
    '<div class="cd-head"><div class="avatar">'+esc(initials(cl.name))+'</div>'+
      '<div><h1>'+esc(cl.name)+'</h1><div class="csub">'+calcs.length+' calcol'+(calcs.length===1?"o":"i")+(withSale.length?' · margine netto totale '+fmtCHF(totMargin):"")+'</div></div>'+
      '<div class="sp" style="flex:1"></div>'+
      '<button class="btn btn-primary" id="newForClient"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nuovo calcolo</button>'+
      '<button class="btn btn-danger" id="delClient" style="margin-left:8px">Elimina cliente</button>'+
    '</div>'+deals+'</div>';

  document.getElementById("backBtn").onclick=function(){ go({name:"dashboard"}); };
  document.getElementById("newForClient").onclick=function(){ startCalc(); draft.clientId=cl.id; draft.clientName=cl.name; go({name:"calc"}); };
  document.getElementById("delClient").onclick=function(){ confirmDialog("Eliminare «"+cl.name+"» e tutti i suoi calcoli?",function(){ store.deleteClient(cl.id).then(function(){ toast("Cliente eliminato"); go({name:"dashboard"}); }); }); };
  app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ confirmDialog("Eliminare questo calcolo?",function(){ store.deleteCalc(b.getAttribute("data-del")).then(function(){toast("Calcolo eliminato");}); }); }; });
}
function dcell(k,v,tone){ var col=tone==="good"?'style="color:var(--good)"':tone==="bad"?'style="color:var(--bad)"':""; return '<div class="deal-cell"><div class="k">'+esc(k)+'</div><div class="v" '+col+'>'+v+'</div></div>'; }

/* ============ THEME ============ */
function initTheme(){
  var saved=ls_get("ekke_theme",""); if(saved==="dark"||saved==="light") document.documentElement.setAttribute("data-theme",saved);
  paintThemeBtn();
  document.getElementById("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var isDark=cur==="dark"||(!cur&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next=isDark?"light":"dark"; document.documentElement.setAttribute("data-theme",next); ls_set("ekke_theme",next); paintThemeBtn();
  };
}
function paintThemeBtn(){
  var cur=document.documentElement.getAttribute("data-theme");
  var isDark=cur==="dark"||(!cur&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  var moon='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
  var sun='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
  document.getElementById("themeBtn").innerHTML=isDark?sun:moon;
}

/* ============ BOOT ============ */
initTheme();
document.getElementById("brandBtn").onclick=function(){ go({name:"home"}); };
(function(){ var r=parseFloat(ls_get("ekke_rate_raw","")); if(r>0){ state.rate={raw:r, date:ls_get("ekke_rate_date",""), updatedAt:parseInt(ls_get("ekke_rate_upd","0"),10)||null}; } })();
document.getElementById("rateChip").onclick=function(){ openRateEditor(); };
store.init();          // local-first: marks ready synchronously, syncs the shared DB in the background
updateRateChip();
renderMain();          // renders immediately from local data — no blocking spinner
</script>
